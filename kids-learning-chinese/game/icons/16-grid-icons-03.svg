<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 592" width="592" height="592">
  <style>
    .l { fill:none; stroke:#5B8FE8; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .f { fill:#5B8FE8; }
  </style>

  <!-- 33. Block — sequencing / programming town L1 -->
  <g id="icon-block" data-name="block" transform="translate(86, 86)">
    <rect class="l" x="-16" y="-6" rx="3" width="32" height="24"/>
    <rect class="l" x="-6" y="-14" rx="2" width="12" height="8"/>
  </g>

  <!-- 34. Variable Box — variables concept (L4) -->
  <g id="icon-variable" data-name="variable" transform="translate(226, 86)">
    <rect class="l" x="-18" y="-14" rx="3" width="36" height="28"/>
    <circle class="l" cx="-6" cy="2" r="3.5"/>
    <line class="l" x1="6" y1="-6" x2="14" y2="10"/>
    <line class="l" x1="14" y1="-6" x2="6" y2="10"/>
  </g>

  <!-- 35. Pencil — edit / draw -->
  <g id="icon-pencil" data-name="pencil" transform="translate(366, 86)">
    <rect class="l" x="-3" y="-20" rx="1" width="6" height="5"/>
    <rect class="l" x="-2.5" y="-15" rx="1" width="5" height="26"/>
    <polygon class="l" points="-2.5,11 0,20 2.5,11"/>
  </g>

  <!-- 36. Flag — goal / finish -->
  <g id="icon-flag" data-name="flag" transform="translate(506, 86)">
    <line class="l" x1="-12" y1="24" x2="-12" y2="-18"/>
    <polygon class="l" points="-12,-18 -12,-6 14,-12"/>
  </g>

  <!-- 37. Upload — upload / share -->
  <g id="icon-upload" data-name="upload" transform="translate(86, 226)">
    <line class="l" x1="0" y1="14" x2="0" y2="-12"/>
    <polyline class="l" points="-10,-2 0,-14 10,-2"/>
    <line class="l" x1="-18" y1="20" x2="18" y2="20"/>
  </g>

  <!-- 38. Download — download / save -->
  <g id="icon-download" data-name="download" transform="translate(226, 226)">
    <line class="l" x1="0" y1="-14" x2="0" y2="12"/>
    <polyline class="l" points="-10,2 0,14 10,2"/>
    <line class="l" x1="-18" y1="20" x2="18" y2="20"/>
  </g>

  <!-- 39. Search — magnifying glass -->
  <g id="icon-search" data-name="search" transform="translate(366, 226)">
    <circle class="l" cx="-6" cy="-6" r="14"/>
    <line class="l" x1="6" y1="6" x2="20" y2="20"/>
  </g>

  <!-- 40. Filter — funnel / sort -->
  <g id="icon-filter" data-name="filter" transform="translate(506, 226)">
    <polygon class="l" points="-18,-20 18,-20 6,6 6,20 -6,20 -6,6"/>
  </g>

  <!-- 41. Bookmark — save for later -->
  <g id="icon-bookmark" data-name="bookmark" transform="translate(86, 366)">
    <polygon class="l" points="-10,-18 10,-18 10,16 0,6 -10,16"/>
  </g>

  <!-- 42. Pin — location marker -->
  <g id="icon-pin" data-name="pin" transform="translate(226, 366)">
    <path class="l" d="M 0 -24 C -14 -24, -14 -8, 0 6 C 14 -8, 14 -24, 0 -24 Z"/>
    <circle class="f" cx="0" cy="-14" r="4"/>
  </g>

  <!-- 43. Cloud — online / cloud save -->
  <g id="icon-cloud" data-name="cloud" transform="translate(366, 366)">
    <path class="l" d="M -10 2 Q -20 2, -20 -6 Q -20 -14, -10 -12 Q -8 -20, 2 -20 Q 12 -20, 10 -12 Q 20 -12, 20 -4 Q 20 2, 10 2 Z"/>
  </g>

  <!-- 44. Chat — message / feedback -->
  <g id="icon-chat" data-name="chat" transform="translate(506, 366)">
    <path class="l" d="M -18 -16 L 18 -16 Q 22 -16, 22 -12 L 22 8 Q 22 12, 18 12 L 4 12 L -4 22 L -4 12 L -18 12 Q -22 12, -22 8 L -22 -12 Q -22 -16, -18 -16 Z"/>
  </g>

  <!-- 45. User — profile / avatar -->
  <g id="icon-user" data-name="user" transform="translate(86, 506)">
    <circle class="l" cx="0" cy="-12" r="8"/>
    <path class="l" d="M -16 24 C -16 8, 16 8, 16 24 Z"/>
  </g>

  <!-- 46. Calendar — date / schedule -->
  <g id="icon-calendar" data-name="calendar" transform="translate(226, 506)">
    <rect class="l" x="-16" y="-14" rx="3" width="32" height="28"/>
    <line class="l" x1="-16" y1="-4" x2="16" y2="-4"/>
    <line class="l" x1="-6" y1="-18" x2="-6" y2="-10"/>
    <line class="l" x1="6" y1="-18" x2="6" y2="-10"/>
  </g>

  <!-- 47. Camera — photo / screenshot -->
  <g id="icon-camera" data-name="camera" transform="translate(366, 506)">
    <rect class="l" x="-18" y="-8" rx="4" width="36" height="22"/>
    <circle class="l" cx="0" cy="3" r="9"/>
    <path class="l" d="M -8 -8 L -4 -14 L 4 -14 L 8 -8"/>
  </g>

  <!-- 48. Info — information / help -->
  <g id="icon-info" data-name="info" transform="translate(506, 506)">
    <circle class="l" cx="0" cy="0" r="18"/>
    <line class="l" x1="0" y1="-6" x2="0" y2="-4"/>
    <line class="l" x1="0" y1="2" x2="0" y2="12"/>
    <circle class="f" cx="0" cy="-2" r="1.5"/>
  </g>

</svg>
