<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 592" width="592" height="592">
  <style>
    .l { fill:none; stroke:#5B8FE8; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .f { fill:#5B8FE8; }
  </style>

  <!-- 17. Play — start game -->
  <g id="icon-play" data-name="play" transform="translate(86, 86)">
    <polygon class="l" points="-14,-22 -14,22 24,0"/>
  </g>

  <!-- 18. Refresh — restart / retry -->
  <g id="icon-refresh" data-name="refresh" transform="translate(226, 86)">
    <path class="l" d="M 0 -22 A 22 22 0 1 1 -18 12"/>
    <polygon class="l" points="-22,16 -14,16 -20,8"/>
  </g>

  <!-- 19. Shield — protection powerup -->
  <g id="icon-shield" data-name="shield" transform="translate(366, 86)">
    <path class="l" d="M 0 -26 L 24 -8 L 24 8 Q 20 22, 0 26 Q -20 22, -24 8 L -24 -8 Z"/>
    <path class="l" d="M -8 2 L -4 8 L 12 -6"/>
  </g>

  <!-- 20. Lightning — speed boost powerup -->
  <g id="icon-lightning" data-name="lightning" transform="translate(506, 86)">
    <polygon class="l" points="2,-26 -12,2 4,2 -8,26 18,0 2,0"/>
  </g>

  <!-- 21. Lock — locked level -->
  <g id="icon-lock" data-name="lock" transform="translate(86, 226)">
    <rect class="l" x="-10" y="2" rx="3" width="20" height="20"/>
    <path class="l" d="M -6 2 L -6 -6 A 6 6 0 0 1 6 -6 L 6 2"/>
    <circle class="f" cx="0" cy="12" r="2.5"/>
    <line class="l" x1="0" y1="14" x2="0" y2="18"/>
  </g>

  <!-- 22. Checkmark — correct / level pass -->
  <g id="icon-check" data-name="check" transform="translate(226, 226)">
    <polyline class="l" points="-22,0 -6,18 22,-18"/>
  </g>

  <!-- 23. Close / X — dismiss / wrong -->
  <g id="icon-close" data-name="close" transform="translate(366, 226)">
    <line class="l" x1="-16" y1="-16" x2="16" y2="16"/>
    <line class="l" x1="16" y1="-16" x2="-16" y2="16"/>
  </g>

  <!-- 24. Trophy — achievement -->
  <g id="icon-trophy" data-name="trophy" transform="translate(506, 226)">
    <path class="l" d="M -14 20 L -10 -4 L 10 -4 L 14 20 Z"/>
    <path class="l" d="M -14 6 Q -22 6, -22 -4 Q -22 -8, -12 -6"/>
    <path class="l" d="M 14 6 Q 22 6, 22 -4 Q 22 -8, 12 -6"/>
  </g>

  <!-- 25. Apple — keyboard-game collectible -->
  <g id="icon-apple" data-name="apple" transform="translate(86, 366)">
    <path class="l" d="M 0 20 Q -18 8, -14 -4 Q -10 -14, 0 -12 Q 10 -14, 14 -4 Q 18 8, 0 20 Z"/>
    <line class="l" x1="0" y1="-12" x2="0" y2="-18"/>
    <path class="l" d="M 0 -17 Q 6 -22, 10 -17 Q 6 -14, 0 -17 Z"/>
  </g>

  <!-- 26. Coin — gold miner currency -->
  <g id="icon-coin" data-name="coin" transform="translate(226, 366)">
    <circle class="l" cx="0" cy="0" r="18"/>
    <circle class="l" cx="0" cy="0" r="6"/>
    <line class="l" x1="-6" y1="-6" x2="6" y2="6"/>
    <line class="l" x1="-6" y1="6" x2="6" y2="-6"/>
  </g>

  <!-- 27. Lightbulb — hint / idea -->
  <g id="icon-bulb" data-name="bulb" transform="translate(366, 366)">
    <path class="l" d="M -10 2 C -10 -14, 10 -14, 10 2 C 10 10, 5 14, 5 16 L -5 16 C -5 14, -10 10, -10 2 Z"/>
    <line class="l" x1="-6" y1="18" x2="6" y2="18"/>
    <path class="l" d="M -3 7 C -1 4, 1 4, 3 7"/>
  </g>

  <!-- 28. Rocket — bonus reward -->
  <g id="icon-rocket" data-name="rocket" transform="translate(506, 366)">
    <path class="l" d="M 0 -26 L 10 -2 L 10 14 L 0 22 L -10 14 L -10 -2 Z"/>
    <circle class="l" cx="0" cy="-2" r="5"/>
    <path class="l" d="M -6 22 L 0 30 L 6 22"/>
  </g>

  <!-- 29. Forward Arrow — next level -->
  <g id="icon-forward" data-name="forward" transform="translate(86, 506)">
    <line class="l" x1="-22" y1="0" x2="22" y2="0"/>
    <polyline class="l" points="22,0 6,-16"/>
    <polyline class="l" points="22,0 6,16"/>
  </g>

  <!-- 30. Eye — visible / parent monitoring -->
  <g id="icon-eye" data-name="eye" transform="translate(226, 506)">
    <path class="l" d="M -26 0 Q 0 -14, 26 0 Q 0 14, -26 0 Z"/>
    <circle class="f" cx="0" cy="0" r="4"/>
  </g>

  <!-- 31. Plus — add / zoom in -->
  <g id="icon-plus" data-name="plus" transform="translate(366, 506)">
    <line class="l" x1="-18" y1="0" x2="18" y2="0"/>
    <line class="l" x1="0" y1="-18" x2="0" y2="18"/>
  </g>

  <!-- 32. Target — crosshair / precision -->
  <g id="icon-target" data-name="target" transform="translate(506, 506)">
    <circle class="l" cx="0" cy="0" r="18"/>
    <circle class="l" cx="0" cy="0" r="8"/>
    <circle class="f" cx="0" cy="0" r="2"/>
    <line class="l" x1="0" y1="-18" x2="0" y2="-24"/>
    <line class="l" x1="0" y1="18" x2="0" y2="24"/>
    <line class="l" x1="-18" y1="0" x2="-24" y2="0"/>
    <line class="l" x1="18" y1="0" x2="24" y2="0"/>
  </g>

</svg>
