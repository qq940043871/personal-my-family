<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架子鼓</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.drums{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;padding:30px;max-width:600px}
.drum{width:100px;height:100px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2.5em;transition:transform 0.1s;user-select:none;border:4px solid rgba(255,255,255,0.2)}
.drum:active{transform:scale(0.9)}
.drum.hit{animation:hitAnim 0.15s}
@keyframes hitAnim{50%{transform:scale(1.2)}}
.keys{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.key-hint{background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:5px;font-size:0.8em}
.seq{display:flex;gap:5px;justify-content:center;margin:15px 0}
.seq-step{width:30px;height:30px;background:rgba(255,255,255,0.1);border-radius:5px;cursor:pointer}
.seq-step.active{background:#4D96FF}
.seq-step.playing{background:#FFD93D}
.controls{display:flex;gap:10px;margin:10px 0}
.ctrl{padding:8px 20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🥁 架子鼓</h2>
<div></div>
</div>
<div class="drums" id="drums"></div>
<div class="keys" id="keys"></div>
<div class="seq" id="seq"></div>
<div class="controls">
<button class="ctrl" onclick="playSeq()">▶ 播放节拍</button>
<button class="ctrl" onclick="clearSeq()">🗑️ 清除</button>
<button class="ctrl" onclick="toggleMetronome()">🎵 节拍器</button>
</div>

<script>
const drumData=[
{name:'底鼓',emoji:'🥁',freq:80,key:'a',color:'#FF6B6B'},
{name:'军鼓',emoji:'🪘',freq:200,key:'s',color:'#FFD93D'},
{name:'踩镲',emoji:'🔔',freq:800,key:'d',color:'#6BCB77'},
{name:'强音镲',emoji:'🔊',freq:1200,key:'f',color:'#4D96FF'},
{name:'高音鼓',emoji:'🎵',freq:400,key:'g',color:'#C084FC'},
{name:'低音鼓',emoji:'🎶',freq:150,key:'h',color:'#FF9800'}
];
let sequence=Array(16).fill(null);
let metronomeOn=false,metronomeInterval;
function init(){
const drumsDiv=document.getElementById('drums');drumsDiv.innerHTML='';
const keysDiv=document.getElementById('keys');keysDiv.innerHTML='';
drumData.forEach((d,i)=>{
const drum=document.createElement('div');drum.className='drum';
drum.style.background=d.color;drum.id='drum-'+i;drum.textContent=d.emoji;
drum.addEventListener('mousedown',()=>playDrum(i));
drum.addEventListener('touchstart',e=>{e.preventDefault();playDrum(i)},{passive:false});
drumsDiv.appendChild(drum);
const hint=document.createElement('span');hint.className='key-hint';hint.textContent=d.key.toUpperCase();
keysDiv.appendChild(hint);
});
const seqDiv=document.getElementById('seq');seqDiv.innerHTML='';
for(let i=0;i<16;i++){
const step=document.createElement('div');step.className='seq-step';step.dataset.index=i;
step.addEventListener('click',()=>{
if(sequence[i]===null)sequence[i]=0;else{sequence[i]++;if(sequence[i]>=drumData.length)sequence[i]=null}
renderSeq();
});
seqDiv.appendChild(step);
}
}
function renderSeq(){
document.querySelectorAll('.seq-step').forEach((s,i)=>{
s.classList.toggle('active',sequence[i]!==null);
s.style.background=sequence[i]!==null?drumData[sequence[i]].color:'';
});
}
function playDrum(i){
const d=drumData[i];
const el=document.getElementById('drum-'+i);el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),150);
try{
const ctx=new(AudioContext||webkitAudioContext)();
const osc=ctx.createOscillator();const gain=ctx.createGain();
osc.type='sine';osc.frequency.value=d.freq;gain.gain.value=0.3;
osc.connect(gain);gain.connect(ctx.destination);
osc.start();gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
osc.stop(ctx.currentTime+0.2);
// noise burst
const buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
const data=buf.getChannelData(0);for(let j=0;j<data.length;j++)data[j]=(Math.random()*2-1)*0.3;
const noise=ctx.createBufferSource();noise.buffer=buf;
const nGain=ctx.createGain();nGain.gain.value=0.15;
noise.connect(nGain);nGain.connect(ctx.destination);noise.start();
}catch(e){}
}
let seqPlaying=false,seqIndex=0;
function playSeq(){
if(seqPlaying)return;seqPlaying=true;seqIndex=0;
const interval=setInterval(()=>{
document.querySelectorAll('.seq-step').forEach((s,i)=>s.classList.toggle('playing',i===seqIndex));
if(sequence[seqIndex]!==null)playDrum(sequence[seqIndex]);
seqIndex++;if(seqIndex>=16){clearInterval(interval);seqPlaying=false;document.querySelectorAll('.seq-step').forEach(s=>s.classList.remove('playing'))}
},150);
}
function clearSeq(){sequence.fill(null);renderSeq()}
function toggleMetronome(){
metronomeOn=!metronomeOn;
if(metronomeOn){metronomeInterval=setInterval(()=>playDrum(2),500)}
else{clearInterval(metronomeInterval)}
}
document.addEventListener('keydown',e=>{
const idx=drumData.findIndex(d=>d.key===e.key.toLowerCase());
if(idx>=0){playDrum(idx);e.preventDefault()}
});
init();
</script>
</body>
</html>
