<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字泡泡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#1a237e,#283593);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4D96FF,#667eea);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">下一个: <span id="next">1</span></div></div>
</div>
<canvas id="game" width="500" height="500"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🫧 数字泡泡</h1><p>按顺序点击 1-20 的泡泡<br>点错扣分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 完成！</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=500,H=500;
let bubbles,nextNum,score,running;
const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FF9800','#00BCD4'];
function init(){
bubbles=[];nextNum=1;score=0;running=true;
document.getElementById('score').textContent=0;
document.getElementById('next').textContent=1;
for(let i=1;i<=20;i++){
let x,y,r=30,attempts=0;
do{x=r+Math.random()*(W-2*r);y=r+Math.random()*(H-2*r);attempts++}
while(attempts<100&&bubbles.some(b=>Math.sqrt((b.x-x)**2+(b.y-y)**2)<b.r+r+10));
bubbles.push({x,y,r,num:i,color:colors[(i-1)%colors.length],alive:true});
}
}
function draw(){
X.fillStyle='#1a237e';X.fillRect(0,0,W,H);
bubbles.forEach(b=>{
if(!b.alive)return;
X.fillStyle=b.color;X.shadowColor=b.color;X.shadowBlur=10;
X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();
X.shadowBlur=0;
X.fillStyle='#fff';X.font='bold 24px sans-serif';X.textAlign='center';X.textBaseline='middle';
X.fillText(b.num,b.x,b.y);
});
}
function handleClick(e){
if(!running)return;
const r=C.getBoundingClientRect();
const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
for(const b of bubbles){
if(!b.alive)continue;
if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){
if(b.num===nextNum){
b.alive=false;score+=10;nextNum++;
document.getElementById('score').textContent=score;
document.getElementById('next').textContent=nextNum<=20?nextNum:'完成!';
playSound(600,0.1);
if(nextNum>20){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');playSound(800,0.3)}
}else{score=Math.max(0,score-5);document.getElementById('score').textContent=score;playSound(200,0.1)}
break;
}
}
}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();draw()}
C.addEventListener('click',handleClick);
C.addEventListener('touchstart',e=>{e.preventDefault();handleClick({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY})},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
