<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喷气背包</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px;cursor:pointer}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF9800,#F57C00);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">距离: <span id="score">0</span>m</div><div class="info-item">⭐ <span id="stars">0</span></div></div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🎒 喷气背包</h1><p>按住屏幕/空格飞升<br>松开下落，收集星星！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>距离: <span id="final">0</span>m · ⭐ <span id="finalStars">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=400,GND=H-20;
let player,obstacles,stars,score,starCount,running,scrollX,goingUp,particles;
function init(){
player={x:100,y:H/2,vy:0};obstacles=[];stars=[];score=0;starCount=0;running=true;scrollX=0;goingUp=false;particles=[];
for(let i=0;i<5;i++){genObs(W+i*200);if(i<3)genStar(W+i*150)}
document.getElementById('score').textContent=0;document.getElementById('stars').textContent=0;
}
function genObs(x){obstacles.push({x,y:GND-40-Math.random()*100,w:30,h:40+Math.random()*60})}
function genStar(x){stars.push({x,y:50+Math.random()*(H-100),r:12})}
function drawBg(){
const grad=X.createLinearGradient(0,0,0,H);
grad.addColorStop(0,'#1a0a2e');grad.addColorStop(1,'#2d1b4e');
X.fillStyle=grad;X.fillRect(0,0,W,H);
X.fillStyle='#3E2723';X.fillRect(0,GND,W,H-GND);
}
function drawPlayer(){
X.save();X.translate(player.x,player.y);
X.fillStyle='#FF9800';X.beginPath();X.ellipse(0,0,15,12,0,0,Math.PI*2);X.fill();
X.fillStyle='#FFD93D';X.beginPath();X.arc(0,-8,8,0,Math.PI*2);X.fill();
X.fillStyle='#333';X.fillRect(-3,-10,2,3);X.fillRect(2,-10,2,3);
// jetpack
X.fillStyle='#795548';X.fillRect(-18,-5,8,15);
if(goingUp){
X.fillStyle='#FF6B6B';X.shadowColor='#FF6B6B';X.shadowBlur=10;
X.beginPath();X.moveTo(-18,10);X.lineTo(-14,10+Math.random()*15);X.lineTo(-10,10);X.fill();
X.shadowBlur=0;
}
X.restore();
}
function drawObs(){
obstacles.forEach(o=>{
X.fillStyle='#5D4037';X.fillRect(o.x,o.y,o.w,o.h);
X.fillStyle='#795548';X.fillRect(o.x+3,o.y+3,o.w-6,o.h-6);
X.fillStyle='#F44336';X.fillRect(o.x+o.w/2-5,o.y,10,5);
});
}
function drawStars(){
stars.forEach(s=>{
X.fillStyle='#FFD93D';X.shadowColor='#FFD93D';X.shadowBlur=8;
X.font='24px serif';X.textAlign='center';X.textBaseline='middle';
X.fillText('⭐',s.x,s.y);X.shadowBlur=0;
});
}
function drawParticles(){
particles.forEach(p=>{X.globalAlpha=p.life;X.fillStyle=p.color;X.fillRect(p.x,p.y,3,3)});X.globalAlpha=1;
}
function update(){
if(!running)return;
scrollX++;score=Math.floor(scrollX/10);
document.getElementById('score').textContent=score;
if(goingUp)player.vy-=0.5;
else player.vy+=0.3;
player.vy=Math.max(-8,Math.min(8,player.vy));
player.y+=player.vy;
if(player.y>GND-15){player.y=GND-15;player.vy=0}
if(player.y<15){player.y=15;player.vy=0}
if(goingUp)particles.push({x:player.x-15,y:player.y+10,vx:-2+Math.random(),vy:Math.random()*2,life:1,color:'#FF6B6B'});
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05});
particles=particles.filter(p=>p.life>0);
obstacles.forEach(o=>{
o.x-=4;
if(player.x+12>o.x&&player.x-12<o.x+o.w&&player.y+10>o.y&&player.y-10<o.y+o.h){
running=false;document.getElementById('final').textContent=score;document.getElementById('finalStars').textContent=starCount;document.getElementById('over').classList.remove('hidden');playSound(200,0.3);
}
});
stars.forEach((s,i)=>{
s.x-=4;
if(Math.abs(player.x-s.x)<20&&Math.abs(player.y-s.y)<25){starCount++;document.getElementById('stars').textContent=starCount;stars.splice(i,1);playSound(700,0.1)}
});
obstacles=obstacles.filter(o=>o.x>-50);stars=stars.filter(s=>s.x>-30);
if(obstacles.length<5)genObs(obstacles[obstacles.length-1].x+180+Math.random()*100);
if(stars.length<3)genStar(stars[stars.length-1].x+120+Math.random()*100);
}
function draw(){drawBg();drawObs();drawStars();drawParticles();drawPlayer()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){goingUp=true;e.preventDefault()}});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp')goingUp=false});
C.addEventListener('mousedown',()=>goingUp=true);
C.addEventListener('mouseup',()=>goingUp=false);
C.addEventListener('touchstart',e=>{e.preventDefault();goingUp=true},{passive:false});
C.addEventListener('touchend',()=>goingUp=false);
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
