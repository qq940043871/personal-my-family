<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡龙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4ECDC4,#44CF6C);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div></div>
</div>
<canvas id="game" width="400" height="600"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🫧 泡泡龙</h1><p>瞄准并射出泡泡<br>3个以上相同泡泡连在一起消除！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=400,H=600,R=18,COLS=10,ROWS=15;
const COLORS=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FF9800'];
let grid,shooter,nextBubble,aimAngle,running,score,shootBubble;
function init(){
grid=[];score=0;running=true;aimAngle=-Math.PI/2;
for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
if(r<5){grid[r][c]={color:COLORS[Math.floor(Math.random()*4)],alive:true}}
else grid[r][c]=null;
}}
nextBubble=COLORS[Math.floor(Math.random()*4)];
newShooter();
document.getElementById('score').textContent=0;
}
function newShooter(){
shooter={x:W/2,y:H-40,color:nextBubble};
nextBubble=COLORS[Math.floor(Math.random()*4)];
shootBubble=null;
}
function getPos(r,c){return{x:c*R*2+(r%2===0?0:R)+R,y:r*R*1.73+R}}
function getGrid(x,y){
const r=Math.round((y-R)/(R*1.73));
const c=Math.round((x-(r%2===0?0:R)-R)/(R*2));
return{r,c};
}
function findConnected(r,c,color,visited){
const key=r+','+c;if(visited.has(key))return[];
visited.add(key);const result=[{r,c}];
const neighbors=getNeighbors(r,c);
neighbors.forEach(([nr,nc])=>{
if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr]&&grid[nr][nc]&&grid[nr][nc].color===color){
result.push(...findConnected(nr,nc,color,visited));
}
});
return result;
}
function getNeighbors(r,c){
const even=r%2===0;
return even?[[r-1,c-1],[r-1,c],[r,c-1],[r,c+1],[r+1,c-1],[r+1,c]]
:[[r-1,c],[r-1,c+1],[r,c-1],[r,c+1],[r+1,c],[r+1,c+1]];
}
function shoot(){
if(shootBubble||!running)return;
shootBubble={x:shooter.x,y:shooter.y,vx:Math.cos(aimAngle)*10,vy:Math.sin(aimAngle)*10,color:shooter.color};
playSound(500,0.05);
}
function update(){
if(!running)return;
if(!shootBubble)return;
shootBubble.x+=shootBubble.vx;
shootBubble.y+=shootBubble.vy;
if(shootBubble.x<R||shootBubble.x>W-R)shootBubble.vx*=-1;
if(shootBubble.y<R){
snapBubble(shootBubble);shootBubble=null;newShooter();return;
}
// check collision with grid
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(!grid[r]||!grid[r][c])continue;
const p=getPos(r,c);
const dx=shootBubble.x-p.x,dy=shootBubble.y-p.y;
if(Math.sqrt(dx*dx+dy*dy)<R*1.8){
snapBubble(shootBubble);shootBubble=null;newShooter();return;
}
}
}
function snapBubble(b){
const{r,c}=getGrid(b.x,b.y);
if(r<0||r>=ROWS||c<0||c>=COLS)return;
if(!grid[r])grid[r]=[];
grid[r][c]={color:b.color,alive:true};
const connected=findConnected(r,c,b.color,new Set());
if(connected.length>=3){
connected.forEach(({r,c})=>{grid[r][c]=null});
score+=connected.length*10;
document.getElementById('score').textContent=score;
playSound(700,0.2);
// drop floating
dropFloating();
}
// check game over
if(r>=ROWS-2){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
}
function dropFloating(){
// simple: remove bubbles not connected to top
const connected=new Set();
for(let c=0;c<COLS;c++){
if(grid[0]&&grid[0][c])flood(0,c,connected);
}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(grid[r]&&grid[r][c]&&!connected.has(r+','+c)){grid[r][c]=null;score+=5}
}
document.getElementById('score').textContent=score;
}
function flood(r,c,set){
const key=r+','+c;if(set.has(key))return;if(!grid[r]||!grid[r][c])return;
set.add(key);
getNeighbors(r,c).forEach(([nr,nc])=>flood(nr,nc,set));
}
function draw(){
X.fillStyle='#0a0a2a';X.fillRect(0,0,W,H);
// grid bubbles
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(!grid[r]||!grid[r][c])continue;
const p=getPos(r,c);
X.fillStyle=grid[r][c].color;X.beginPath();X.arc(p.x,p.y,R-2,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();X.arc(p.x-5,p.y-5,R/3,0,Math.PI*2);X.fill();
}
// aim line
X.strokeStyle='rgba(255,255,255,0.3)';X.setLineDash([5,5]);X.beginPath();
X.moveTo(shooter.x,shooter.y);
X.lineTo(shooter.x+Math.cos(aimAngle)*200,shooter.y+Math.sin(aimAngle)*200);
X.stroke();X.setLineDash([]);
// shooter
X.fillStyle=shooter.color;X.beginPath();X.arc(shooter.x,shooter.y,R,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();X.arc(shooter.x-5,shooter.y-5,R/3,0,Math.PI*2);X.fill();
// next
X.fillStyle=nextBubble;X.beginPath();X.arc(50,H-30,R*0.7,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,0.5)';X.font='12px sans-serif';X.fillText('下一个',35,H-50);
// shoot bubble
if(shootBubble){
X.fillStyle=shootBubble.color;X.beginPath();X.arc(shootBubble.x,shootBubble.y,R-2,0,Math.PI*2);X.fill();
}
// floor line
X.strokeStyle='rgba(255,255,255,0.2)';X.beginPath();X.moveTo(0,H-60);X.lineTo(W,H-60);X.stroke();
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
C.addEventListener('mousemove',e=>{
const r=C.getBoundingClientRect();
const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
aimAngle=Math.atan2(my-shooter.y,mx-shooter.x);
if(aimAngle>-0.1)aimAngle=-0.1;if(aimAngle<-Math.PI+0.1)aimAngle=-Math.PI+0.1;
});
C.addEventListener('click',shoot);
C.addEventListener('touchmove',e=>{
e.preventDefault();
const r=C.getBoundingClientRect();
const t=e.touches[0];
const mx=(t.clientX-r.left)*(W/r.width),my=(t.clientY-r.top)*(H/r.height);
aimAngle=Math.atan2(my-shooter.y,mx-shooter.x);
if(aimAngle>-0.1)aimAngle=-0.1;if(aimAngle<-Math.PI+0.1)aimAngle=-Math.PI+0.1;
},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();shoot()},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
