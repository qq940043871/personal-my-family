<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火山爆发</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{margin-top:10px;cursor:pointer}
.controls{display:flex;gap:10px;margin:15px 0}
.btn{padding:10px 25px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:12px;cursor:pointer;font-size:1em}
.btn:hover{background:rgba(255,255,255,0.25)}
.btn.erupt{background:#F44336;border-color:#F44336;font-size:1.2em}
.info{color:rgba(255,255,255,0.5);font-size:0.85em}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🌋 火山爆发</h2>
<div></div>
</div>
<canvas id="game" width="600" height="500"></canvas>
<div class="controls">
<button class="btn erupt" onclick="erupt()">🌋 爆发！</button>
<button class="btn" onclick="addLava()">🔴 岩浆</button>
<button class="btn" onclick="reset()">🔄 重置</button>
</div>
<div class="info">点击"爆发"按钮观看火山喷发！</div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=500;
let particles,lava,erupting,pressure;
function init(){
particles=[];lava=[];erupting=false;pressure=0;
// initial lava pool
for(let i=0;i<20;i++)lava.push({x:W/2-30+Math.random()*60,y:H-100+Math.random()*20,r:3+Math.random()*5,color:'#FF6B6B'});
}
function drawVolcano(){
// mountain
X.fillStyle='#5D4037';
X.beginPath();X.moveTo(W/2-150,H);X.lineTo(W/2-20,H-180);X.lineTo(W/2+20,H-180);X.lineTo(W/2+150,H);X.fill();
X.fillStyle='#795548';
X.beginPath();X.moveTo(W/2-140,H);X.lineTo(W/2-15,H-170);X.lineTo(W/2+15,H-170);X.lineTo(W/2+140,H);X.fill();
// crater
X.fillStyle='#3E2723';
X.beginPath();X.moveTo(W/2-25,H-180);X.lineTo(W/2-15,H-160);X.lineTo(W/2+15,H-160);X.lineTo(W/2+25,H-180);X.fill();
// lava glow
if(erupting){
X.fillStyle='rgba(255,100,0,0.3)';X.shadowColor='#FF6B00';X.shadowBlur=30;
X.beginPath();X.arc(W/2,H-170,30,0,Math.PI*2);X.fill();X.shadowBlur=0;
}
// ground
X.fillStyle='#4CAF50';X.fillRect(0,H-20,W,20);
X.fillStyle='#388E3C';X.fillRect(0,H-20,W,5);
}
function drawParticles(){
particles.forEach(p=>{
X.globalAlpha=p.life;
X.fillStyle=p.color;
if(p.type==='rock'){X.fillRect(p.x,p.y,p.r*2,p.r*2)}
else{X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.fill()}
});
X.globalAlpha=1;
// lava flow
lava.forEach(l=>{
X.fillStyle=l.color;X.shadowColor=l.color;X.shadowBlur=3;
X.beginPath();X.arc(l.x,l.y,l.r,0,Math.PI*2);X.fill();
});
X.shadowBlur=0;
}
function erupt(){
if(erupting)return;
erupting=true;pressure=100;
// explosion particles
for(let i=0;i<80;i++){
const angle=-Math.PI/2+(Math.random()-0.5)*1.2;
const speed=5+Math.random()*10;
particles.push({
x:W/2,y:H-175,
vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
r:2+Math.random()*5,life:1,
color:Math.random()<0.3?'#FFD93D':Math.random()<0.5?'#FF6B6B':'#FF9800',
type:Math.random()<0.3?'rock':'lava',gravity:0.15
});
}
// lava bombs
for(let i=0;i<15;i++){
const angle=-Math.PI/2+(Math.random()-0.5)*0.8;
const speed=3+Math.random()*5;
particles.push({
x:W/2,y:H-170,
vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
r:5+Math.random()*8,life:1,color:'#F44336',type:'lava',gravity:0.12
});
}
setTimeout(()=>erupting=false,2000);
}
function addLava(){
for(let i=0;i<10;i++){
lava.push({x:W/2-20+Math.random()*40,y:H-170+Math.random()*10,r:3+Math.random()*4,color:'#FF6B6B'});
}
}
function reset(){init()}
function update(){
particles.forEach(p=>{
p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.life-=0.008;p.vx*=0.99;
if(p.y>H-20&&p.life>0.3){
// lava pool
lava.push({x:p.x+Math.random()*10-5,y:H-25-Math.random()*10,r:p.r*0.5,color:p.color});
p.life=0;
}
});
particles=particles.filter(p=>p.life>0);
lava.forEach(l=>{l.r=Math.min(8,l.r+0.01);l.y=Math.min(H-20,l.y+0.05)});
if(lava.length>200)lava.splice(0,50);
// pressure animation
if(pressure>0)pressure-=0.5;
}
function draw(){
X.fillStyle='#1a1a2e';X.fillRect(0,0,W,H);
// sky glow
if(erupting){
const grad=X.createRadialGradient(W/2,H-170,0,W/2,H-170,200);
grad.addColorStop(0,'rgba(255,100,0,0.2)');grad.addColorStop(1,'rgba(255,100,0,0)');
X.fillStyle=grad;X.fillRect(0,0,W,H);
}
drawVolcano();drawParticles();
}
function loop(){update();draw();requestAnimationFrame(loop)}
init();loop();
</script>
</body>
</html>
