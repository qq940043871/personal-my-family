<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}
.info-item{background:rgba(255,255,255,0.15);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.2);border-radius:15px;font-size:0.9em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px;max-width:400px;width:100%}
.card{aspect-ratio:1;background:rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.5em;cursor:pointer;transition:all 0.3s;perspective:500px;position:relative}
.card-inner{width:100%;height:100%;transition:transform 0.5s;transform-style:preserve-3d;position:relative}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card-front{background:rgba(255,255,255,0.2);font-size:1.5em}
.card-back{background:rgba(255,255,255,0.9);transform:rotateY(180deg);font-size:2.5em}
.card.matched{opacity:0.5;pointer-events:none}
.card:hover{transform:scale(1.05)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">步数: <span id="moves">0</span></div>
<div class="info-item">配对: <span id="pairs">0</span>/8</div>
</div>
</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="start"><div class="box"><h1>🃏 记忆翻牌</h1><p>翻开卡牌找到相同的配对<br>考验你的记忆力！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 恭喜！</h1><p>用了 <span id="finalMoves">0</span> 步完成！</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
let cards,flipped,matched,moves,lock;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
const deck=[...emojis,...emojis].sort(()=>Math.random()-0.5);
cards=[];flipped=[];matched=new Set();moves=0;lock=false;
document.getElementById('moves').textContent=0;
document.getElementById('pairs').textContent=0;
const grid=document.getElementById('grid');
grid.innerHTML='';
deck.forEach((emoji,i)=>{
const card=document.createElement('div');
card.className='card';card.dataset.index=i;card.dataset.emoji=emoji;
card.innerHTML=`<div class="card-inner"><div class="card-front">❓</div><div class="card-back">${emoji}</div></div>`;
card.addEventListener('click',()=>flipCard(card));
grid.appendChild(card);cards.push(card);
});
}
function flipCard(card){
if(lock||card.classList.contains('flipped')||matched.has(card.dataset.index))return;
card.classList.add('flipped');flipped.push(card);playSound(400,0.05);
if(flipped.length===2){
lock=true;moves++;
document.getElementById('moves').textContent=moves;
if(flipped[0].dataset.emoji===flipped[1].dataset.emoji){
matched.add(flipped[0].dataset.index);matched.add(flipped[1].dataset.index);
flipped[0].classList.add('matched');flipped[1].classList.add('matched');
document.getElementById('pairs').textContent=matched.size/2;
playSound(600,0.2);flipped=[];lock=false;
if(matched.size===16){setTimeout(()=>{document.getElementById('finalMoves').textContent=moves;document.getElementById('over').classList.remove('hidden')},500)}
}else{setTimeout(()=>{flipped.forEach(c=>c.classList.remove('flipped'));flipped=[];lock=false;playSound(200,0.1)},800)}
}
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
