<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数星星</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0a0a2a,#1a237e);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.answer{display:flex;gap:10px;margin:20px 0}
.ans-btn{padding:15px 25px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);color:#fff;border-radius:12px;font-size:1.3em;cursor:pointer;transition:all 0.2s}
.ans-btn:hover{background:rgba(255,255,255,0.25);transform:scale(1.05)}
.ans-btn.correct{background:#4CAF50;border-color:#4CAF50}
.ans-btn.wrong{background:#F44336;border-color:#F44336}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FFD93D,#FF9800);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">第 <span id="round">1</span> 题</div></div>
</div>
<canvas id="game" width="500" height="350"></canvas>
<div class="answer" id="answers"></div>

<div class="overlay" id="start"><div class="box"><h1>⭐ 数星星</h1><p>数一数天上有多少星星<br>选择正确的数字！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=500,H=350;
let stars,score,round,correctCount,answered;
function init(){score=0;round=0;document.getElementById('score').textContent=0;nextRound()}
function nextRound(){
round++;answered=false;
document.getElementById('round').textContent=round;
if(round>10){endGame();return}
correctCount=2+Math.floor(Math.random()*8);
stars=Array.from({length:correctCount},()=>({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),r:3+Math.random()*4,bright:Math.random()}));
draw();
// generate answers
const opts=[correctCount];
while(opts.length<4){const n=correctCount+Math.floor(Math.random()*5)-2;if(n>0&&!opts.includes(n)&&n!==correctCount)opts.push(n)}
opts.sort(()=>Math.random()-0.5);
const div=document.getElementById('answers');div.innerHTML='';
opts.forEach(o=>{
const btn=document.createElement('button');btn.className='ans-btn';btn.textContent=o;
btn.addEventListener('click',()=>checkAnswer(btn,o));
div.appendChild(btn);
});
}
function checkAnswer(btn,selected){
if(answered)return;answered=true;
document.querySelectorAll('.ans-btn').forEach(b=>{
if(parseInt(b.textContent)===correctCount)b.classList.add('correct');
});
if(selected===correctCount){score+=10;document.getElementById('score').textContent=score;playSound(700,0.1)}
else{btn.classList.add('wrong');playSound(200,0.2)}
setTimeout(nextRound,1000);
}
function draw(){
X.fillStyle='#0a0a2a';X.fillRect(0,0,W,H);
stars.forEach(s=>{
X.fillStyle=`rgba(255,255,200,${0.5+s.bright*0.5})`;X.shadowColor='#FFD93D';X.shadowBlur=s.r*2;
X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill();
});
X.shadowBlur=0;
}
function endGame(){document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init()}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
