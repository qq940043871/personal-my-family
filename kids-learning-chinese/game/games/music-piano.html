<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钢琴键盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
h1{font-size:1.5em}
.controls{display:flex;gap:10px;margin:15px 0}
.ctrl-btn{padding:8px 20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer}
.ctrl-btn.active{background:#4D96FF;border-color:#4D96FF}
.piano{display:flex;position:relative;margin:20px 0;justify-content:center}
.white-key{width:70px;height:250px;background:linear-gradient(180deg,#fff,#f5f5f5);border:1px solid #ccc;border-radius:0 0 8px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:15px;font-size:0.8em;color:#999;transition:background 0.05s;user-select:none;position:relative;z-index:1}
.white-key:active,.white-key.active{background:linear-gradient(180deg,#e3f2fd,#bbdefb)}
.black-key{width:45px;height:160px;background:linear-gradient(180deg,#333,#111);border-radius:0 0 6px 6px;cursor:pointer;position:absolute;z-index:2;transition:background 0.05s;user-select:none}
.black-key:active,.black-key.active{background:linear-gradient(180deg,#555,#333)}
.note-display{font-size:3em;margin:20px 0;min-height:60px;color:#FFD93D}
.info{color:rgba(255,255,255,0.5);font-size:0.85em;margin-top:10px}
.record-bar{display:flex;gap:10px;margin:10px 0}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h1>🎹 钢琴键盘</h1>
<div></div>
</div>
<div class="note-display" id="noteDisplay"></div>
<div class="controls">
<button class="ctrl-btn" onclick="changeOctave(-1)">低八度</button>
<span id="octave" style="padding:8px">第4组</span>
<button class="ctrl-btn" onclick="changeOctave(1)">高八度</button>
<div style="border-left:2px solid rgba(255,255,255,0.2)"></div>
<button class="ctrl-btn" id="recordBtn" onclick="toggleRecord()">⏺ 录制</button>
<button class="ctrl-btn" onclick="playRecording()">▶ 播放</button>
</div>
<div class="piano" id="piano"></div>
<div class="info">按键 A S D F G H J K L ; 对应白键 · W E T Y U O P 对应黑键</div>

<script>
let audioCtx,octave=4,recording=false,recorded=[],recordStart;
const notes=[
{n:'C',f:261.63,key:'a',black:false},{n:'C#',f:277.18,key:'w',black:true},
{n:'D',f:293.66,key:'s',black:false},{n:'D#',f:311.13,key:'e',black:true},
{n:'E',f:329.63,key:'d',black:false},
{n:'F',f:349.23,key:'f',black:false},{n:'F#',f:369.99,key:'t',black:true},
{n:'G',f:392.00,key:'g',black:false},{n:'G#',f:415.30,key:'y',black:true},
{n:'A',f:440.00,key:'h',black:false},{n:'A#',f:466.16,key:'u',black:true},
{n:'B',f:493.88,key:'j',black:false},
{n:'C2',f:523.25,key:'k',black:false},{n:'C#2',f:554.37,key:'o',black:true},
{n:'D2',f:587.33,key:'l',black:false},{n:'D#2',f:622.25,key:'p',black:true},
{n:'E2',f:659.25,key:';',black:false}
];
function buildPiano(){
const piano=document.getElementById('piano');piano.innerHTML='';
let whiteIndex=0;
notes.forEach((note,i)=>{
if(!note.black){
const key=document.createElement('div');
key.className='white-key';key.dataset.index=i;
key.innerHTML=`<span>${note.n}</span><span style="font-size:0.7em">${note.key.toUpperCase()}</span>`;
key.addEventListener('mousedown',e=>{e.preventDefault();playNote(i)});
key.addEventListener('touchstart',e=>{e.preventDefault();playNote(i)},{passive:false});
piano.appendChild(key);
whiteIndex++;
}
});
// position black keys
const whiteKeys=piano.querySelectorAll('.white-key');
let wIdx=0;
notes.forEach((note,i)=>{
if(note.black){
const key=document.createElement('div');
key.className='black-key';key.dataset.index=i;
const left=whiteKeys[wIdx-1].offsetLeft+whiteKeys[wIdx-1].offsetWidth-22;
key.style.left=left+'px';
key.addEventListener('mousedown',e=>{e.preventDefault();playNote(i)});
key.addEventListener('touchstart',e=>{e.preventDefault();playNote(i)},{passive:false});
piano.appendChild(key);
} else wIdx++;
});
}
function playNote(index){
if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const note=notes[index];
const freq=note.f*Math.pow(2,octave-4);
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type='sine';osc.frequency.value=freq;
gain.gain.value=0.3;
osc.connect(gain);gain.connect(audioCtx.destination);
osc.start();gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.5);
osc.stop(audioCtx.currentTime+1.5);
document.getElementById('noteDisplay').textContent=note.n+' ('+freq.toFixed(0)+'Hz)';
const keys=document.querySelectorAll('[data-index="'+index+'"]');
keys.forEach(k=>k.classList.add('active'));
setTimeout(()=>keys.forEach(k=>k.classList.remove('active')),200);
if(recording)recorded.push({index,time:Date.now()-recordStart});
playSound(freq,0.05);
}
function changeOctave(d){
octave=Math.max(2,Math.min(6,octave+d));
document.getElementById('octave').textContent='第'+octave+'组';
}
function toggleRecord(){
recording=!recording;
const btn=document.getElementById('recordBtn');
if(recording){recorded=[];recordStart=Date.now();btn.textContent='⏹ 停止';btn.classList.add('active')}
else{btn.textContent='⏺ 录制';btn.classList.remove('active')}
}
function playRecording(){
if(recorded.length===0)return;
recorded.forEach(n=>{
setTimeout(()=>playNote(n.index),n.time);
});
}
document.addEventListener('keydown',e=>{
const note=notes.find(n=>n.key===e.key.toLowerCase());
if(note){playNote(notes.indexOf(note));e.preventDefault()}
});
buildPiano();
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.05;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
