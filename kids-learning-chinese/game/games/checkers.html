<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#4E342E,#3E2723);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.board{display:grid;grid-template-columns:repeat(8,50px);gap:0;border:3px solid #8D6E63;border-radius:5px;margin:10px 0}
.cell{width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.light{background:#D7CCC8}
.cell.dark{background:#795548}
.cell.selected{background:#FFD93D}
.cell.valid{background:#81C784}
.piece{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2em;cursor:pointer;transition:transform 0.2s}
.piece:hover{transform:scale(1.1)}
.piece.red{background:linear-gradient(135deg,#F44336,#D32F2F);box-shadow:0 2px 5px rgba(0,0,0,0.3)}
.piece.black{background:linear-gradient(135deg,#424242,#212121);box-shadow:0 2px 5px rgba(0,0,0,0.3)}
.piece.king{border:3px solid #FFD93D}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#8D6E63,#5D4037);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">🔴 <span id="redCount">12</span></div><div class="info-item">⚫ <span id="blackCount">12</span></div></div>
</div>
<div class="board" id="board"></div>

<div class="overlay" id="start"><div class="box"><h1>🔴 跳棋</h1><p>点击棋子选择，再点击目标位置<br>跳过对方棋子吃掉它！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="endTitle">游戏结束</h1><p id="endMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.2);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
let board,turn,selected,validMoves;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
board=Array.from({length:8},()=>Array(8).fill(0));
for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=2;
for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1)board[r][c]=1;
turn=1;selected=null;validMoves=[];render();
}
function render(){
const div=document.getElementById('board');div.innerHTML='';
for(let r=0;r<8;r++)for(let c=0;c<8;c++){
const cell=document.createElement('div');cell.className='cell '+((r+c)%2===0?'light':'dark');
if(selected&&selected[0]===r&&selected[1]===c)cell.classList.add('selected');
if(validMoves.some(m=>m[0]===r&&m[1]===c))cell.classList.add('valid');
if(board[r][c]){
const piece=document.createElement('div');piece.className='piece '+(board[r][c]===1?'red':'black');
if(board[r][c]===3||board[r][c]===4)piece.classList.add('king');
piece.textContent=board[r][c]>=3?'👑':'';
piece.addEventListener('click',e=>{e.stopPropagation();selectPiece(r,c)});
cell.appendChild(piece);
}
cell.addEventListener('click',()=>movePiece(r,c));
div.appendChild(cell);
}
document.getElementById('redCount').textContent=board.flat().filter(v=>v===1||v===3).length;
document.getElementById('blackCount').textContent=board.flat().filter(v=>v===2||v===4).length;
}
function selectPiece(r,c){
if(board[r][c]!==turn&&board[r][c]!==turn+2)return;
selected=[r,c];validMoves=getMoves(r,c);render();
}
function getMoves(r,c){
const moves=[];
const isKing=board[r][c]>=3;
const dirs=isKing?[[-1,-1],[-1,1],[1,-1],[1,1]]:board[r][c]===1?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
for(const[dr,dc]of dirs){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<8&&nc>=0&&nc<8&&board[nr][nc]===0)moves.push([nr,nc,false]);
const jr=r+dr*2,jc=c+dc*2;
if(jr>=0&&jr<8&&jc>=0&&jc<8&&board[jr][jc]===0&&board[nr][nc]!==0&&board[nr][nc]!==turn&&board[nr][nc]!==turn+2){
moves.push([jr,jc,true]);
}
}
return moves;
}
function movePiece(r,c){
if(!selected)return;
const move=validMoves.find(m=>m[0]===r&&m[1]===c);
if(!move)return;
const[sr,sc]=selected;
let piece=board[sr][sc];
board[sr][sc]=0;
if(move[2]){const mr=(sr+r)/2,mc=(sc+c)/2;board[mr][mc]=0}
if(piece===1&&r===0)piece=3;
if(piece===2&&r===7)piece=4;
board[r][c]=piece;selected=null;validMoves=[];
playSound(500,0.05);
// check win
if(board.flat().filter(v=>v===1||v===3).length===0){endGame('⚫ 黑棋赢！');return}
if(board.flat().filter(v=>v===2||v===4).length===0){endGame('🔴 红棋赢！');return}
turn=turn===1?2:1;render();
}
function endGame(msg){
document.getElementById('endTitle').textContent=msg;
document.getElementById('over').classList.remove('hidden');
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
