<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管道拼接</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.grid{display:grid;gap:3px;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;margin:15px 0}
.cell{width:55px;height:55px;background:rgba(255,255,255,0.05);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8em;transition:transform 0.2s}
.cell:hover{background:rgba(255,255,255,0.1)}
.cell.connected{background:rgba(77,150,255,0.2)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4D96FF,#667eea);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🔧 管道拼接</h2>
<div></div>
</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="start"><div class="box"><h1>🔧 管道拼接</h1><p>点击旋转管道<br>连接水源到出口！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 连接成功！</h1><p>水流通了！</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const SIZE=6;
const PIPES={
straight:{emoji:'║',dirs:[[0,1],[0,-1]]},
corner:{emoji:'╚',dirs:[[1,0],[0,-1]]},
tee:{emoji:'╠',dirs:[[1,0],[0,-1],[-1,0]]},
cross:{emoji:'╬',dirs:[[1,0],[0,-1],[-1,0],[0,1]]},
end:{emoji:'╸',dirs:[[1,0]]}
};
let grid,rotations;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
grid=[];rotations=[];
const types=['straight','corner','tee','cross','end'];
for(let r=0;r<SIZE;r++){grid[r]=[];rotations[r]=[];for(let c=0;c<SIZE;c++){
grid[r][c]=types[Math.floor(Math.random()*4)];
rotations[r][c]=Math.floor(Math.random()*4);
}}
// ensure start and end
grid[0][0]='end';rotations[0][0]=0;
grid[SIZE-1][SIZE-1]='end';rotations[SIZE-1][SIZE-1]=2;
render();
}
function render(){
const div=document.getElementById('grid');div.innerHTML='';
div.style.gridTemplateColumns=`repeat(${SIZE},55px)`;
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
const cell=document.createElement('div');cell.className='cell';
cell.textContent=PIPES[grid[r][c]].emoji;
cell.style.transform=`rotate(${rotations[r][c]*90}deg)`;
cell.addEventListener('click',()=>{rotations[r][c]=(rotations[r][c]+1)%4;render();checkConnection()});
div.appendChild(cell);
});
}
function checkConnection(){
// simple check: see if path exists from 0,0 to SIZE-1,SIZE-1
const visited=new Set();
function dfs(r,c){
const key=r+','+c;if(visited.has(key))return false;
visited.add(key);
if(r===SIZE-1&&c===SIZE-1)return true;
const pipe=PIPES[grid[r][c]];
const rot=rotations[r][c];
const dirs=pipe.dirs.map(([dr,dc])=>{
const rad=rot*Math.PI/2;
return[Math.round(dr*Math.cos(rad)-dc*Math.sin(rad)),Math.round(dr*Math.sin(rad)+dc*Math.cos(rad))];
});
for(const[dr,dc]of dirs){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){
const nextPipe=PIPES[grid[nr][nc]];
const nextRot=rotations[nr][nc];
const nextDirs=nextPipe.dirs.map(([dr2,dc2])=>{
const rad2=nextRot*Math.PI/2;
return[Math.round(dr2*Math.cos(rad2)-dc2*Math.sin(rad2)),Math.round(dr2*Math.sin(rad2)+dc2*Math.cos(rad2))];
});
if(nextDirs.some(([nr2,nc2])=>nr2===-dr&&nc2===-dc)){
if(dfs(nr,nc))return true;
}
}
}
return false;
}
if(dfs(0,0)){
setTimeout(()=>{document.getElementById('over').classList.remove('hidden');playSound(700,0.3)},300);
}
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
