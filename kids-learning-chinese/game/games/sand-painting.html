<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.colors{display:flex;gap:5px;padding:10px}
.cbtn{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cbtn.active{border-color:#fff;transform:scale(1.2)}
.controls{display:flex;gap:10px;margin:5px 0}
.ctrl{padding:5px 15px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;cursor:pointer;font-size:0.85em}
canvas{cursor:crosshair}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🏖️ 沙画</h2>
<div></div>
</div>
<div class="colors" id="colors"></div>
<div class="controls">
<button class="ctrl" onclick="clearCanvas()">清除</button>
<button class="ctrl" onclick="shake()">摇一摇</button>
</div>
<canvas id="canvas" width="600" height="500"></canvas>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const COLORS=['#FFD93D','#FF6B6B','#6BCB77','#4D96FF','#C084FC','#FF9800','#F06292','#fff','#8D6E63'];
let currentColor=COLORS[0],particles=[];
function init(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,600,500);
const div=document.getElementById('colors');div.innerHTML='';
COLORS.forEach(c=>{
const btn=document.createElement('div');btn.className='cbtn'+(c===currentColor?' active':'');
btn.style.background=c;btn.addEventListener('click',()=>{currentColor=c;document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')});
div.appendChild(btn);
});
}
function addSand(x,y){
for(let i=0;i<5;i++){
particles.push({
x:x+Math.random()*10-5,y:y+Math.random()*10-5,
vy:1+Math.random()*2,color:currentColor,life:1
});
}
}
function update(){
particles.forEach(p=>{
p.y+=p.vy;p.vy+=0.1;p.life-=0.005;
// settle at bottom or on other particles
if(p.y>490){p.y=490;p.vy=0}
});
particles=particles.filter(p=>p.life>0&&p.y<500);
}
function draw(){
ctx.fillStyle='rgba(26,26,46,0.05)';ctx.fillRect(0,0,600,500);
particles.forEach(p=>{
ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
ctx.fillRect(p.x,p.y,2,2);
});
ctx.globalAlpha=1;
}
canvas.addEventListener('mousemove',e=>{if(e.buttons)addSand(e.offsetX,e.offsetY)});
canvas.addEventListener('mousedown',e=>addSand(e.offsetX,e.offsetY));
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();addSand((e.touches[0].clientX-r.left)*(600/r.width),(e.touches[0].clientY-r.top)*(500/r.height))},{passive:false});
function clearCanvas(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,600,500);particles=[]}
function shake(){
particles.forEach(p=>{p.vy=-5-Math.random()*5;p.vx=(Math.random()-0.5)*5});
}
function loop(){update();draw();requestAnimationFrame(loop)}
init();loop();
</script>
</body>
</html>
