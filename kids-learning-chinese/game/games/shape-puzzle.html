<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形状拼图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:#eee;border-radius:15px;font-size:0.9em}
canvas{margin:15px 0;border:2px solid #ddd;border-radius:10px;background:#fff}
.shapes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px}
.shape{cursor:pointer;transition:transform 0.2s;border:3px solid transparent;border-radius:8px;padding:5px}
.shape:hover{transform:scale(1.1)}
.shape.active{border-color:#4D96FF;background:rgba(77,150,255,0.1)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4D96FF,#667eea);padding:40px;border-radius:20px;text-align:center;max-width:400px;color:#fff}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🧩 形状拼图</h2>
<div></div>
</div>
<canvas id="canvas" width="400" height="300"></canvas>
<div class="shapes" id="shapes"></div>

<div class="overlay" id="start"><div class="box"><h1>🧩 形状拼图</h1><p>选择形状放到画布上<br>拼出美丽的图案！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const SHAPES=[
{name:'圆形',draw:(ctx,x,y,s)=>{ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}},
{name:'正方形',draw:(ctx,x,y,s)=>{ctx.fillRect(x-s,y-s,s*2,s*2)}},
{name:'三角形',draw:(ctx,x,y,s)=>{ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y+s);ctx.lineTo(x-s,y+s);ctx.closePath();ctx.fill()}},
{name:'星形',draw:(ctx,x,y,s)=>{ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const r=i%2===0?s:s*0.4;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}ctx.closePath();ctx.fill()}}
];
let selected=0,placed=[];
function startGame(){
document.getElementById('start').classList.add('hidden');
ctx.fillStyle='#fff';ctx.fillRect(0,0,400,300);
placed=[];
const div=document.getElementById('shapes');div.innerHTML='';
SHAPES.forEach((s,i)=>{
const btn=document.createElement('div');btn.className='shape'+(i===selected?' active':'');
btn.innerHTML=`<canvas width="60" height="60"></canvas>`;
const c=btn.querySelector('canvas'),x=c.getContext('2d');
x.fillStyle=`hsl(${i*90},60%,60%)`;
s.draw(x,30,30,20);
btn.addEventListener('click',()=>{selected=i;document.querySelectorAll('.shape').forEach(b=>b.classList.remove('active'));btn.classList.add('active')});
div.appendChild(btn);
});
}
canvas.addEventListener('click',e=>{
const r=canvas.getBoundingClientRect();
const x=(e.clientX-r.left)*(400/r.width),y=(e.clientY-r.top)*(300/r.height);
ctx.fillStyle=`hsl(${Math.random()*360},60%,60%)`;
SHAPES[selected].draw(ctx,x,y,15+Math.random()*15);
playSound(500+Math.random()*300,0.05);
});
canvas.addEventListener('touchstart',e=>{e.preventDefault();
const r=canvas.getBoundingClientRect();
const x=(e.touches[0].clientX-r.left)*(400/r.width),y=(e.touches[0].clientY-r.top)*(300/r.height);
ctx.fillStyle=`hsl(${Math.random()*360},60%,60%)`;
SHAPES[selected].draw(ctx,x,y,15+Math.random()*15);
playSound(500+Math.random()*300,0.05);
},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
