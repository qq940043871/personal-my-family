<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直升机闯关</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px;cursor:pointer}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4D96FF,#667eea);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">距离: <span id="score">0</span>m</div></div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🚁 直升机闯关</h1><p>按住屏幕/空格上升<br>松开下降，穿越障碍！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>距离: <span id="final">0</span>m</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=400;
let heli,obstacles,score,scrollX,running,goingUp;
function init(){
heli={x:100,y:H/2,vy:0};
obstacles=[];score=0;scrollX=0;running=true;goingUp=false;
for(let i=0;i<5;i++)genObstacle(W+i*200);
document.getElementById('score').textContent=0;
}
function genObstacle(x){
const gap=120+Math.random()*40;
const topH=40+Math.random()*(H-gap-80);
obstacles.push({x,topH,gap,scored:false});
}
function drawHeli(){
X.save();X.translate(heli.x,heli.y);
// body
X.fillStyle='#4D96FF';X.shadowColor='#4D96FF';X.shadowBlur=8;
X.beginPath();X.ellipse(0,0,25,15,0,0,Math.PI*2);X.fill();
// tail
X.fillStyle='#3a7bd5';X.fillRect(-35,-3,20,6);
X.fillRect(-40,-15,10,12);
// skids
X.fillStyle='#333';X.fillRect(-15,12,30,3);
X.fillRect(-12,15,3,5);X.fillRect(9,15,3,5);
// rotor
X.fillStyle='rgba(255,255,255,0.5)';
const rotAngle=Date.now()*0.02;
X.fillRect(-30+Math.cos(rotAngle)*5,-18,60,3);
X.shadowBlur=0;X.restore();
}
function drawObstacles(){
obstacles.forEach(o=>{
X.fillStyle='#6BCB77';
X.fillRect(o.x,0,50,o.topH);
X.fillStyle='#4CAF50';
X.fillRect(o.x-3,o.topH-15,56,15);
X.fillStyle='#6BCB77';
X.fillRect(o.x,o.topH+o.gap,50,H-o.topH-o.gap);
X.fillStyle='#4CAF50';
X.fillRect(o.x-3,o.topH+o.gap,56,15);
});
}
function update(){
if(!running)return;
if(goingUp)heli.vy-=0.4;
else heli.vy+=0.2;
heli.vy=Math.max(-5,Math.min(5,heli.vy));
heli.y+=heli.vy;
scrollX+=3;
score=Math.floor(scrollX/10);
document.getElementById('score').textContent=score;
if(heli.y<0||heli.y>H){die();return}
obstacles.forEach(o=>{
o.x-=3;
if(!o.scored&&o.x+50<heli.x){o.scored=true}
// collision
if(heli.x+20>o.x&&heli.x-20<o.x+50){
if(heli.y-10<o.topH||heli.y+10>o.topH+o.gap)die();
}
});
obstacles=obstacles.filter(o=>o.x>-60);
if(obstacles.length<5)genObstacle(obstacles[obstacles.length-1].x+180+Math.random()*80);
}
function die(){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');playSound(200,0.3)}
function draw(){
X.fillStyle='#0a0a2a';X.fillRect(0,0,W,H);
// stars
for(let i=0;i<30;i++){X.fillStyle=`rgba(255,255,255,${0.2+Math.sin(Date.now()*0.001+i)*0.2})`;X.fillRect((i*73+scrollX*0.1)%W,(i*37)%H,1,1)}
drawObstacles();drawHeli();
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){goingUp=true;e.preventDefault()}});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp')goingUp=false});
C.addEventListener('mousedown',()=>goingUp=true);
C.addEventListener('mouseup',()=>goingUp=false);
C.addEventListener('touchstart',e=>{e.preventDefault();goingUp=true},{passive:false});
C.addEventListener('touchend',()=>goingUp=false);
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
