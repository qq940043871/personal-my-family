<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空入侵者</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}
.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px;opacity:0.9}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
.mobile{display:none;margin-top:10px;gap:10px}
.mbtn{padding:15px 25px;background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:10px;font-size:1.2em}
@media(max-width:600px){.mobile{display:flex}}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">得分: <span id="score">0</span></div>
<div class="info-item">生命: <span id="lives">3</span></div>
</div>
</div>
<canvas id="game" width="480" height="500"></canvas>
<div class="mobile">
<button class="mbtn" ontouchstart="keys.left=true" ontouchend="keys.left=false">←</button>
<button class="mbtn" ontouchstart="shoot()" onclick="shoot()">🔫</button>
<button class="mbtn" ontouchstart="keys.right=true" ontouchend="keys.right=false">→</button>
</div>

<div class="overlay" id="start"><div class="box"><h1>👾 太空入侵者</h1><p>方向键移动，空格射击<br>消灭所有外星人！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=480,H=500;
let ship,bullets,aliens,alienDir,score,lives,running,alienBullets,alienTimer;
const keys={left:false,right:false};
function init(){
ship={x:W/2-20,y:H-50,w:40,h:20};
bullets=[];alienBullets=[];aliens=[];alienDir=1;score=0;lives=3;running=true;alienTimer=0;
for(let r=0;r<4;r++)for(let c=0;c<8;c++){
aliens.push({x:60+c*48,y:50+r*40,w:30,h:25,alive:true,type:r});
}
document.getElementById('score').textContent=0;
document.getElementById('lives').textContent=3;
}
function drawShip(){
X.fillStyle='#6BCB77';X.shadowColor='#6BCB77';X.shadowBlur=8;
X.fillRect(ship.x,ship.y,ship.w,ship.h);
X.fillRect(ship.x+15,ship.y-10,10,10);
X.shadowBlur=0;
}
function drawAliens(){
const colors=['#FF6B6B','#FFD93D','#4D96FF','#C084FC'];
aliens.forEach(a=>{if(!a.alive)return;
X.fillStyle=colors[a.type];X.shadowColor=colors[a.type];X.shadowBlur=5;
X.fillRect(a.x,a.y,a.w,a.h);
// eyes
X.fillStyle='#fff';X.fillRect(a.x+6,a.y+8,5,5);X.fillRect(a.x+19,a.y+8,5,5);
X.shadowBlur=0;
});
}
function update(){
if(!running)return;
if(keys.left)ship.x=Math.max(0,ship.x-5);
if(keys.right)ship.x=Math.min(W-ship.w,ship.x+5);
// bullets
bullets=bullets.filter(b=>{b.y-=8;return b.y>0});
alienBullets=alienBullets.filter(b=>{b.y+=4;return b.y<H});
// alien movement
let edgeHit=false;
aliens.forEach(a=>{if(a.alive){a.x+=alienDir*1.5;if(a.x<=0||a.x+a.w>=W)edgeHit=true}});
if(edgeHit){alienDir*=-1;aliens.forEach(a=>{if(a.alive)a.y+=15})}
// alien shoot
alienTimer++;
if(alienTimer>60){alienTimer=0;
const living=aliens.filter(a=>a.alive);
if(living.length>0){const a=living[Math.floor(Math.random()*living.length)];alienBullets.push({x:a.x+a.w/2,y:a.y+a.h})}
}
// collision: bullet vs alien
bullets.forEach((b,bi)=>{
aliens.forEach(a=>{
if(!a.alive)return;
if(b.x>a.x&&b.x<a.x+a.w&&b.y>a.y&&b.y<a.y+a.h){
a.alive=false;bullets.splice(bi,1);score+=10*(4-a.type);
document.getElementById('score').textContent=score;
playSound(600,0.1);
}
});
});
// collision: alien bullet vs ship
alienBullets.forEach((b,bi)=>{
if(b.x>ship.x&&b.x<ship.x+ship.w&&b.y>ship.y&&b.y<ship.y+ship.h){
alienBullets.splice(bi,1);lives--;document.getElementById('lives').textContent=lives;
playSound(200,0.3);
if(lives<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
}
});
// win check
if(aliens.every(a=>!a.alive)){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
// aliens reach bottom
if(aliens.some(a=>a.alive&&a.y+a.h>=H-60)){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
}
function draw(){
X.fillStyle='#0a0a1a';X.fillRect(0,0,W,H);
// stars
for(let i=0;i<50;i++){X.fillStyle=`rgba(255,255,255,${Math.random()*0.5})`;X.fillRect(Math.random()*W,Math.random()*H,1,1)}
drawShip();drawAliens();
X.fillStyle='#FFD93D';
bullets.forEach(b=>{X.fillRect(b.x-2,b.y,4,10)});
X.fillStyle='#FF6B6B';
alienBullets.forEach(b=>{X.fillRect(b.x-2,b.y,4,10)});
}
function shoot(){if(bullets.length<3){bullets.push({x:ship.x+ship.w/2,y:ship.y});playSound(800,0.05)}}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft')keys.left=true;
if(e.key==='ArrowRight')keys.right=true;
if(e.key===' ')shoot();
e.preventDefault();
});
document.addEventListener('keyup',e=>{
if(e.key==='ArrowLeft')keys.left=false;
if(e.key==='ArrowRight')keys.right=false;
});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
