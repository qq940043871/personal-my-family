<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乒乓球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0c0c1d,#1a1a3e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:20px}
.score-big{font-size:2em;font-weight:bold;background:rgba(255,255,255,0.1);padding:5px 20px;border-radius:15px;min-width:60px;text-align:center}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:#0a0a1a;margin-top:10px;cursor:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px;opacity:0.9}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="score-big" id="pScore">0</div>
<div style="font-size:1.5em;align-self:center">:</div>
<div class="score-big" id="aiScore">0</div>
</div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🏓 乒乓球</h1><p>移动鼠标控制球拍<br>先得11分获胜！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="winTitle">游戏结束</h1><p id="winMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=600,H=400,PW=12,PH=80;
let player,ai,ball,scoreP,scoreA,running;
function init(){
player={x:20,y:H/2-PH/2,w:PW,h:PH};
ai={x:W-20-PW,y:H/2-PH/2,w:PW,h:PH};
ball={x:W/2,y:H/2,dx:4*(Math.random()>0.5?1:-1),dy:4*(Math.random()>0.5?1:-1),r:8};
scoreP=0;scoreA=0;running=true;
document.getElementById('pScore').textContent=0;
document.getElementById('aiScore').textContent=0;
}
function draw(){
ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
// center line
ctx.setLineDash([10,10]);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
// paddles
ctx.fillStyle='#4D96FF';ctx.shadowColor='#4D96FF';ctx.shadowBlur=8;
ctx.fillRect(player.x,player.y,player.w,player.h);
ctx.fillStyle='#FF6B6B';ctx.shadowColor='#FF6B6B';
ctx.fillRect(ai.x,ai.y,ai.w,ai.h);
ctx.shadowBlur=0;
// ball
ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=10;
ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
}
function update(){
if(!running)return;
ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.y-ball.r<0||ball.y+ball.r>H){ball.dy*=-1;playSound(300,0.05)}
// player collision
if(ball.x-ball.r<=player.x+player.w&&ball.y>=player.y&&ball.y<=player.y+player.h&&ball.dx<0){
ball.dx=-ball.dx;ball.dx*=1.05;
const off=(ball.y-player.y)/player.h-0.5;ball.dy=off*10;
playSound(500,0.1);
}
// ai collision
if(ball.x+ball.r>=ai.x&&ball.y>=ai.y&&ball.y<=ai.y+ai.h&&ball.dx>0){
ball.dx=-ball.dx;
const off=(ball.y-ai.y)/ai.h-0.5;ball.dy=off*10;
playSound(500,0.1);
}
// score
if(ball.x<0){scoreA++;document.getElementById('aiScore').textContent=scoreA;checkWin();resetBall()}
if(ball.x>W){scoreP++;document.getElementById('pScore').textContent=scoreP;checkWin();resetBall()}
// AI movement
const aiCenter=ai.y+ai.h/2;
if(aiCenter<ball.y-20)ai.y+=3.5;
else if(aiCenter>ball.y+20)ai.y-=3.5;
ai.y=Math.max(0,Math.min(H-ai.h,ai.y));
}
function resetBall(){ball={x:W/2,y:H/2,dx:4*(Math.random()>0.5?1:-1),dy:4*(Math.random()>0.5?1:-1),r:8}}
function checkWin(){
if(scoreP>=11||scoreA>=11){
running=false;
document.getElementById('winTitle').textContent=scoreP>=11?'🎉 你赢了！':'😢 电脑赢了';
document.getElementById('winMsg').textContent=`${scoreP} : ${scoreA}`;
document.getElementById('over').classList.remove('hidden');
}
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();player.y=Math.max(0,Math.min(H-player.h,(e.clientY-r.top)*(H/r.height)-player.h/2))});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();player.y=Math.max(0,Math.min(H-player.h,(e.touches[0].clientY-r.top)*(H/r.height)-player.h/2))},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
