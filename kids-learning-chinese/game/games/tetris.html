<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0c0c1d,#1a1a3e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:20px}
.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.game-wrap{display:flex;gap:20px;margin-top:10px;align-items:flex-start}
canvas{border:2px solid rgba(255,255,255,0.3);border-radius:5px;background:#0a0a1a}
.side{width:120px}
.side h3{text-align:center;margin-bottom:10px;font-size:0.9em}
#next{border:2px solid rgba(255,255,255,0.2);border-radius:5px;background:#0a0a1a}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px;opacity:0.9}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
.controls{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:400px}
.ctrl{padding:15px 20px;background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:10px;font-size:1.5em;cursor:pointer;user-select:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">得分: <span id="score">0</span></div>
<div class="info-item">等级: <span id="level">1</span></div>
<div class="info-item">行数: <span id="lines">0</span></div>
</div>
</div>
<div class="game-wrap">
<canvas id="board" width="250" height="500"></canvas>
<div class="side">
<h3>下一个</h3>
<canvas id="next" width="100" height="100"></canvas>
</div>
</div>
<div class="controls">
<button class="ctrl" ontouchstart="rotatePiece()" onclick="rotatePiece()">↻</button>
<button class="ctrl" ontouchstart="moveLeft()" onclick="moveLeft()">←</button>
<button class="ctrl" ontouchstart="dropDown()" onclick="dropDown()">↓</button>
<button class="ctrl" ontouchstart="moveRight()" onclick="moveRight()">→</button>
<button class="ctrl" ontouchstart="hardDrop()" onclick="hardDrop()">⏬</button>
</div>

<div class="overlay" id="start"><div class="box"><h1>🧱 俄罗斯方块</h1><p>旋转方块填满一行消除<br>方向键移动，上键旋转</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const COLS=10,ROWS=20,SIZE=25;
const board=document.getElementById('board'),bCtx=board.getContext('2d');
const nextC=document.getElementById('next'),nCtx=nextC.getContext('2d');
const SHAPES=[
[[1,1,1,1]],// I
[[1,1],[1,1]],// O
[[0,1,0],[1,1,1]],// T
[[1,0,0],[1,1,1]],// L
[[0,0,1],[1,1,1]],// J
[[0,1,1],[1,1,0]],// S
[[1,1,0],[0,1,1]]// Z
];
const COLORS=['#00f0f0','#f0f000','#a000f0','#f0a000','#0000f0','#00f000','#f00000'];
let grid,piece,nextP,pieceX,pieceY,score,level,lines,gameInterval,gameOver;

function createGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function newPiece(){return{shape:SHAPES[Math.floor(Math.random()*7)],color:COLORS[Math.floor(Math.random()*7)]}}
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
grid=createGrid();score=0;level=1;lines=0;gameOver=false;
nextP=newPiece();spawnPiece();updateDisplay();
clearInterval(gameInterval);gameInterval=setInterval(tick,1000);
}
function spawnPiece(){
piece=nextP;nextP=newPiece();
pieceX=Math.floor((COLS-piece.shape[0].length)/2);pieceY=0;
if(collides(pieceX,pieceY,piece.shape)){clearInterval(gameInterval);endGame()}
drawNext();
}
function collides(x,y,shape){
for(let r=0;r<shape.length;r++)for(let c=0;c<shape[r].length;c++){
if(!shape[r][c])continue;
const nx=x+c,ny=y+r;
if(nx<0||nx>=COLS||ny>=ROWS)return true;
if(ny>=0&&grid[ny][nx])return true;
}return false;
}
function merge(){
for(let r=0;r<piece.shape.length;r++)for(let c=0;c<piece.shape[r].length;c++){
if(piece.shape[r][c]&&pieceY+r>=0)grid[pieceY+r][pieceX+c]=piece.color;
}}
function clearLines(){
let cleared=0;
for(let r=ROWS-1;r>=0;r--){
if(grid[r].every(c=>c)){grid.splice(r,1);grid.unshift(Array(COLS).fill(0));cleared++;r++}
}
if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=Math.floor(lines/10)+1;updateDisplay()}
}
function rotate(){
const s=piece.shape,m=s[0].length,n=s.length;
const rotated=Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=>s[n-1-j][i]));
if(!collides(pieceX,pieceY,rotated))piece.shape=rotated;
else if(!collides(pieceX-1,pieceY,rotated)){piece.shape=rotated;pieceX--}
else if(!collides(pieceX+1,pieceY,rotated)){piece.shape=rotated;pieceX++}
}
function tick(){
if(gameOver)return;
if(!collides(pieceX,pieceY+1,piece.shape)){pieceY++}
else{merge();clearLines();spawnPiece()}
draw();
}
function draw(){
bCtx.fillStyle='#0a0a1a';bCtx.fillRect(0,0,board.width,board.height);
bCtx.strokeStyle='rgba(255,255,255,0.03)';
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){bCtx.strokeRect(c*SIZE,r*SIZE,SIZE,SIZE);if(grid[r][c]){bCtx.fillStyle=grid[r][c];bCtx.fillRect(c*SIZE+1,r*SIZE+1,SIZE-2,SIZE-2)}}
if(piece)for(let r=0;r<piece.shape.length;r++)for(let c=0;c<piece.shape[r].length;c++){
if(piece.shape[r][c]){bCtx.fillStyle=piece.color;bCtx.fillRect((pieceX+c)*SIZE+1,(pieceY+r)*SIZE+1,SIZE-2,SIZE-2)}
}
// ghost
if(piece){let gy=pieceY;while(!collides(pieceX,gy+1,piece.shape))gy++;
bCtx.globalAlpha=0.2;for(let r=0;r<piece.shape.length;r++)for(let c=0;c<piece.shape[r].length;c++){
if(piece.shape[r][c]){bCtx.fillStyle=piece.color;bCtx.fillRect((pieceX+c)*SIZE+1,(gy+r)*SIZE+1,SIZE-2,SIZE-2)}}
bCtx.globalAlpha=1;
}
}
function drawNext(){
nCtx.fillStyle='#0a0a1a';nCtx.fillRect(0,0,100,100);
const s=nextP.shape,ox=(100-s[0].length*20)/2,oy=(100-s.length*20)/2;
for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++){
if(s[r][c]){nCtx.fillStyle=nextP.color;nCtx.fillRect(ox+c*20+1,oy+r*20+1,18,18)}
}}
function moveLeft(){if(!collides(pieceX-1,pieceY,piece.shape)){pieceX--;draw()}}
function moveRight(){if(!collides(pieceX+1,pieceY,piece.shape)){pieceX++;draw()}}
function rotatePiece(){rotate();draw()}
function dropDown(){if(!collides(pieceX,pieceY+1,piece.shape)){pieceY++;score++;updateDisplay();draw()}}
function hardDrop(){while(!collides(pieceX,pieceY+1,piece.shape)){pieceY++;score+=2}merge();clearLines();spawnPiece();updateDisplay();draw()}
function updateDisplay(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('lines').textContent=lines;clearInterval(gameInterval);gameInterval=setInterval(tick,Math.max(100,1000-(level-1)*100))}
function endGame(){gameOver=true;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove='hidden';document.getElementById('over').classList.remove('hidden')}
document.addEventListener('keydown',e=>{
if(gameOver)return;
if(e.key==='ArrowLeft')moveLeft();
if(e.key==='ArrowRight')moveRight();
if(e.key==='ArrowDown')dropDown();
if(e.key==='ArrowUp')rotatePiece();
if(e.key===' ')hardDrop();
e.preventDefault();
});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
