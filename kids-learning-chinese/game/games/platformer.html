<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台跳跃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.controls{display:flex;gap:10px;margin:10px 0}
.ctrl{padding:15px 25px;background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:12px;font-size:1.3em;cursor:pointer}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#6BCB77,#4CAF50);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">关卡: <span id="level">1</span></div></div>
</div>
<canvas id="game" width="600" height="350"></canvas>
<div class="controls">
<button class="ctrl" ontouchstart="keys.left=true" ontouchend="keys.left=false" onmousedown="keys.left=true" onmouseup="keys.left=false">←</button>
<button class="ctrl" ontouchstart="jump()" onclick="jump()">↑</button>
<button class="ctrl" ontouchstart="keys.right=true" ontouchend="keys.right=false" onmousedown="keys.right=true" onmouseup="keys.right=false">→</button>
</div>

<div class="overlay" id="start"><div class="box"><h1>🏃 平台跳跃</h1><p>方向键移动，空格跳跃<br>收集金币到达终点！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="endTitle">游戏结束</h1><p id="endMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=350;
let player,platforms,coins,goal,score,level,cameraX,running;
const keys={left:false,right:false};
function init(lv){
level=lv||1;score=0;cameraX=0;running=true;
player={x:50,y:H-80,w:24,h:32,vy:0,onGround:false};
platforms=[{x:0,y:H-20,w:2000,h:20}];
// generate level
for(let i=0;i<10+level*3;i++){
platforms.push({x:200+i*150+Math.random()*50,y:H-60-Math.random()*150,w:60+Math.random()*40,h:15});
}
coins=[];goal={x:1500+level*300,y:H-60,w:30,h:40};
for(let i=0;i<10+level*2;i++){
coins.push({x:200+Math.random()*(goal.x-100),y:H-100-Math.random()*150,r:10,collected:false});
}
document.getElementById('level').textContent=level;
}
function drawBg(){
const grad=X.createLinearGradient(0,0,0,H);
grad.addColorStop(0,'#1a237e');grad.addColorStop(1,'#283593');
X.fillStyle=grad;X.fillRect(0,0,W,H);
// stars
for(let i=0;i<20;i++){X.fillStyle='rgba(255,255,255,0.3)';X.fillRect((i*97+cameraX*0.1)%W,(i*37)%H,2,2)}
}
function drawPlatforms(){
platforms.forEach(p=>{
X.fillStyle='#5D4037';X.fillRect(p.x-cameraX,p.y,p.w,p.h);
X.fillStyle='#795548';X.fillRect(p.x-cameraX,p.y,p.w,5);
});
}
function drawCoins(){
coins.forEach(c=>{
if(c.collected)return;
X.fillStyle='#FFD93D';X.shadowColor='#FFD93D';X.shadowBlur=8;
X.beginPath();X.arc(c.x-cameraX,c.y,c.r,0,Math.PI*2);X.fill();
X.fillStyle='#FF9800';X.font='12px sans-serif';X.textAlign='center';X.textBaseline='middle';
X.fillText('$',c.x-cameraX,c.y);X.shadowBlur=0;
});
}
function drawGoal(){
X.fillStyle='#6BCB77';X.shadowColor='#6BCB77';X.shadowBlur=10;
X.fillRect(goal.x-cameraX,goal.y,goal.w,goal.h);
X.fillStyle='#fff';X.font='20px serif';X.textAlign='center';
X.fillText('🏁',goal.x-cameraX+goal.w/2,goal.y+goal.h/2+5);X.shadowBlur=0;
}
function drawPlayer(){
X.fillStyle='#FF6B6B';X.fillRect(player.x-cameraX,player.y,player.w,player.h);
X.fillStyle='#FFD93D';X.beginPath();X.arc(player.x-cameraX+player.w/2,player.y-5,8,0,Math.PI*2);X.fill();
X.fillStyle='#333';X.fillRect(player.x-cameraX+6,player.y-7,3,3);X.fillRect(player.x-cameraX+15,player.y-7,3,3);
}
function jump(){if(player.onGround){player.vy=-10;player.onGround=false;playSound(500,0.05)}}
function update(){
if(!running)return;
if(keys.left)player.x=Math.max(0,player.x-5);
if(keys.right)player.x=Math.min(2000,player.x+5);
player.vy+=0.5;player.y+=player.vy;player.onGround=false;
platforms.forEach(p=>{
if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+player.vy&&player.vy>=0){
player.y=p.y-player.h;player.vy=0;player.onGround=true;
}
});
coins.forEach(c=>{
if(!c.collected&&Math.abs(player.x+player.w/2-c.x)<20&&Math.abs(player.y+player.h/2-c.y)<20){
c.collected=true;score+=10;document.getElementById('score').textContent=score;playSound(700,0.1);
}
});
if(player.x+player.w>goal.x&&player.y<goal.y+goal.h&&player.y+player.h>goal.y){
running=false;document.getElementById('endTitle').textContent='🎉 通关！';document.getElementById('endMsg').textContent='得分: '+score;
document.getElementById('over').classList.remove('hidden');playSound(800,0.3);
}
if(player.y>H){running=false;document.getElementById('endTitle').textContent='💀 掉落了';document.getElementById('endMsg').textContent='得分: '+score;
document.getElementById('over').classList.remove('hidden');playSound(200,0.3)}
cameraX=player.x-W/3;
}
function draw(){drawBg();drawPlatforms();drawCoins();drawGoal();drawPlayer()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init(1);loop()}
document.addEventListener('keydown',e=>{keys[e.key.replace('Arrow','').toLowerCase()]=true;if(e.key===' ')jump();e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.key.replace('Arrow','').toLowerCase()]=false);
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
