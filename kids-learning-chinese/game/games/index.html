<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .header {
            text-align: center;
            padding: 40px 20px 20px;
            color: white;
        }
        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        .back-link:hover { background: rgba(255,255,255,0.3); }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(255,255,255,0.15);
            padding: 12px 24px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }
        .stat-item .num { font-size: 2em; font-weight: bold; }
        .stat-item .label { font-size: 0.9em; opacity: 0.9; }

        .search-box {
            max-width: 400px;
            margin: 20px auto;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            background: rgba(255,255,255,0.9);
            outline: none;
        }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .cat-btn {
            padding: 6px 16px;
            border: 2px solid rgba(255,255,255,0.5);
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: rgba(255,255,255,0.25);
            border-color: white;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .game-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .game-card .thumb {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            position: relative;
            overflow: hidden;
        }
        .game-card .info {
            padding: 12px;
        }
        .game-card .info h3 {
            font-size: 1em;
            margin-bottom: 4px;
        }
        .game-card .info .age {
            font-size: 0.75em;
            color: #888;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .game-card .info .desc {
            font-size: 0.8em;
            color: #666;
            margin-top: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Category colors */
        .cat-classic .thumb { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
        .cat-memory .thumb { background: linear-gradient(135deg, #4ECDC4, #44CF6C); }
        .cat-math .thumb { background: linear-gradient(135deg, #A18CD1, #FBC2EB); }
        .cat-action .thumb { background: linear-gradient(135deg, #FF9A9E, #FAD0C4); }
        .cat-creative .thumb { background: linear-gradient(135deg, #A1C4FD, #C2E9FB); }
        .cat-3d .thumb { background: linear-gradient(135deg, #667eea, #764ba2); }
        .cat-logic .thumb { background: linear-gradient(135deg, #F093FB, #F5576C); }
        .cat-color .thumb { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .cat-nature .thumb { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .cat-whack .thumb { background: linear-gradient(135deg, #fa709a, #fee140); }

        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
        }
        footer a { color: rgba(255,255,255,0.9); }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8em; }
            .games-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px; }
            .game-card .thumb { height: 90px; font-size: 2.5em; }
        }
    </style>
</head>

            all: '全部', classic: '经典街机', memory: '记忆益智', math: '数学启蒙',
            action: '动作冒险', creative: '创意艺术', '3d': '3D游戏', logic: '逻辑策略',
            color: '色彩形状', nature: '自然科学', whack: '打击反应'
        };

        let currentCat = 'all';

        function renderGames(games) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map(g => `
                <a href="${g.file}" class="game-card cat-${g.cat}">
                    <div class="thumb">${g.emoji}</div>
                    <div class="info">
                        <h3>${g.id}. ${g.name}</h3>
                        <span class="age">${g.age}</span>
                        <div class="desc">${g.desc}</div>
                    </div>
                </a>
            `).join('');
        }

        function filterCategory(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyFilters();
        }

        function filterGames() {
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = GAMES;
            if (currentCat !== 'all') {
                filtered = filtered.filter(g => g.cat === currentCat);
            }
            if (search) {
                filtered = filtered.filter(g =>
                    g.name.includes(search) || g.desc.includes(search) || g.emoji.includes(search)
                );
            }
            renderGames(filtered);
        }

        // Initial render
        renderGames(GAMES);
    </script>
