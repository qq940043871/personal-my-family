<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D切水果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px;position:fixed;top:0;z-index:10;background:rgba(0,0,0,0.5)}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;cursor:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div>🍉 3D切水果</div>
<div style="font-size:1.2em">得分: <span id="score">0</span></div>
</div>
<canvas id="game"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a0a2e);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(0,5,10);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const dirLight=new THREE.DirectionalLight(0xffffff,0.8);dirLight.position.set(5,10,5);scene.add(dirLight);
let fruits=[],particles=[],score=0,mouseTrail=[];
const fruitData=[
{geo:new THREE.SphereGeometry(0.5,16,16),color:0xFF6B6B,emoji:'🍎'},
{geo:new THREE.SphereGeometry(0.4,16,16),color:0xFFD93D,emoji:'🍋'},
{geo:new THREE.SphereGeometry(0.6,16,16),color:0x6BCB77,emoji:'🍏'},
{geo:new THREE.SphereGeometry(0.5,16,16),color:0xC084FC,emoji:'🍇'},
{geo:new THREE.SphereGeometry(0.3,16,16),color:0xFF9800,emoji:'🍊'}
];
function spawnFruit(){
const data=fruitData[Math.floor(Math.random()*fruitData.length)];
const mat=new THREE.MeshStandardMaterial({color:data.color});
const fruit=new THREE.Mesh(data.geo,mat);
fruit.position.set(Math.random()*6-3,-2,Math.random()*2-1);
fruit.userData={vy:0.15+Math.random()*0.1,vx:(Math.random()-0.5)*0.05,rotSpeed:(Math.random()-0.5)*0.1,sliced:false};
scene.add(fruit);fruits.push(fruit);
}
function sliceFruit(f){
f.userData.sliced=true;
// particles
for(let i=0;i<10;i++){
const pGeo=new THREE.SphereGeometry(0.1,8,8);
const pMat=new THREE.MeshStandardMaterial({color:f.material.color});
const p=new THREE.Mesh(pGeo,pMat);
p.position.copy(f.position);
p.userData={vx:(Math.random()-0.5)*0.2,vy:Math.random()*0.2,vz:(Math.random()-0.5)*0.2,life:1};
scene.add(p);particles.push(p);
}
score+=10;document.getElementById('score').textContent=score;
scene.remove(f);
}
// mouse
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let lastMouse=null;
window.addEventListener('mousemove',e=>{
mouse.x=(e.clientX/window.innerWidth)*2-1;
mouse.y=-(e.clientY/window.innerHeight)*2+1;
mouseTrail.push({x:e.clientX,y:e.clientY,time:Date.now()});
if(mouseTrail.length>10)mouseTrail.shift();
// check slice
if(lastMouse){
raycaster.setFromCamera(mouse,camera);
const intersects=raycaster.intersectObjects(fruits);
intersects.forEach(hit=>{if(!hit.object.userData.sliced)sliceFruit(hit.object)});
}
lastMouse={x:e.clientX,y:e.clientY};
});
function animate(){
requestAnimationFrame(animate);
if(Math.random()<0.03)spawnFruit();
fruits.forEach((f,i)=>{
if(f.userData.sliced)return;
f.position.y+=f.userData.vy;f.position.x+=f.userData.vx;f.userData.vy-=0.004;
f.rotation.x+=f.userData.rotSpeed;f.rotation.z+=f.userData.rotSpeed*0.7;
if(f.position.y<-3){scene.remove(f);fruits.splice(i,1)}
});
particles.forEach((p,i)=>{
p.position.x+=p.userData.vx;p.position.y+=p.userData.vy;p.position.z+=p.userData.vz;
p.userData.vy-=0.005;p.userData.life-=0.02;
if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
});
renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
animate();
</script>
</body>
</html>
