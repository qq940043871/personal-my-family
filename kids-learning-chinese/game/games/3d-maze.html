<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D迷宫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px;position:fixed;top:0;z-index:10;background:rgba(0,0,0,0.7)}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.controls{position:fixed;bottom:20px;display:flex;gap:10px;z-index:10}
.ctrl{padding:15px 25px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:12px;cursor:pointer;font-size:1.2em}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div>🏰 3D迷宫</div>
<div></div>
</div>
<canvas id="game"></canvas>
<div class="controls">
<button class="ctrl" id="fwd" onclick="moveForward()">↑</button>
<button class="ctrl" onclick="turnLeft()">←</button>
<button class="ctrl" onclick="turnRight()">→</button>
<button class="ctrl" onclick="moveBack()">↓</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a2e);scene.fog=new THREE.Fog(0x1a1a2e,0,50);
const camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setSize(window.innerWidth,renderer.setSize(window.innerHeight));
camera.position.set(2,1.5,2);camera.lookAt(4,1.5,2);
// lights
scene.add(new THREE.AmbientLight(0x404060));
const torch=new THREE.PointLight(0xFFD93D,1,15);camera.add(torch);scene.add(camera);
// maze
const MAZE_SIZE=8;
const maze=[];
for(let i=0;i<MAZE_SIZE;i++){maze[i]=[];for(let j=0;j<MAZE_SIZE;j++)maze[i][j]={w:true,s:true,e:true,n:true,visited:false}}
// generate maze
const stack=[[0,0]];maze[0][0].visited=true;
while(stack.length>0){
const[r,c]=stack[stack.length-1];
const neighbors=[];
if(r>0&&!maze[r-1][c].visited)neighbors.push([r-1,c,'n','s']);
if(r<MAZE_SIZE-1&&!maze[r+1][c].visited)neighbors.push([r+1,c,'s','n']);
if(c>0&&!maze[r][c-1].visited)neighbors.push([r,c-1,'w','e']);
if(c<MAZE_SIZE-1&&!maze[r][c+1].visited)neighbors.push([r,c+1,'e','w']);
if(neighbors.length>0){
const[nr,nc,d1,d2]=neighbors[Math.floor(Math.random()*neighbors.length)];
maze[r][c][d1]=false;maze[nr][nc][d2]=false;
maze[nr][nc].visited=true;stack.push([nr,nc]);
}else stack.pop();
}
// build walls
const wallGeo=new THREE.BoxGeometry(4,3,0.2);
const wallMat=new THREE.MeshStandardMaterial({color:0x667eea});
for(let r=0;r<MAZE_SIZE;r++)for(let c=0;c<MAZE_SIZE;c++){
const x=c*4,z=r*4;
if(maze[r][c].n){const w=new THREE.Mesh(wallGeo,wallMat);w.position.set(x+2,1.5,z);scene.add(w)}
if(maze[r][c].w){const w=new THREE.Mesh(wallGeo,wallMat);w.position.set(x,1.5,z+2);w.rotation.y=Math.PI/2;scene.add(w)}
}
// floor
const floorGeo=new THREE.PlaneGeometry(MAZE_SIZE*4,MAZE_SIZE*4);
const floorMat=new THREE.MeshStandardMaterial({color:0x333355});
const floor=new THREE.Mesh(floorGeo,floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(MAZE_SIZE*2,0,MAZE_SIZE*2);scene.add(floor);
// exit marker
const exitGeo=new THREE.SphereGeometry(0.5,16,16);
const exitMat=new THREE.MeshBasicMaterial({color:0x6BCB77});
const exitMarker=new THREE.Mesh(exitGeo,exitMat);
exitMarker.position.set((MAZE_SIZE-1)*4+2,1,(MAZE_SIZE-1)*4+2);scene.add(exitMarker);
let playerR=0,playerC=0,angle=0;
function moveForward(){
const dr=angle===0?0:angle===1?1:angle===2?0:-1;
const dc=angle===0?1:angle===1?0:angle===2?-1:0;
const nr=playerR+dr,nc=playerC+dc;
if(nr<0||nr>=MAZE_SIZE||nc<0||nc>=MAZE_SIZE)return;
if(angle===0&&maze[playerR][playerC].e)return;
if(angle===1&&maze[playerR][playerC].s)return;
if(angle===2&&maze[playerR][playerC].w)return;
if(angle===3&&maze[playerR][playerC].n)return;
playerR=nr;playerC=nc;updateCamera();
if(playerR===MAZE_SIZE-1&&playerC===MAZE_SIZE-1)alert('🎉 你走出了迷宫！');
}
function moveBack(){angle=(angle+2)%4;moveForward();angle=(angle+2)%4}
function turnLeft(){angle=(angle+3)%4;updateCamera()}
function turnRight(){angle=(angle+1)%4;updateCamera()}
function updateCamera(){
camera.position.set(playerC*4+2,1.5,playerR*4+2);
const lookX=camera.position.x+Math.cos(angle*Math.PI/2)*2;
const lookZ=camera.position.z+Math.sin(angle*Math.PI/2)*2;
camera.lookAt(lookX,1.5,lookZ);
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowUp'||e.key==='w')moveForward();
if(e.key==='ArrowDown'||e.key==='s')moveBack();
if(e.key==='ArrowLeft'||e.key==='a')turnLeft();
if(e.key==='ArrowRight'||e.key==='d')turnRight();
e.preventDefault();
});
function animate(){requestAnimationFrame(animate);exitMarker.rotation.y+=0.02;renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
animate();
</script>
</body>
</html>
