<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩虹桥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB,#E8F5E9);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:rgba(255,255,255,0.3)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.5);border-radius:15px;font-size:0.9em}
.rainbow{margin:30px 0;position:relative;width:400px;height:200px}
.arc{position:absolute;border-radius:200px 200px 0 0;border:20px solid transparent;border-bottom:none;left:50%;transform:translateX(-50%)}
.colors{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.cbtn{width:50px;height:50px;border-radius:10px;border:3px solid transparent;cursor:pointer;font-size:1.5em;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.cbtn:hover{transform:scale(1.1)}
.cbtn.active{border-color:#333}
.cbtn.placed{opacity:0.3;pointer-events:none}
.target{display:flex;gap:10px;margin:20px 0}
.slot{width:60px;height:60px;border:3px dashed #ddd;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.8em;color:#999}
.slot.filled{border-style:solid}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FFD93D,#FF9800);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🌈 彩虹桥</h2>
<div></div>
</div>
<canvas id="rainbow" width="400" height="200"></canvas>
<div class="target" id="target"></div>
<div class="colors" id="colors"></div>

<div class="overlay" id="start"><div class="box"><h1>🌈 彩虹桥</h1><p>按彩虹顺序排列颜色<br>红橙黄绿蓝靛紫！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 彩虹完成！</h1><p>太棒了！</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const RAINBOW=['#F44336','#FF9800','#FFD93D','#4CAF50','#2196F3','#3F51B5','#9C27B0'];
const NAMES=['红','橙','黄','绿','蓝','靛','紫'];
let placed,selected;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
placed=[];selected=null;
drawRainbow();
renderTarget();renderColors();
}
function drawRainbow(){
const canvas=document.getElementById('rainbow'),ctx=canvas.getContext('2d');
ctx.clearRect(0,0,400,200);
placed.forEach((c,i)=>{
ctx.strokeStyle=c;ctx.lineWidth=18;
ctx.beginPath();ctx.arc(200,200,150-i*20,Math.PI,0);ctx.stroke();
});
}
function renderTarget(){
const div=document.getElementById('target');div.innerHTML='';
for(let i=0;i<7;i++){
const slot=document.createElement('div');slot.className='slot'+(i<placed.length?' filled':'');
if(i<placed.length){slot.style.background=placed[i];slot.style.borderColor=placed[i]}
else{slot.textContent=NAMES[i]}
div.appendChild(slot);
}
}
function renderColors(){
const div=document.getElementById('colors');div.innerHTML='';
const available=RAINBOW.filter(c=>!placed.includes(c));
const shuffled=[...available].sort(()=>Math.random()-0.5);
shuffled.forEach(c=>{
const btn=document.createElement('div');btn.className='cbtn'+(c===selected?' active':'');
btn.style.background=c;
btn.addEventListener('click',()=>{
if(placed.includes(c))return;
if(c===RAINBOW[placed.length]){
placed.push(c);playSound(600+placed.length*50,0.1);
drawRainbow();renderTarget();renderColors();
if(placed.length===7)setTimeout(()=>{document.getElementById('over').classList.remove('hidden');playSound(800,0.3)},500);
}else{playSound(200,0.1)}
});
div.appendChild(btn);
});
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
