<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打地鼠</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB,#8BC34A);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}
.info-item{background:rgba(255,255,255,0.3);padding:5px 15px;border-radius:15px;font-size:0.9em;font-weight:bold}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.4);border-radius:15px;font-size:0.9em}
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:30px;max-width:400px}
.hole{width:100px;height:100px;background:radial-gradient(ellipse at center,#5D4037 0%,#3E2723 70%);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;border:4px solid #795548}
.mole{width:80px;height:80px;font-size:3em;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;transform:translateY(100%);user-select:none}
.mole.up{transform:translateY(0)}
.mole:active{transform:scale(0.9) translateY(0)}
.hole .hit{position:absolute;font-size:1.5em;animation:hitAnim 0.5s forwards;pointer-events:none}
@keyframes hitAnim{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#8BC34A,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">得分: <span id="score">0</span></div>
<div class="info-item">时间: <span id="time">30</span></div>
</div>
</div>
<div class="field" id="field"></div>

<div class="overlay" id="start"><div class="box"><h1>🔨 打地鼠</h1><p>地鼠冒出来时点击它！<br>30秒内得尽可能多分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>时间到！</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
let score,timeLeft,timer,moleTimer,moles;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
score=0;timeLeft=30;
document.getElementById('score').textContent=0;
document.getElementById('time').textContent=30;
const field=document.getElementById('field');
field.innerHTML='';moles=[];
const moleEmojis=['🐹','🦔','🐻','🐰'];
for(let i=0;i<9;i++){
const hole=document.createElement('div');hole.className='hole';
const mole=document.createElement('div');mole.className='mole';
mole.textContent=moleEmojis[Math.floor(Math.random()*moleEmojis.length)];
mole.addEventListener('click',()=>whack(i));
hole.appendChild(mole);field.appendChild(hole);moles.push({el:mole,up:false});
}
clearInterval(timer);clearInterval(moleTimer);
timer=setInterval(()=>{timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0)endGame()},1000);
moleTimer=setInterval(popRandom,800);
}
function popRandom(){
const down=moles.filter((m,i)=>!m.up);
if(down.length===0)return;
const idx=moles.indexOf(down[Math.floor(Math.random()*down.length)]);
moles[idx].up=true;moles[idx].el.classList.add('up');
setTimeout(()=>{moles[idx].up=false;moles[idx].el.classList.remove('up')},1200);
}
function whack(i){
if(!moles[i].up)return;
moles[i].up=false;moles[i].el.classList.remove('up');
score+=10;document.getElementById('score').textContent=score;
playSound(800,0.1);
const hole=moles[i].el.parentElement;
const hit=document.createElement('div');hit.className='hit';hit.textContent='+'+10;
hole.appendChild(hit);setTimeout(()=>hit.remove(),500);
}
function endGame(){
clearInterval(timer);clearInterval(moleTimer);
document.getElementById('final').textContent=score;
document.getElementById('over').classList.remove('hidden');
playSound(300,0.3);
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
