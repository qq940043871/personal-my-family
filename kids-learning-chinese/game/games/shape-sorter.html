<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形状分类</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:#eee;border-radius:15px;font-size:0.9em}
.game{display:flex;gap:30px;padding:20px;flex-wrap:wrap;justify-content:center;align-items:center}
.shapes{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.shape{width:60px;height:60px;cursor:pointer;transition:transform 0.2s;display:flex;align-items:center;justify-content:center;font-size:2em}
.shape:hover{transform:scale(1.15)}
.holes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.hole{width:80px;height:80px;border:3px dashed #90A4AE;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:0.8em;color:#90A4AE;position:relative}
.hole.filled{border-style:solid;border-color:#4CAF50;background:#E8F5E9}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4D96FF,#667eea);padding:40px;border-radius:20px;text-align:center;max-width:400px;color:#fff}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🔷 形状分类</h2>
<div></div>
</div>
<div class="shapes" id="shapes"></div>
<div class="holes" id="holes"></div>

<div class="overlay" id="start"><div class="box"><h1>🔷 形状分类</h1><p>把形状拖到对应的孔里<br>学习认识不同的形状！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 恭喜！</h1><p>你认识了所有形状！</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const shapeData=[
{emoji:'⭕',name:'圆形',key:'circle'},
{emoji:'⬜',name:'正方形',key:'square'},
{emoji:'🔺',name:'三角形',key:'triangle'},
{emoji:'⭐',name:'五角星',key:'star'},
{emoji:'❤️',name:'心形',key:'heart'},
{emoji:'💎',name:'菱形',key:'diamond'}
];
let shapes,holes,selected;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
selected=null;
shapes=shapeData.map(()=>[]);holes=shapeData.map(()=>({filled:false}));
// shuffle shapes
const allShapes=[];
shapeData.forEach((s,i)=>{for(let j=0;j<2;j++)allShapes.push({type:i,...s})});
for(let i=allShapes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[allShapes[i],allShapes[j]]=[allShapes[j],allShapes[i]]}
shapes=[allShapes.slice(0,3),allShapes.slice(3,6),allShapes.slice(6,9),allShapes.slice(9,12)];
render();
}
function render(){
const shapesDiv=document.getElementById('shapes');shapesDiv.innerHTML='';
const holesDiv=document.getElementById('holes');holesDiv.innerHTML='';
// show shapes to sort
const flat=shapes.flat();
flat.forEach((s,i)=>{
const el=document.createElement('div');el.className='shape';el.textContent=s.emoji;
el.addEventListener('click',()=>{selected=i;render()});
if(selected===i)el.style.background='rgba(77,150,255,0.2)';
shapesDiv.appendChild(el);
});
// show holes
shapeData.forEach((s,i)=>{
const hole=document.createElement('div');hole.className='hole'+(holes[i].filled?' filled':'');
hole.innerHTML=`<span style="font-size:1.5em">${s.emoji}</span>`;
hole.addEventListener('click',()=>{
if(selected===null)return;
const shape=flat[selected];
if(shape.type===i){
holes[i].filled=true;
flat.splice(selected,1);
selected=null;playSound(600,0.1);
if(holes.every(h=>h.filled)){setTimeout(()=>{document.getElementById('over').classList.remove('hidden');playSound(700,0.3)},300)}
}else{playSound(200,0.1)}
render();
});
holesDiv.appendChild(hole);
});
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
