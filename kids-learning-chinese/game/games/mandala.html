<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曼陀罗画</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.colors{display:flex;gap:5px;padding:10px}
.cbtn{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cbtn.active{border-color:#fff;transform:scale(1.2)}
.controls{display:flex;gap:10px;margin:5px 0}
.ctrl{padding:5px 15px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;cursor:pointer;font-size:0.85em}
canvas{cursor:crosshair}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🌸 曼陀罗画</h2>
<div></div>
</div>
<div class="colors" id="colors"></div>
<div class="controls">
<button class="ctrl" onclick="symmetry=4">4瓣</button>
<button class="ctrl" onclick="symmetry=6">6瓣</button>
<button class="ctrl" onclick="symmetry=8">8瓣</button>
<button class="ctrl" onclick="symmetry=12">12瓣</button>
<button class="ctrl" onclick="clearCanvas()">清除</button>
</div>
<canvas id="canvas" width="500" height="500"></canvas>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const COLORS=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FF9800','#F06292','#00BCD4','#fff'];
let color=COLORS[0],symmetry=8,drawing=false,lastX,lastY;
function init(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,500,500);
const div=document.getElementById('colors');div.innerHTML='';
COLORS.forEach(c=>{
const btn=document.createElement('div');btn.className='cbtn'+(c===color?' active':'');
btn.style.background=c;btn.addEventListener('click',()=>{color=c;document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')});
div.appendChild(btn);
});
}
canvas.addEventListener('mousedown',e=>{drawing=true;const r=canvas.getBoundingClientRect();lastX=(e.clientX-r.left)*(500/r.width);lastY=(e.clientY-r.top)*(500/r.height)});
canvas.addEventListener('mousemove',e=>{if(!drawing)return;const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*(500/r.width),y=(e.clientY-r.top)*(500/r.height);draw(x,y);lastX=x;lastY=y});
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const r=canvas.getBoundingClientRect();lastX=(e.touches[0].clientX-r.left)*(500/r.width);lastY=(e.touches[0].clientY-r.top)*(500/r.height)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const r=canvas.getBoundingClientRect();const x=(e.touches[0].clientX-r.left)*(500/r.width),y=(e.touches[0].clientY-r.top)*(500/r.height);draw(x,y);lastX=x;lastY=y},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);
function draw(x,y){
const cx=250,cy=250;
ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';
for(let i=0;i<symmetry;i++){
const angle=i*(Math.PI*2/symmetry);
ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
ctx.beginPath();ctx.moveTo(lastX-cx,lastY-cy);ctx.lineTo(x-cx,y-cy);X.stroke();
ctx.restore();
// mirror
ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.scale(1,-1);
ctx.beginPath();ctx.moveTo(lastX-cx,lastY-cy);ctx.lineTo(x-cx,y-cy);ctx.stroke();
ctx.restore();
}
}
function clearCanvas(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,500,500)}
init();
</script>
</body>
</html>
