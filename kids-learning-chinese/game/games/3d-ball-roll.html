<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D滚球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px;position:fixed;top:0;z-index:10;background:rgba(0,0,0,0.5)}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:15px;z-index:10}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div>⚽ 3D滚球</div>
<div></div>
</div>
<canvas id="game"></canvas>
<div class="info">方向键控制平台倾斜 · 接住球！</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(0,15,12);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dirLight=new THREE.DirectionalLight(0xffffff,0.8);dirLight.position.set(5,15,10);scene.add(dirLight);
// platform
const platformGeo=new THREE.BoxGeometry(10,0.3,10);
const platformMat=new THREE.MeshStandardMaterial({color:0x8D6E63});
const platform=new THREE.Mesh(platformGeo,platformMat);scene.add(platform);
// ball
const ballGeo=new THREE.SphereGeometry(0.4,16,16);
const ballMat=new THREE.MeshStandardMaterial({color:0xFF6B6B});
const ball=new THREE.Mesh(ballGeo,ballMat);ball.position.y=2;scene.add(ball);
let ballVx=0,ballVy=0,ballVz=0;
let tiltX=0,tiltZ=0,score=0;
// gems
const gems=[];
function spawnGem(){
const gemGeo=new THREE.OctahedronGeometry(0.3);
const gemMat=new THREE.MeshStandardMaterial({color:0xFFD93D});
const gem=new THREE.Mesh(gemGeo,gemMat);
gem.position.set(Math.random()*8-4,1,Math.random()*8-4);
scene.add(gem);gems.push(gem);
}
for(let i=0;i<3;i++)spawnGem();
document.addEventListener('keydown',e=>{
if(e.key==='ArrowUp')tiltX=-0.03;
if(e.key==='ArrowDown')tiltX=0.03;
if(e.key==='ArrowLeft')tiltZ=-0.03;
if(e.key==='ArrowRight')tiltZ=0.03;
e.preventDefault();
});
document.addEventListener('keyup',e=>{
if(e.key==='ArrowUp'||e.key==='ArrowDown')tiltX=0;
if(e.key==='ArrowLeft'||e.key==='ArrowRight')tiltZ=0;
});
function update(){
platform.rotation.x+=tiltX;platform.rotation.z+=tiltZ;
platform.rotation.x=Math.max(-0.3,Math.min(0.3,platform.rotation.x));
platform.rotation.z=Math.max(-0.3,Math.min(0.3,platform.rotation.z));
ballVx+=Math.sin(platform.rotation.z)*0.01;
ballVz+=Math.sin(platform.rotation.x)*0.01;
ballVx*=0.99;ballVz*=0.99;
ball.position.x+=ballVx;ball.position.z+=ballVz;
ball.position.y=0.4+platform.position.y;
// boundary
if(Math.abs(ball.position.x)>5||Math.abs(ball.position.z)>5){
ball.position.set(0,2,0);ballVx=0;ballVz=0;playSound(200,0.2);
}
// gem collection
gems.forEach((g,i)=>{
if(ball.position.distanceTo(g.position)<0.7){
scene.remove(g);gems.splice(i,1);score++;playSound(600,0.1);
setTimeout(spawnGem,1000);
}
});
ball.rotation.x+=ballVz;ball.rotation.z-=ballVx;
}
function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
animate();
</script>
</body>
</html>
