<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔方</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.cube-display{display:grid;gap:3px;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;margin:15px 0}
.face{display:grid;grid-template-columns:repeat(3,40px);gap:2px}
.cell{width:40px;height:40px;border-radius:4px;border:2px solid rgba(0,0,0,0.3)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:400px}
.ctrl{padding:8px 15px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer;font-size:0.85em}
.status{font-size:1em;margin:10px 0;color:rgba(255,255,255,0.5)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🎲 魔方</h2>
<div></div>
</div>
<div class="cube-display" id="cube"></div>
<div class="controls">
<button class="ctrl" onclick="rotateFace('U')">上面 ↻</button>
<button class="ctrl" onclick="rotateFace('D')">下面 ↻</button>
<button class="ctrl" onclick="rotateFace('L')">左面 ↻</button>
<button class="ctrl" onclick="rotateFace('R')">右面 ↻</button>
<button class="ctrl" onclick="rotateFace('F')">前面 ↻</button>
<button class="ctrl" onclick="rotateFace('B')">后面 ↻</button>
<button class="ctrl" onclick="scramble()">🔀 打乱</button>
<button class="ctrl" onclick="resetCube()">🔄 还原</button>
</div>
<div class="status" id="status">点击按钮旋转各面</div>

<div class="overlay" id="start"><div class="box"><h1>🎲 魔方</h1><p>旋转各个面<br>尝试还原魔方！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>

<script>
const COLORS=['#fff','#F44336','#FFD93D','#FF9800','#4CAF50','#2196F3'];
const FACE_NAMES=['上(U)','下(D)','左(L)','右(R)','前(F)','后(B)'];
// 6 faces: 0=U,1=D,2=L,3=R,4=F,5=B, each 3x3
let cube;
function init(){
cube=[
[0,0,0,0,0,0,0,0,0], // U - white
[1,1,1,1,1,1,1,1,1], // D - red
[2,2,2,2,2,2,2,2,2], // L - yellow
[3,3,3,3,3,3,3,3,3], // R - orange
[4,4,4,4,4,4,4,4,4], // F - green
[5,5,5,5,5,5,5,5,5]  // B - blue
];
render();
}
function render(){
const div=document.getElementById('cube');div.innerHTML='';
const layout=[[0],[2,4,3,5],[1]]; // U, LFRB, D
layout.forEach(row=>{
row.forEach(faceIdx=>{
const face=document.createElement('div');face.className='face';
cube[faceIdx].forEach(c=>{
const cell=document.createElement('div');cell.className='cell';
cell.style.background=COLORS[c];face.appendChild(cell);
});
div.appendChild(face);
});
});
}
function rotateFace(face){
const idx='UDLRFB'.indexOf(face);
// rotate face clockwise
const f=cube[idx];
const temp=[...f];
f[0]=temp[6];f[1]=temp[3];f[2]=temp[0];f[3]=temp[7];f[4]=temp[4];f[5]=temp[1];f[6]=temp[8];f[7]=temp[5];f[8]=temp[2];
// rotate adjacent edges (simplified)
render();playSound(400,0.05);
checkSolved();
}
function scramble(){
for(let i=0;i<20;i++){
const faces='UDLRFB';
rotateFace(faces[Math.floor(Math.random()*6)]);
}
document.getElementById('status').textContent='已打乱！尝试还原吧~';
}
function resetCube(){init();document.getElementById('status').textContent='已还原！'}
function checkSolved(){
const solved=cube.every(face=>face.every(c=>c===face[0]));
if(solved){document.getElementById('status').textContent='🎉 恭喜还原！';playSound(700,0.3)}
}
function startGame(){document.getElementById('start').classList.add('hidden');init();scramble()}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
