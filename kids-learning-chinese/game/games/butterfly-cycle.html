<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蝴蝶生命周期</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB,#E8F5E9);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px;background:rgba(255,255,255,0.3)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.5);border-radius:15px;font-size:0.9em}
.stages{display:flex;gap:20px;padding:30px;flex-wrap:wrap;justify-content:center}
.stage{width:120px;text-align:center;padding:20px;background:rgba(255,255,255,0.5);border-radius:15px;cursor:pointer;transition:all 0.3s;border:3px solid transparent}
.stage:hover{transform:scale(1.05)}
.stage.active{border-color:#4CAF50;background:rgba(255,255,255,0.8)}
.stage .emoji{font-size:3em;display:block;margin-bottom:10px}
.stage .label{font-weight:bold;font-size:0.9em}
.info-box{background:rgba(255,255,255,0.7);padding:20px 30px;border-radius:15px;max-width:500px;text-align:center;margin:10px 0;line-height:1.8}
.garden{display:flex;gap:30px;padding:20px;flex-wrap:wrap;justify-content:center}
.flower{font-size:2em;cursor:pointer;transition:transform 0.2s;animation:sway 3s infinite ease-in-out}
.flower:hover{transform:scale(1.3)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🦋 蝴蝶生命周期</h2>
<div></div>
</div>
<div class="stages">
<div class="stage active" onclick="showStage(0)"><span class="emoji">🥚</span><span class="label">卵</span></div>
<div class="stage" onclick="showStage(1)"><span class="emoji">🐛</span><span class="label">幼虫</span></div>
<div class="stage" onclick="showStage(2)"><span class="emoji">🫘</span><span class="label">蛹</span></div>
<div class="stage" onclick="showStage(3)"><span class="emoji">🦋</span><span class="label">成虫</span></div>
</div>
<div class="info-box" id="info">蝴蝶妈妈在叶子上产下小小的卵，这是生命的开始！<br>卵很小很小，需要仔细观察才能看到哦~</div>
<div class="garden" id="garden"></div>

<script>
const stageInfo=[
'蝴蝶妈妈在叶子上产下小小的卵，这是生命的开始！<br>卵很小很小，需要仔细观察才能看到哦~',
'卵孵化出毛毛虫（幼虫）！毛毛虫不停地吃叶子，越长越大。<br>毛毛虫会蜕皮4-5次，每次蜕皮就长大一圈！',
'毛毛虫吃饱后，会变成蛹（茧）。<br>在蛹里面，神奇的变化正在发生！毛毛虫的身体在重新组合~',
'蝴蝶破蛹而出！展开美丽的翅膀。<br>蝴蝶会采花蜜，帮助花朵传粉，然后继续产卵，生命循环~'
];
let current=0;
function showStage(n){
current=n;
document.querySelectorAll('.stage').forEach((s,i)=>s.classList.toggle('active',i===n));
document.getElementById('info').innerHTML=stageInfo[n];
renderGarden();
}
function renderGarden(){
const garden=document.getElementById('garden');garden.innerHTML='';
const flowers=['🌸','🌺','🌻','🌹','🌷','💐'];
for(let i=0;i<8;i++){
const el=document.createElement('span');el.className='flower';
el.textContent=flowers[i%flowers.length];
el.style.animationDelay=(i*0.3)+'s';
if(current===3){
el.textContent+='🦋';
}
garden.appendChild(el);
}
if(current===0){
for(let i=0;i<3;i++){
const egg=document.createElement('span');egg.className='flower';egg.textContent='🥚';
garden.appendChild(egg);
}
}
if(current===1){
for(let i=0;i<3;i++){
const worm=document.createElement('span');worm.className='flower';worm.textContent='🐛';
garden.appendChild(worm);
}
}
}
renderGarden();
</script>
</body>
</html>
