<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分数披萨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:#eee;border-radius:15px;font-size:0.9em}
.pizza-area{margin:20px 0}
canvas{border-radius:50%}
.question{font-size:1.5em;margin:15px 0;text-align:center}
.options{display:flex;gap:15px;margin:20px 0;flex-wrap:wrap;justify-content:center}
.opt{padding:15px 25px;background:#fff;border:2px solid #ddd;border-radius:12px;cursor:pointer;font-size:1.2em;transition:all 0.2s}
.opt:hover{border-color:#FF9800;transform:scale(1.05)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF9800,#F57C00);padding:40px;border-radius:20px;text-align:center;max-width:400px;color:#fff}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div>🍕 分数披萨</div>
<div></div>
</div>
<div class="pizza-area"><canvas id="pizza" width="250" height="250"></canvas></div>
<div class="question" id="question">涂色部分是多少？</div>
<div class="options" id="options"></div>

<div class="overlay" id="start"><div class="box"><h1>🍕 分数披萨</h1><p>看涂色的部分<br>选出正确的分数！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
let score=0,round=0,total,slices,highlighted;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
score=0;round=0;nextRound();
}
function nextRound(){
round++;if(round>10){document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
total=[2,3,4,6,8][Math.floor(Math.random()*5)];
slices=Math.floor(Math.random()*total)+1;
// draw pizza
const canvas=document.getElementById('pizza'),ctx=canvas.getContext('2d');
ctx.clearRect(0,0,250,250);
const cx=125,cy=125,r=110;
// crust
ctx.fillStyle='#FFCC80';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#FF9800';ctx.beginPath();ctx.arc(cx,cy,r-10,0,Math.PI*2);ctx.fill();
// slices
for(let i=0;i<total;i++){
const startAngle=i*Math.PI*2/total-Math.PI/2;
const endAngle=(i+1)*Math.PI*2/total-Math.PI/2;
ctx.fillStyle=i<slices?'#F44336':'#FFCC80';
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r-10,startAngle,endAngle);ctx.closePath();ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(startAngle)*(r-10),cy+Math.sin(startAngle)*(r-10));ctx.stroke();
}
// options
const correct=`${slices}/${total}`;
const opts=[correct];
while(opts.length<4){
const n=Math.floor(Math.random()*total)+1;
const f=`${n}/${total}`;
if(!opts.includes(f))opts.push(f);
}
opts.sort(()=>Math.random()-0.5);
const div=document.getElementById('options');div.innerHTML='';
opts.forEach(o=>{
const btn=document.createElement('div');btn.className='opt';btn.textContent=o;
btn.addEventListener('click',()=>{
if(o===correct){score+=10;playSound(600,0.1);btn.style.borderColor='#4CAF50';btn.style.background='#E8F5E9'}
else{playSound(200,0.1);btn.style.borderColor='#F44336';btn.style.background='#FFEBEE'}
setTimeout(nextRound,800);
});
div.appendChild(btn);
});
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
