<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四子棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1565C0,#0D47A1);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.status{font-size:1.3em;background:rgba(255,255,255,0.15);padding:8px 20px;border-radius:15px;margin:10px 0}
.board{background:#1565C0;padding:10px;border-radius:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.cell{width:55px;height:55px;background:rgba(255,255,255,0.1);border-radius:50%;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.cell:hover{background:rgba(255,255,255,0.2)}
.cell.red{background:#F44336;box-shadow:inset 0 3px 6px rgba(0,0,0,0.3)}
.cell.yellow{background:#FFD93D;box-shadow:inset 0 3px 6px rgba(0,0,0,0.3)}
.cell.win{animation:pulse 0.5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FFD93D,#FF9800);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🟡 四子棋</h2>
<div></div>
</div>
<div class="status" id="status">你的回合 (🔴)</div>
<div class="board" id="board"></div>

<div class="overlay" id="start"><div class="box"><h1>🟡 四子棋</h1><p>点击列放下棋子<br>四子连线获胜！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="winTitle">游戏结束</h1><p id="winMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
let grid,turn,gameOver;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
grid=Array.from({length:6},()=>Array(7).fill(0));
turn=1;gameOver=false;
document.getElementById('status').textContent='你的回合 (🔴)';
render();
}
function render(){
const board=document.getElementById('board');board.innerHTML='';
for(let r=0;r<6;r++)for(let c=0;c<7;c++){
const cell=document.createElement('div');
cell.className='cell'+(grid[r][c]===1?' red':grid[r][c]===2?' yellow':'');
cell.addEventListener('click',()=>dropPiece(c));
board.appendChild(cell);
}
}
function dropPiece(col){
if(gameOver)return;
for(let r=5;r>=0;r--){
if(grid[r][col]===0){
grid[r][col]=turn;
playSound(400,0.05);
if(checkWin(r,col,turn)){
gameOver=true;
document.getElementById('status').textContent=(turn===1?'🔴':'🟡')+' 获胜！';
setTimeout(()=>{document.getElementById('winTitle').textContent=(turn===1?'🎉 你赢了！':'电脑获胜');document.getElementById('winMsg').textContent=(turn===1?'太棒了！':'再来挑战！');document.getElementById('over').classList.remove('hidden')},500);
render();return;
}
if(grid[0].every(c=>c!==0)){
gameOver=true;
document.getElementById('status').textContent='平局！';
setTimeout(()=>{document.getElementById('winTitle').textContent='平局';document.getElementById('winMsg').textContent='旗鼓相当！';document.getElementById('over').classList.remove('hidden')},500);
render();return;
}
turn=turn===1?2:1;
document.getElementById('status').textContent=(turn===1?'你的':'电脑')+'回合 ('+(turn===1?'🔴':'🟡')+')';
render();
if(turn===2&&!gameOver)setTimeout(aiMove,500);
return;
}
}
}
function aiMove(){
// simple AI: check for winning move, then block, then random
for(let c=0;c<7;c++){
for(let r=5;r>=0;r--){
if(grid[r][c]===0){
grid[r][c]=2;
if(checkWin(r,c,2)){grid[r][c]=0;dropPiece(c);return}
grid[r][c]=0;break;
}
}
}
for(let c=0;c<7;c++){
for(let r=5;r>=0;r--){
if(grid[r][c]===0){
grid[r][c]=1;
if(checkWin(r,c,1)){grid[r][c]=0;dropPiece(c);return}
grid[r][c]=0;break;
}
}
}
const valid=[];for(let c=0;c<7;c++)if(grid[0][c]===0)valid.push(c);
if(valid.length>0)dropPiece(valid[Math.floor(Math.random()*valid.length)]);
}
function checkWin(r,c,player){
const dirs=[[0,1],[1,0],[1,1],[1,-1]];
for(const[dr,dc]of dirs){
let count=1;
for(let d=1;d<4;d++){const nr=r+dr*d,nc=c+dc*d;if(nr>=0&&nr<6&&nc>=0&&nc<7&&grid[nr][nc]===player)count++;else break}
for(let d=1;d<4;d++){const nr=r-dr*d,nc=c-dc*d;if(nr>=0&&nr<6&&nc>=0&&nc<7&&grid[nr][nc]===player)count++;else break}
if(count>=4)return true;
}return false;
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
