<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砖块消除</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0c0c1d,#1a1a3e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:#0a0a1a;margin-top:10px;cursor:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
.power-display{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.power{padding:5px 12px;background:rgba(255,255,255,0.15);border-radius:10px;font-size:0.8em}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">生命: <span id="lives">3</span></div></div>
</div>
<canvas id="game" width="480" height="500"></canvas>
<div class="power-display" id="powers"></div>

<div class="overlay" id="start"><div class="box"><h1>🧱 砖块消除</h1><p>移动鼠标控制球拍<br>打碎砖块收集道具！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=480,H=500;
let paddle,balls,bricks,powerups,score,lives,running,multi,wider,laser;
function init(){
paddle={x:W/2-50,y:H-30,w:100,h:12};
balls=[{x:W/2,y:H-50,dx:3,dy:-3,r:6,launched:false}];
bricks=[];powerups=[];score=0;lives=3;running=true;multi=false;wider=false;laser=false;
const colors=['#FF6B6B','#FF9800','#FFD93D','#6BCB77','#4D96FF','#C084FC'];
for(let r=0;r<6;r++)for(let c=0;c<8;c++){
bricks.push({x:10+c*58,y:40+r*26,w:54,h:22,color:colors[r],alive:true,hits:r>=4?2:1});
}
document.getElementById('score').textContent=0;
document.getElementById('lives').textContent=3;
}
function drawPaddle(){
X.fillStyle=wider?'#FFD93D':'#4D96FF';
X.shadowColor=X.fillStyle;X.shadowBlur=8;
X.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
X.shadowBlur=0;
}
function drawBalls(){
balls.forEach(b=>{
X.fillStyle='#fff';X.shadowColor='#fff';X.shadowBlur=8;
X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();
X.shadowBlur=0;
});
}
function drawBricks(){
bricks.forEach(b=>{
if(!b.alive)return;
X.fillStyle=b.color;X.shadowColor=b.color;X.shadowBlur=3;
X.fillRect(b.x,b.y,b.w,b.h);
if(b.hits>1){X.fillStyle='rgba(255,255,255,0.4)';X.fillRect(b.x+2,b.y+2,b.w-4,b.h-4)}
X.shadowBlur=0;
});
}
function drawPowerups(){
powerups.forEach(p=>{
X.fillStyle=p.color;X.shadowColor=p.color;X.shadowBlur=8;
X.font='20px serif';X.textAlign='center';X.textBaseline='middle';
X.fillText(p.emoji,p.x,p.y);
X.shadowBlur=0;
});
}
function update(){
if(!running)return;
balls.forEach((b,bi)=>{
if(!b.launched){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-1;return}
b.x+=b.dx;b.y+=b.dy;
if(b.x-b.r<0||b.x+b.r>W)b.dx*=-1;
if(b.y-b.r<0)b.dy*=-1;
if(b.y+ball.r>H){balls.splice(bi,1);return}
if(b.y+b.r>=paddle.y&&b.x>=paddle.x&&b.x<=paddle.x+paddle.w&&b.dy>0){
b.dy=-Math.abs(b.dy);b.dx=((b.x-paddle.x)/paddle.w-0.5)*8;playSound(400,0.05);
}
bricks.forEach(br=>{
if(!br.alive)return;
if(b.x+b.r>br.x&&b.x-b.r<br.x+br.w&&b.y+b.r>br.y&&b.y-b.r<br.y+br.h){
br.hits--;if(br.hits<=0){br.alive=false;score+=10;
if(Math.random()<0.2)spawnPowerup(br.x+br.w/2,br.y+br.h/2);
}
b.dy*=-1;document.getElementById('score').textContent=score;playSound(600,0.1);
}
});
});
if(balls.length===0){lives--;document.getElementById('lives').textContent=lives;
if(lives<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
balls=[{x:paddle.x+paddle.w/2,y:paddle.y-10,dx:3,dy:-3,r:6,launched:false}];
}
powerups.forEach((p,i)=>{
p.y+=2;
if(p.y>paddle.y&&p.x>paddle.x&&p.x<paddle.x+paddle.w){
powerups.splice(i,1);applyPower(p.type);playSound(800,0.1);
}
if(p.y>H)powerups.splice(i,1);
});
if(bricks.every(b=>!b.alive)){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
}
function spawnPowerup(x,y){
const types=[{type:'multi',emoji:'🔵',color:'#4D96FF'},{type:'wide',emoji:'📏',color:'#FFD93D'},{type:'life',emoji:'❤️',color:'#FF6B6B'}];
const t=types[Math.floor(Math.random()*types.length)];
powerups.push({x,y,...t});
}
function applyPower(type){
if(type==='multi'){
const b=balls[0];if(b)balls.push({x:b.x,y:b.y,dx:-b.dx,dy:b.dy,r:6,launched:true},{x:b.x,y:b.y,dx:b.dx*0.5,dy:b.dy,r:6,launched:true});
}else if(type==='wide'){paddle.w=150;wider=true;setTimeout(()=>{paddle.w=100;wider=false},10000)}
else if(type==='life'){lives++;document.getElementById('lives').textContent=lives}
}
function draw(){
X.fillStyle='#0a0a1a';X.fillRect(0,0,W,H);
drawBricks();drawPaddle();drawBalls();drawPowerups();
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*(W/r.width)-paddle.w/2))});
C.addEventListener('click',()=>{balls.forEach(b=>{if(!b.launched){b.launched=true;b.dx=3*(Math.random()>0.5?1:-1);b.dy=-3}})});
C.addEventListener('touchmove',e=>{e.preventDefault();const r=C.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.touches[0].clientX-r.left)*(W/r.width)-paddle.w/2))},{passive:false});
C.addEventListener('touchstart',e=>{e.preventDefault();balls.forEach(b=>{if(!b.launched){b.launched=true;b.dx=3*(Math.random()>0.5?1:-1);b.dy=-3}})},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
