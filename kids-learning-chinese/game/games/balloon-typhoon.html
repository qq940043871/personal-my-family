<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>气球台风</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#E3F2FD,#BBDEFB);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:rgba(255,255,255,0.5)}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.5);padding:5px 15px;border-radius:15px;font-size:0.9em;font-weight:bold}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.6);border-radius:15px;font-size:0.9em}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">时间: <span id="time">30</span></div></div>
</div>
<canvas id="game"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🎈 气球台风</h1><p>点击戳破气球！<br>30秒内得尽可能多分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>时间到！</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
let W,H,balloons,pops,score,timeLeft,running;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
function init(){
balloons=[];pops=[];score=0;timeLeft=30;running=true;
document.getElementById('score').textContent=0;document.getElementById('time').textContent=30;
for(let i=0;i<10;i++)spawnBalloon();
}
function spawnBalloon(){
const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FF9800','#F06292','#00BCD4'];
const color=colors[Math.floor(Math.random()*colors.length)];
const size=30+Math.random()*30;
balloons.push({
x:50+Math.random()*(W-100),y:H+50,
vy:-(1+Math.random()*2),vx:(Math.random()-0.5)*2,
r:size,color,
points:size<40?30:size<55?20:10,
wobble:Math.random()*Math.PI*2
});
}
function drawBg(){
X.fillStyle='#E3F2FD';X.fillRect(0,0,W,H);
X.fillStyle='rgba(255,255,255,0.3)';
for(let i=0;i<5;i++){X.beginPath();X.arc((i*200+Date.now()*0.01)%W,100+i*30,40,0,Math.PI*2);X.fill()}
}
function drawBalloons(){
balloons.forEach(b=>{
// string
X.strokeStyle='rgba(0,0,0,0.2)';X.lineWidth=1;
X.beginPath();X.moveTo(b.x,b.y+b.r);
X.quadraticCurveTo(b.x+Math.sin(b.wobble)*10,b.y+b.r+20,b.x,b.y+b.r+40);
X.stroke();
// balloon
X.fillStyle=b.color;X.shadowColor=b.color;X.shadowBlur=5;
X.beginPath();X.ellipse(b.x,b.y,b.r*0.8,b.r,0,0,Math.PI*2);X.fill();
// knot
X.fillStyle=b.color;X.beginPath();X.moveTo(b.x-4,b.y+b.r);X.lineTo(b.x+4,b.y+b.r);X.lineTo(b.x,b.y+b.r+8);X.fill();
// highlight
X.fillStyle='rgba(255,255,255,0.3)';X.beginPath();X.ellipse(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.2,b.r*0.3,-0.3,0,Math.PI*2);X.fill();
X.shadowBlur=0;
});
// pops
pops.forEach(p=>{
X.globalAlpha=p.life;X.font=p.r*2+'px serif';X.textAlign='center';X.textBaseline='middle';
X.fillText('💥',p.x,p.y);X.globalAlpha=1;
});
}
function update(){
if(!running)return;
balloons.forEach(b=>{
b.x+=b.vx+Math.sin(b.wobble)*0.5;b.y+=b.vy;b.wobble+=0.03;
if(b.x<b.r||b.x>W-b.r)b.vx*=-1;
});
pops.forEach(p=>{p.life-=0.05;p.r*=1.02});
pops=pops.filter(p=>p.life>0);
// respawn
if(balloons.length<8)spawnBalloon();
}
function loop(){update();drawBg();drawBalloons();requestAnimationFrame(loop)}
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
init();loop();
setInterval(()=>{if(!running)return;timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}},1000);
}
C.addEventListener('click',e=>{
if(!running)return;
const mx=e.clientX,my=e.clientY;
for(let i=balloons.length-1;i>=0;i--){
const b=balloons[i];
if(Math.sqrt((mx-b.x)**2+(my-b.y)**2)<b.r){
score+=b.points;document.getElementById('score').textContent=score;
pops.push({x:b.x,y:b.y,r:b.r,life:1});
balloons.splice(i,1);playSound(800,0.05);break;
}
}
});
C.addEventListener('touchstart',e=>{
e.preventDefault();
const t=e.touches[0];
for(let i=balloons.length-1;i>=0;i--){
const b=balloons[i];
if(Math.sqrt((t.clientX-b.x)**2+(t.clientY-b.y)**2)<b.r){
score+=b.points;document.getElementById('score').textContent=score;
pops.push({x:b.x,y:b.y,r:b.r,life:1});
balloons.splice(i,1);playSound(800,0.05);break;
}
}
},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
