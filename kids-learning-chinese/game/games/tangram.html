<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七巧板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:#eee;border-radius:15px;font-size:0.9em}
canvas{margin:15px 0;border:2px solid #ddd;border-radius:10px;background:#fff;cursor:pointer}
.controls{display:flex;gap:10px;margin:10px 0}
.ctrl{padding:8px 20px;background:#fff;border:2px solid #ddd;border-radius:10px;cursor:pointer;font-size:0.9em}
.ctrl:hover{border-color:#4CAF50}
.shapes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.shape-btn{padding:8px 15px;background:#fff;border:2px solid #ddd;border-radius:10px;cursor:pointer;font-size:0.9em;transition:all 0.2s}
.shape-btn:hover,.shape-btn.active{border-color:#4D96FF;background:#E3F2FD}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4CAF50,#2E7D32);padding:40px;border-radius:20px;text-align:center;max-width:400px;color:#fff}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🔷 七巧板</h2>
<div></div>
</div>
<canvas id="canvas" width="400" height="400"></canvas>
<div class="shapes" id="shapes"></div>
<div class="controls">
<button class="ctrl" onclick="rotatePiece()">↻ 旋转</button>
<button class="ctrl" onclick="flipPiece()">↔ 翻转</button>
<button class="ctrl" onclick="resetPieces()">🔄 重置</button>
</div>

<div class="overlay" id="start"><div class="box"><h1>🔷 七巧板</h1><p>拖动七巧板拼出图案<br>旋转和翻转来调整！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const PIECES=[
{name:'大三角1',color:'#FF6B6B',points:[[0,0],[200,0],[100,100]]},
{name:'大三角2',color:'#FFD93D',points:[[0,0],[0,200],[100,100]]},
{name:'中三角',color:'#6BCB77',points:[[0,0],[141,0],[70,70]]},
{name:'小三角1',color:'#4D96FF',points:[[0,0],[100,0],[50,50]]},
{name:'小三角2',color:'#C084FC',points:[[0,0],[100,0],[50,50]]},
{name:'正方形',color:'#FF9800',points:[[0,0],[70,0],[70,70],[0,70]]},
{name:'平行四边形',color:'#00BCD4',points:[[0,0],[100,0],[141,70],[41,70]]}
];
let pieces,selectedPiece,dragging,dragOffset;
function startGame(){
document.getElementById('start').classList.add('hidden');
pieces=PIECES.map((p,i)=>({
...p,x:50+i*40,y:300,rotation:0,flipped:false,scale:0.5
}));
selectedPiece=0;renderPieces();
}
function renderPieces(){
const div=document.getElementById('shapes');div.innerHTML='';
pieces.forEach((p,i)=>{
const btn=document.createElement('div');btn.className='shape-btn'+(i===selectedPiece?' active':'');
btn.textContent=p.name;btn.style.borderLeftColor=p.color;
btn.addEventListener('click',()=>{selectedPiece=i;renderPieces()});
div.appendChild(btn);
});
draw();
}
function draw(){
ctx.clearRect(0,0,400,400);
// grid
ctx.strokeStyle='rgba(0,0,0,0.05)';ctx.lineWidth=1;
for(let i=0;i<400;i+=20){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke()}
pieces.forEach((p,i)=>{
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.scale(p.flipped?-1:1,1);
ctx.scale(p.scale,p.scale);
ctx.fillStyle=p.color;ctx.strokeStyle='#333';ctx.lineWidth=2;
ctx.beginPath();
p.points.forEach(([x,y],j)=>{j===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
ctx.closePath();ctx.fill();ctx.stroke();
if(i===selectedPiece){ctx.strokeStyle='#FFD93D';ctx.lineWidth=3;ctx.stroke()}
ctx.restore();
});
}
function rotatePiece(){
if(pieces[selectedPiece]){
pieces[selectedPiece].rotation+=Math.PI/4;draw();playSound(400,0.05);
}
}
function flipPiece(){
if(pieces[selectedPiece]){
pieces[selectedPiece].flipped=!pieces[selectedPiece].flipped;draw();playSound(500,0.05);
}
}
function resetPieces(){startGame()}
canvas.addEventListener('mousedown',e=>{
const r=canvas.getBoundingClientRect();
const mx=(e.clientX-r.left)*(400/r.width),my=(e.clientY-r.top)*(400/r.height);
for(let i=pieces.length-1;i>=0;i--){
const p=pieces[i];
if(Math.abs(mx-p.x)<50&&Math.abs(my-p.y)<50){
selectedPiece=i;dragging=true;dragOffset={x:mx-p.x,y:my-p.y};renderPieces();return;
}
}
});
canvas.addEventListener('mousemove',e=>{
if(!dragging)return;
const r=canvas.getBoundingClientRect();
const mx=(e.clientX-r.left)*(400/r.width),my=(e.clientY-r.top)*(400/r.height);
pieces[selectedPiece].x=mx-dragOffset.x;
pieces[selectedPiece].y=my-dragOffset.y;draw();
});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();
const r=canvas.getBoundingClientRect();
const mx=(e.touches[0].clientX-r.left)*(400/r.width),my=(e.touches[0].clientY-r.top)*(400/r.height);
for(let i=pieces.length-1;i>=0;i--){
const p=pieces[i];
if(Math.abs(mx-p.x)<50&&Math.abs(my-p.y)<50){
selectedPiece=i;dragging=true;dragOffset={x:mx-p.x,y:my-p.y};renderPieces();return;
}
}
},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();
if(!dragging)return;
const r=canvas.getBoundingClientRect();
const mx=(e.touches[0].clientX-r.left)*(400/r.width),my=(e.touches[0].clientY-r.top)*(400/r.height);
pieces[selectedPiece].x=mx-dragOffset.x;
pieces[selectedPiece].y=my-dragOffset.y;draw();
},{passive:false});
canvas.addEventListener('touchend',()=>dragging=false);
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
