<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青蛙过河</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#4CAF50,#8BC34A);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">生命: <span id="lives">3</span></div></div>
</div>
<canvas id="game" width="480" height="560"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🐸 青蛙过河</h1><p>方向键控制小青蛙<br>穿过马路和河流到达对岸！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=480,H=560,SZ=40;
let frog,obstacles,score,lives,running;
function init(){
frog={x:W/2-SZ/2,y:H-SZ*2,w:SZ,h:SZ};
score=0;lives=3;running=true;
obstacles=[];
// road lanes
for(let i=0;i<5;i++){
const y=H-SZ*(4+i);
for(let j=0;j<3;j++){
obstacles.push({x:j*160+i*40,y,w:80,h:SZ-8,speed:1.5+i*0.5,type:'car',color:['#FF6B6B','#FFD93D','#4D96FF','#C084FC','#FF9800'][i]});
}
}
// river lanes
for(let i=0;i<5;i++){
const y=SZ*(2+i);
for(let j=0;j<3;j++){
obstacles.push({x:j*140+i*50,y,w:90,h:SZ-8,speed:(i%2===0?1:-1)*(1+i*0.3),type:'log',color:'#8D6E63'});
}
}
document.getElementById('score').textContent=0;
document.getElementById('lives').textContent=3;
}
function drawBg(){
// grass top
X.fillStyle='#4CAF50';X.fillRect(0,0,W,SZ*2);
X.fillStyle='#388E3C';X.fillRect(0,SZ,W,SZ);
// road
X.fillStyle='#424242';X.fillRect(0,H-SZ*9,W,SZ*5);
X.fillStyle='#616161';
for(let i=0;i<5;i++){X.fillRect(0,H-SZ*(4+i)+SZ/2-1,W,2)}
// river
X.fillStyle='#1565C0';X.fillRect(0,SZ*2,W,SZ*5);
// grass bottom
X.fillStyle='#4CAF50';X.fillRect(0,H-SZ*2,W,SZ*2);
// safe zone
X.fillStyle='#66BB6A';X.fillRect(0,SZ*7-W%SZ,W,SZ);
}
function drawFrog(){
X.fillStyle='#4CAF50';X.shadowColor='#4CAF50';X.shadowBlur=8;
X.fillRect(frog.x+4,frog.y+4,frog.w-8,frog.h-8);
// eyes
X.fillStyle='#fff';X.fillRect(frog.x+8,frog.y+4,8,8);X.fillRect(frog.x+24,frog.y+4,8,8);
X.fillStyle='#333';X.fillRect(frog.x+12,frog.y+6,4,4);X.fillRect(frog.x+28,frog.y+6,4,4);
X.shadowBlur=0;
}
function drawObstacles(){
obstacles.forEach(o=>{
X.fillStyle=o.color;
if(o.type==='car'){X.fillRect(o.x,o.y,o.w,o.h);X.fillStyle='#FFEB3B';X.fillRect(o.x+o.w-8,o.y+4,6,6)}
else{X.fillRect(o.x,o.y,o.w,o.h)}
});
}
function update(){
if(!running)return;
let onLog=false;
obstacles.forEach(o=>{
o.x+=o.speed;
if(o.type==='car'){
if(o.x>W+o.w)o.x=-o.w;
if(o.x<-o.w)o.x=W+o.w;
// car collision
if(frog.x+4<o.x+o.w&&frog.x+frog.w-4>o.x&&frog.y+4<o.y+o.h&&frog.y+frog.h-4>o.y){die();return}
}else{
if(o.speed>0&&o.x>W+o.w)o.x=-o.w;
if(o.speed<0&&o.x<-o.w)o.x=W+o.w;
// on log?
if(frog.y+4<o.y+o.h&&frog.y+frog.h-4>o.y&&frog.x+4<o.x+o.w&&frog.x+frog.w-4>o.x){
frog.x+=o.speed;onLog=true;
}
}
});
// in river and not on log
if(frog.y>SZ*2&&frog.y<SZ*7&&!onLog){die();return}
// win
if(frog.y<SZ){score+=100;document.getElementById('score').textContent=score;
frog.y=H-SZ*2;playSound(700,0.2)}
// out of bounds
if(frog.x<0||frog.x+frog.w>W){die()}
}
function die(){
lives--;document.getElementById('lives').textContent=lives;
playSound(200,0.3);
if(lives<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
frog={x:W/2-SZ/2,y:H-SZ*2,w:SZ,h:SZ};
}
function draw(){drawBg();drawObstacles();drawFrog()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{
if(!running)return;
if(e.key==='ArrowUp')frog.y-=SZ;
if(e.key==='ArrowDown')frog.y+=SZ;
if(e.key==='ArrowLeft')frog.x-=SZ;
if(e.key==='ArrowRight')frog.x+=SZ;
frog.y=Math.max(0,Math.min(H-SZ,frog.y));
frog.x=Math.max(0,Math.min(W-SZ,frog.x));
e.preventDefault();
});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
