<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px;cursor:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">生命: <span id="lives">3</span></div></div>
</div>
<canvas id="game" width="480" height="500"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🏓 打砖块</h1><p>移动鼠标控制球拍<br>弹球打碎所有砖块！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>
<div class="overlay hidden" id="win"><div class="box"><h1>🎉 通关！</h1><p>得分: <span id="winScore">0</span></p><button class="btn" onclick="startGame()">再玩一次</button></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=480,H=500;
let paddle,ball,bricks,score,lives,running;
function init(){
paddle={x:W/2-50,y:H-30,w:100,h:12};
ball={x:W/2,y:H-50,dx:3,dy:-3,r:6,launched:false};
bricks=[];score=0;lives=3;running=true;
const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC'];
for(let r=0;r<5;r++)for(let c=0;c<8;c++){
bricks.push({x:10+c*58,y:40+r*26,w:54,h:22,color:colors[r],alive:true});
}
document.getElementById('score').textContent=0;
document.getElementById('lives').textContent=3;
}
function draw(){
X.fillStyle='#0a0a1a';X.fillRect(0,0,W,H);
bricks.forEach(b=>{if(b.alive){X.fillStyle=b.color;X.fillRect(b.x,b.y,b.w,b.h)}});
X.fillStyle='#4D96FF';X.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
X.fillStyle='#fff';X.beginPath();X.arc(ball.x,ball.y,ball.r,0,Math.PI*2);X.fill();
}
function update(){
if(!running)return;
if(!ball.launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return}
ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.x-ball.r<0||ball.x+ball.r>W)ball.dx*=-1;
if(ball.y-ball.r<0)ball.dy*=-1;
if(ball.y+ball.r>H){lives--;document.getElementById('lives').textContent=lives;
if(lives<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
ball.launched=false;return;
}
if(ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.dy>0){
ball.dy=-Math.abs(ball.dy);ball.dx=((ball.x-paddle.x)/paddle.w-0.5)*8;playSound(400,0.05);
}
bricks.forEach(b=>{
if(!b.alive)return;
if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
b.alive=false;ball.dy*=-1;score+=10;document.getElementById('score').textContent=score;playSound(600,0.1);
if(bricks.every(bb=>!bb.alive)){running=false;document.getElementById('winScore').textContent=score;document.getElementById('win').classList.remove('hidden')}
}
});
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');document.getElementById('win').classList.add('hidden');init();loop()}
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*(W/r.width)-paddle.w/2))});
C.addEventListener('click',()=>{if(!ball.launched){ball.launched=true;ball.dx=3*(Math.random()>0.5?1:-1);ball.dy=-3}});
C.addEventListener('touchmove',e=>{e.preventDefault();const r=C.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.touches[0].clientX-r.left)*(W/r.width)-paddle.w/2))},{passive:false});
C.addEventListener('touchstart',e=>{e.preventDefault();if(!ball.launched){ball.launched=true}},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
