<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#455A64,#37474F);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.grid{display:grid;gap:2px;padding:10px;background:#333;border-radius:10px;margin-top:10px}
.cell{width:35px;height:35px;background:#607D8B;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.9em;cursor:pointer;border-radius:3px;transition:background 0.1s;user-select:none}
.cell:hover{background:#78909C}
.cell.revealed{background:#B0BEC5;cursor:default}
.cell.mine{background:#F44336}
.cell.flagged{background:#FFD93D}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#607D8B,#455A64);padding:40px;border-radius:20px;text-align:center;max-width:400px;border:2px solid #90A4AE}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#90A4AE;color:#fff;font-weight:bold;margin:5px}
.hidden{display:none}
.mode-btn{padding:8px 15px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer;margin:5px}
.mode-btn.active{background:#FFD93D;color:#333}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">💣 <span id="mines">10</span></div><div class="info-item">🚩 <span id="flags">0</span></div></div>
</div>
<button class="mode-btn" id="modeBtn" onclick="toggleFlag()">🚩 标记模式: 关</button>
<div class="grid" id="grid"></div>

<div class="overlay" id="start"><div class="box"><h1>💣 扫雷</h1><p>点击翻开格子<br>数字表示周围地雷数<br>找出所有安全格子！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="endTitle">游戏结束</h1><p id="endMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.2);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const ROWS=8,COLS=8,MINES=10;
let board,revealed,flagged,gameOver,flagMode,firstClick;
const numColors=['','#4D96FF','#6BCB77','#F44336','#9C27B0','#FF9800','#00BCD4','#333','#666'];
function init(){
board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
gameOver=false;flagMode=false;firstClick=true;
document.getElementById('mines').textContent=MINES;document.getElementById('flags').textContent=0;
document.getElementById('modeBtn').textContent='🚩 标记模式: 关';
render();
}
function placeMines(safeR,safeC){
let placed=0;
while(placed<MINES){
const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
if(board[r][c]===-1||(r===safeR&&c===safeC)||(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1))continue;
board[r][c]=-1;placed++;
}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(board[r][c]===-1)continue;
let count=0;
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)count++;
}
board[r][c]=count;
}
}
function render(){
const grid=document.getElementById('grid');grid.style.gridTemplateColumns=`repeat(${COLS},35px)`;grid.innerHTML='';
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const cell=document.createElement('div');cell.className='cell';
if(revealed[r][c]){
cell.classList.add('revealed');
if(board[r][c]===-1){cell.classList.add('mine');cell.textContent='💣'}
else if(board[r][c]>0){cell.textContent=board[r][c];cell.style.color=numColors[board[r][c]]}
}else if(flagged[r][c]){cell.classList.add('flagged');cell.textContent='🚩'}
cell.addEventListener('click',()=>handleClick(r,c));
cell.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlagAt(r,c)});
grid.appendChild(cell);
}
}
function handleClick(r,c){
if(gameOver||flagged[r][c])return;
if(flagMode){toggleFlagAt(r,c);return}
if(firstClick){firstClick=false;placeMines(r,c)}
if(revealed[r][c])return;
revealed[r][c]=true;
if(board[r][c]===-1){
gameOver=true;
for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(board[rr][cc]===-1)revealed[rr][cc]=true;
render();playSound(200,0.3);
document.getElementById('endTitle').textContent='💥 踩雷了！';
document.getElementById('endMsg').textContent='再来挑战！';
document.getElementById('over').classList.remove('hidden');return;
}
if(board[r][c]===0){
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!revealed[nr][nc])handleClick(nr,nc);
}
}
playSound(400,0.05);render();checkWin();
}
function toggleFlagAt(r,c){
if(revealed[r][c]||gameOver)return;
flagged[r][c]=!flagged[r][c];
let flags=0;for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(flagged[rr][cc])flags++;
document.getElementById('flags').textContent=flags;
playSound(500,0.05);render();
}
function toggleFlag(){
flagMode=!flagMode;
document.getElementById('modeBtn').textContent='🚩 标记模式: '+(flagMode?'开':'关');
document.getElementById('modeBtn').classList.toggle('active',flagMode);
}
function checkWin(){
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(board[r][c]!==-1&&!revealed[r][c])return;
}
gameOver=true;
document.getElementById('endTitle').textContent='🎉 恭喜！';
document.getElementById('endMsg').textContent='你找到了所有地雷！';
document.getElementById('over').classList.remove('hidden');playSound(700,0.3);
}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init()}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
