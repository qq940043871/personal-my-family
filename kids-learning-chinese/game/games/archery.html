<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射箭游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#87CEEB,#8BC34A);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.3);padding:5px 15px;border-radius:15px;font-size:0.9em;font-weight:bold}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.4);border-radius:15px;font-size:0.9em}
canvas{margin-top:10px;cursor:crosshair}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF9800,#F57C00);padding:40px;border-radius:20px;text-align:center;max-width:400px;color:#fff}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">箭支: <span id="arrows">10</span></div></div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🏹 射箭</h1><p>拖动瞄准，松开发射<br>射中靶心得高分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=400;
let arrowsLeft,score,arrow,aiming,aimStart,wind,target;
function init(){
arrowsLeft=10;score=0;arrow=null;aiming=false;
wind=(Math.random()-0.5)*3;
target={x:480+Math.random()*60,y:100+Math.random()*200,r:60};
document.getElementById('score').textContent=0;document.getElementById('arrows').textContent=10;
}
function drawBg(){
X.fillStyle='#87CEEB';X.fillRect(0,0,W,H*0.7);
X.fillStyle='#8BC34A';X.fillRect(0,H*0.7,W,H*0.3);
// trees
X.fillStyle='#4CAF50';X.fillRect(50,H*0.7-40,30,40);X.fillRect(350,H*0.7-50,25,50);
}
function drawTarget(){
const{ x,y,r}=target;
const rings=[{color:'#fff',r:r},{color:'#F44336',r:r*0.8},{color:'#fff',r:r*0.6},{color:'#2196F3',r:r*0.4},{color:'#FFD93D',r:r*0.2}];
rings.forEach(ring=>{
X.fillStyle=ring.color;X.beginPath();X.arc(x,y,ring.r,0,Math.PI*2);X.fill();
X.strokeStyle='#333';X.lineWidth=1;X.stroke();
});
// score labels
X.fillStyle='#333';X.font='10px sans-serif';X.textAlign='center';
X.fillText('10',x,y-r+12);X.fillText('8',x,y-r*0.6+8);X.fillText('6',x,y-r*0.2+8);
}
function drawArcher(){
X.fillStyle='#795548';X.fillRect(30,H*0.7-60,15,60);
X.fillStyle='#FFD93D';X.beginPath();X.arc(37,H*0.7-70,12,0,Math.PI*2);X.fill();
X.strokeStyle='#8D6E63';X.lineWidth=3;X.beginPath();X.moveTo(50,H*0.7-50);X.lineTo(50,H*0.7-20);X.stroke();
// bow
X.strokeStyle='#6D4C41';X.lineWidth=3;
X.beginPath();X.arc(50,H*0.7-35,25,-Math.PI/2,Math.PI/2);X.stroke();
X.strokeStyle='#333';X.lineWidth=1;
X.beginPath();X.moveTo(50,H*0.7-60);X.lineTo(50,H*0.7-10);X.stroke();
}
function drawArrow(a){
X.save();X.translate(a.x,a.y);X.rotate(a.angle);
X.fillStyle='#8D6E63';X.fillRect(-25,-1.5,50,3);
X.fillStyle='#F44336';X.beginPath();X.moveTo(25,-6);X.lineTo(35,0);X.lineTo(25,6);X.fill();
X.restore();
}
function drawWind(){
X.fillStyle='rgba(0,0,0,0.5)';X.font='14px sans-serif';X.textAlign='center';
X.fillText('风: '+(wind>0?'→':'←')+' '+Math.abs(wind).toFixed(1),W/2,30);
}
function drawAimLine(){
if(!aiming||!aimStart)return;
const dx=aimStart.x-C.getBoundingClientRect().left;
const dy=aimStart.y-C.getBoundingClientRect().top;
X.strokeStyle='rgba(255,0,0,0.3)';X.lineWidth=2;X.setLineDash([5,5]);
X.beginPath();X.moveTo(50,H*0.7-35);X.lineTo(50+dx*0.5,H*0.7-35+dy*0.2);X.stroke();
X.setLineDash([]);
}
function update(){
if(!arrow)return;
arrow.x+=arrow.vx;arrow.y+=arrow.vy;arrow.vy+=0.1;arrow.vx+=wind*0.01;
arrow.angle=Math.atan2(arrow.vy,arrow.vx);
if(arrow.x>target.x-target.r&&arrow.x<target.x+target.r&&arrow.y>target.y-target.r&&arrow.y<target.y+target.r){
const dist=Math.sqrt((arrow.x-target.x)**2+(arrow.y-target.y)**2);
const points=dist<target.r*0.2?10:dist<target.r*0.4?8:dist<target.r*0.6?6:dist<target.r*0.8?4:2;
score+=points;document.getElementById('score').textContent=score;
playSound(points>=8?800:500,0.2);arrow=null;
if(arrowsLeft<=0)endGame();
}
if(arrow&&(arrow.x>W+50||arrow.y>H)){arrow=null;if(arrowsLeft<=0)endGame()}
}
function draw(){drawBg();drawTarget();drawArcher();drawWind();
if(arrow)drawArrow(arrow);drawAimLine();
}
function shoot(){
if(arrow||arrowsLeft<=0)return;
arrowsLeft--;document.getElementById('arrows').textContent=arrowsLeft;
arrow={x:50,y:H*0.7-35,vx:12,vy:-3,angle:0};
wind=(Math.random()-0.5)*3;
playSound(300,0.1);
}
function endGame(){
setTimeout(()=>{document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')},1000);
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
C.addEventListener('mousedown',e=>{aiming=true;aimStart={x:e.clientX,y:e.clientY}});
C.addEventListener('mouseup',e=>{
if(aiming){aiming=false;shoot()}
});
C.addEventListener('touchstart',e=>{e.preventDefault();aiming=true;aimStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:false});
C.addEventListener('touchend',e=>{if(aiming){aiming=false;shoot()}});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
