<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潜艇冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0D47A1,#01579B);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#0277BD,#01579B);padding:40px;border-radius:20px;text-align:center;max-width:400px;border:2px solid #4FC3F7}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#4FC3F7;color:#fff;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">氧气: <span id="o2">100</span>%</div></div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🤿 潜艇冒险</h1><p>方向键控制潜艇<br>收集宝藏，躲避水母！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.2);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=400;
let sub,obstacles,treasures,bubbles,score,o2,running,scrollX;
const keys={};
function init(){
sub={x:100,y:H/2,w:50,h:25};obstacles=[];treasures=[];bubbles=[];
score=0;o2=100;running=true;scrollX=0;
document.getElementById('score').textContent=0;document.getElementById('o2').textContent=100;
for(let i=0;i<5;i++){genObstacle(W+i*150);if(i<3)genTreasure(W+i*200)}
}
function genObstacle(x){
obstacles.push({x,y:30+Math.random()*(H-60),r:15+Math.random()*10,type:Math.random()<0.5?'jelly':'mine'});
}
function genTreasure(x){treasures.push({x,y:50+Math.random()*(H-100),r:12,type:Math.random()<0.3?'gold':'silver'})}
function drawBg(){
const grad=X.createLinearGradient(0,0,0,H);
grad.addColorStop(0,'#0277BD');grad.addColorStop(1,'#01579B');
X.fillStyle=grad;X.fillRect(0,0,W,H);
// light rays
X.globalAlpha=0.05;
for(let i=0;i<5;i++){X.fillStyle='#4FC3F7';X.fillRect(i*150+scrollX*0.2%150,0,60,H)}
X.globalAlpha=1;
// bubbles
bubbles.forEach(b=>{X.globalAlpha=b.life;X.fillStyle='rgba(255,255,255,0.4)';X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill()});
X.globalAlpha=1;
}
function drawSub(){
X.save();X.translate(sub.x+sub.w/2,sub.y+sub.h/2);
X.fillStyle='#FFD93D';X.shadowColor='#FFD93D';X.shadowBlur=8;
X.beginPath();X.ellipse(0,0,sub.w/2,sub.h/2,0,0,Math.PI*2);X.fill();
X.fillStyle='#4FC3F7';X.fillRect(-5,-sub.h/2-5,10,5);
X.fillStyle='#333';X.fillRect(sub.w/2-5,-3,8,6);
X.fillStyle='rgba(255,255,255,0.5)';X.fillRect(-10,-5,8,10);
X.shadowBlur=0;X.restore();
}
function drawObstacles(){
obstacles.forEach(o=>{
if(o.type==='jelly'){
X.fillStyle='rgba(200,100,255,0.6)';
X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI);X.fill();
X.strokeStyle='rgba(200,100,255,0.4)';X.lineWidth=2;
for(let i=0;i<3;i++){X.beginPath();X.moveTo(o.x-o.r/2+i*o.r/2,o.y);X.lineTo(o.x-o.r/2+i*o.r/2+Math.sin(Date.now()*0.005+i)*5,o.y+o.r);X.stroke()}
}else{
X.fillStyle='#F44336';X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI*2);X.fill();
X.fillStyle='#fff';X.font='12px sans-serif';X.textAlign='center';X.textBaseline='middle';
X.fillText('💣',o.x,o.y);
}
});
}
function drawTreasures(){
treasures.forEach(t=>{
X.fillStyle=t.type==='gold'?'#FFD93D':'#B0BEC5';
X.shadowColor=X.fillStyle;X.shadowBlur=8;
X.font='24px serif';X.textAlign='center';X.textBaseline='middle';
X.fillText(t.type==='gold'?'⭐':'💎',t.x,t.y);
X.shadowBlur=0;
});
}
function update(){
if(!running)return;
scrollX++;
if(keys.ArrowUp)sub.y=Math.max(0,sub.y-4);
if(keys.ArrowDown)sub.y=Math.min(H-sub.h,sub.y+4);
if(keys.ArrowLeft)sub.x=Math.max(0,sub.x-4);
if(keys.ArrowRight)sub.x=Math.min(W-sub.w,sub.x+4);
o2-=0.03;document.getElementById('o2').textContent=Math.floor(Math.max(0,o2));
if(o2<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
if(Math.random()<0.02)bubbles.push({x:sub.x+sub.w/2,y:sub.y+sub.h,r:2+Math.random()*3,life:1});
bubbles.forEach(b=>{b.y-=1;b.x+=Math.sin(b.y*0.1)*0.5;b.life-=0.01});
bubbles=bubbles.filter(b=>b.life>0&&b.y>0);
obstacles.forEach(o=>{
o.x-=2;
const dx=sub.x+sub.w/2-o.x,dy=sub.y+sub.h/2-o.y;
if(Math.sqrt(dx*dx+dy*dy)<o.r+15){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');playSound(200,0.3)}
});
treasures.forEach((t,i)=>{
t.x-=2;
const dx=sub.x+sub.w/2-t.x,dy=sub.y+sub.h/2-t.y;
if(Math.sqrt(dx*dx+dy*dy)<t.r+20){
score+=t.type==='gold'?20:10;o2=Math.min(100,o2+10);
document.getElementById('score').textContent=score;document.getElementById('o2').textContent=Math.floor(o2);
treasures.splice(i,1);playSound(600,0.1);
}
});
obstacles=obstacles.filter(o=>o.x>-30);
treasures=treasures.filter(t=>t.x>-30);
if(obstacles.length<5)genObstacle(W+100+Math.random()*100);
if(treasures.length<3)genTreasure(W+100+Math.random()*150);
}
function draw(){drawBg();drawObstacles();drawTreasures();drawSub()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{keys[e.key]=true;e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.key]=false);
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
