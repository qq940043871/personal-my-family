<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打雪仗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#B3E5FC,#E1F5FE);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px;background:rgba(255,255,255,0.5)}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.5);padding:5px 15px;border-radius:15px;font-size:0.9em;font-weight:bold}
.back{color:#333;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.6);border-radius:15px;font-size:0.9em}
canvas{margin-top:10px;cursor:crosshair}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#B3E5FC,#81D4FA);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">得分: <span id="score">0</span></div><div class="info-item">时间: <span id="time">30</span></div></div>
</div>
<canvas id="game" width="600" height="400"></canvas>

<div class="overlay" id="start"><div class="box"><h1>⛄ 打雪仗</h1><p>点击扔雪球击中目标<br>30秒内得尽可能多分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>时间到！</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=400;
let targets,snowballs,score,timeLeft,running,timer;
function init(){
targets=[];snowballs=[];score=0;timeLeft=30;running=true;
document.getElementById('score').textContent=0;document.getElementById('time').textContent=30;
clearInterval(timer);timer.setInterval(()=>{timeLeft--;document.getElementById('time').textContent=timeLeft;if(timeLeft<=0)endGame()},1000);
spawnTarget();
}
function spawnTarget(){
const types=[
{emoji:'⛄',points:10,r:25},{emoji:'🎄',points:15,r:20},{emoji:'🎅',points:20,r:18},{emoji:'🦌',points:25,r:15}
];
const t=types[Math.floor(Math.random()*types.length)];
targets.push({x:50+Math.random()*(W-100),y:50+Math.random()*(H-100),...t,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*2,alive:true});
}
function drawBg(){
X.fillStyle='#B3E5FC';X.fillRect(0,0,W,H);
// snow ground
X.fillStyle='#fff';X.fillRect(0,H-40,W,40);
X.fillStyle='#E1F5FE';for(let i=0;i<10;i++){X.beginPath();X.arc(i*70,H-35,15,0,Math.PI*2);X.fill()}
// snowflakes
X.fillStyle='rgba(255,255,255,0.8)';
for(let i=0;i<20;i++){X.beginPath();X.arc((i*37+Date.now()*0.02)%W,(i*53+Date.now()*0.03)%H,2,0,Math.PI*2);X.fill()}
}
function drawTargets(){
targets.forEach(t=>{
if(!t.alive)return;
X.font='40px serif';X.textAlign='center';X.textBaseline='middle';
X.fillText(t.emoji,t.x,t.y);
});
}
function drawSnowballs(){
snowballs.forEach(s=>{
X.fillStyle='#fff';X.shadowColor='#B3E5FC';X.shadowBlur=5;
X.beginPath();X.arc(s.x,s.y,5,0,Math.PI*2);X.fill();X.shadowBlur=0;
// trail
X.fillStyle='rgba(255,255,255,0.3)';
X.beginPath();X.arc(s.x-s.vx*2,s.y-s.vy*2,3,0,Math.PI*2);X.fill();
});
}
function update(){
if(!running)return;
targets.forEach(t=>{
if(!t.alive)return;
t.x+=t.vx;t.y+=t.vy;
if(t.x<30||t.x>W-30)t.vx*=-1;
if(t.y<30||t.y>H-60)t.vy*=-1;
});
snowballs.forEach((s,i)=>{
s.x+=s.vx;s.y+=s.vy;s.vy+=0.1;
// hit check
targets.forEach(t=>{
if(!t.alive)return;
if(Math.sqrt((s.x-t.x)**2+(s.y-t.y)**2)<t.r){
t.alive=false;score+=t.points;document.getElementById('score').textContent=score;
playSound(700,0.1);snowballs.splice(i,1);
setTimeout(spawnTarget,500);
}
});
if(s.y>H||s.x<0||s.x>W)snowballs.splice(i,1);
});
targets=targets.filter(t=>t.alive);
}
function draw(){drawBg();drawTargets();drawSnowballs()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
function endGame(){running=false;clearInterval(timer);document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden')}
C.addEventListener('click',e=>{
const r=C.getBoundingClientRect();
const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
const dx=mx-W/2,dy=my-H;
const dist=Math.sqrt(dx*dx+dy*dy);
snowballs.push({x:W/2,y:H,dx/dist*8,vy:dy/dist*8});playSound(300,0.05);
});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
