<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电路板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.grid{display:grid;gap:3px;padding:15px;background:rgba(0,0,0,0.3);border-radius:10px;margin:15px 0}
.cell{width:50px;height:50px;background:rgba(255,255,255,0.05);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5em;transition:all 0.2s}
.cell:hover{background:rgba(255,255,255,0.1)}
.cell.on{background:rgba(255,215,61,0.3);box-shadow:0 0 10px rgba(255,215,61,0.5)}
.controls{display:flex;gap:10px;margin:10px 0}
.ctrl{padding:8px 20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>💡 电路板</h2>
<div></div>
</div>
<div class="grid" id="grid"></div>
<div class="controls">
<button class="ctrl" onclick="reset()">🔄 重置</button>
</div>

<script>
const SIZE=6;
let grid,selected;
function init(){
grid=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
selected=null;
// place battery and bulbs
grid[0][0]='🔋';grid[SIZE-1][SIZE-1]='💡';
grid[2][2]='💡';grid[4][1]='💡';
// place some wires
grid[0][1]='━';grid[0][2]='┃';grid[1][2]='━';grid[1][3]='┃';grid[2][3]='━';
render();
}
function render(){
const div=document.getElementById('grid');div.innerHTML='';
div.style.gridTemplateColumns=`repeat(${SIZE},50px)`;
for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
const cell=document.createElement('div');cell.className='cell';
if(grid[r][c])cell.textContent=grid[r][c];
if(grid[r][c]==='💡'&&isConnected(r,c))cell.classList.add('on');
cell.addEventListener('click',()=>handleClick(r,c));
div.appendChild(cell);
});
}
function handleClick(r,c){
if(grid[r][c]==='🔋'||grid[r][c]==='💡')return;
const types=[null,'━','┃','┗','┛','┏','┓'];
const current=types.indexOf(grid[r][c]);
grid[r][c]=types[(current+1)%types.length];
playSound(400,0.05);render();
}
function isConnected(r,c){
// simple: check if battery connects to bulb through wires
const visited=new Set();
function dfs(r2,c2){
const key=r2+','+c2;if(visited.has(key))return false;visited.add(key);
if(grid[r2][c2]==='🔋')return true;
const dirs=getConnections(r2,c2);
for(const[dr,dc]of dirs){
const nr=r2+dr,nc=c2+dc;
if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&grid[nr][nc]){
if(getConnections(nr,nc).some(([nr2,nc2])=>nr2===-dr&&nc2===-dc)){
if(dfs(nr,nc))return true;
}
}
}
return false;
}
return dfs(r,c);
}
function getConnections(r,c){
const t=grid[r][c];
if(t==='━')return[[0,-1],[0,1]];
if(t==='┃')return[[-1,0],[1,0]];
if(t==='┗')return[[0,1],[-1,0]];
if(t==='┛')return[[0,-1],[-1,0]];
if(t==='┏')return[[0,1],[1,0]];
if(t==='┓')return[[0,-1],[1,0]];
if(t==='🔋'||t==='💡')return[[-1,0],[1,0],[0,-1],[0,1]];
return[];
}
function reset(){init()}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
init();
</script>
</body>
</html>
