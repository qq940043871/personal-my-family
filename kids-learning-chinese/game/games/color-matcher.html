<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色匹配</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.15);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.2);border-radius:15px;font-size:0.9em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px;max-width:400px;width:100%}
.card{aspect-ratio:1;border-radius:12px;cursor:pointer;transition:all 0.3s;perspective:500px}
.card-inner{width:100%;height:100%;transition:transform 0.5s;transform-style:preserve-3d;position:relative}
.card.flipped .card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px}
.card-front{background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:1.5em}
.card-back{transform:rotateY(180deg);border:3px solid rgba(255,255,255,0.3)}
.card.matched{opacity:0.5;pointer-events:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">配对: <span id="pairs">0</span>/8</div></div>
</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="start"><div class="box"><h1>🎨 颜色匹配</h1><p>翻牌找到颜色相同的配对<br>训练你的颜色感知！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>🎉 恭喜！</h1><p>完成所有配对！</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const COLORS=['#FF6B6B','#FF9800','#FFD93D','#6BCB77','#4D96FF','#C084FC','#F06292','#00BCD4'];
let cards,flipped,matched,lock;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
flipped=[];matched=new Set();lock=false;
const deck=[...COLORS,...COLORS].sort(()=>Math.random()-0.5);
cards=deck.map((c,i)=>({id:i,color:c,pairId:COLORS.indexOf(c)}));
render();
}
function render(){
const grid=document.getElementById('grid');grid.innerHTML='';
cards.forEach((c,i)=>{
const card=document.createElement('div');card.className='card'+(matched.has(c.pairId)?' matched':'');
if(flipped.includes(i))card.classList.add('flipped');
card.innerHTML=`<div class="card-inner"><div class="card-front">❓</div><div class="card-back" style="background:${c.color}"></div></div>`;
card.addEventListener('click',()=>flipCard(i));
grid.appendChild(card);
});
document.getElementById('pairs').textContent=matched.size;
}
function flipCard(i){
if(lock||flipped.includes(i)||matched.has(cards[i].pairId))return;
flipped.push(i);playSound(400,0.05);render();
if(flipped.length===2){
lock=true;
const[a,b]=flipped;
if(cards[a].pairId===cards[b].pairId){
matched.add(cards[a].pairId);playSound(700,0.2);
flipped=[];lock=false;render();
if(matched.size===8)setTimeout(()=>{document.getElementById('over').classList.remove('hidden')},500);
}else{setTimeout(()=>{flipped=[];lock=false;render();playSound(200,0.1)},800)}
}
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
