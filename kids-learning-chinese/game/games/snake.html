<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.score{font-size:1.5em;background:rgba(255,255,255,0.1);padding:5px 20px;border-radius:20px}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:#0f0f23}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px;opacity:0.9}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.btn:hover{transform:scale(1.05)}
.hidden{display:none}
.tip{color:rgba(255,255,255,0.5);margin-top:10px;font-size:0.85em}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="score">得分: <span id="score">0</span></div>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="tip">方向键 或 WASD 控制移动</div>

<div class="overlay" id="start">
<div class="box">
<h1>🐍 贪吃蛇</h1>
<p>吃食物让小蛇变长<br>不要撞到墙壁和自己！</p>
<button class="btn" onclick="startGame()">开始游戏</button>
</div>
</div>

<div class="overlay hidden" id="over">
<div class="box">
<h1>游戏结束</h1>
<p>得分: <span id="final">0</span></p>
<button class="btn" onclick="startGame()">再来一次</button>
<a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a>
</div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const GRID=20,COLS=canvas.width/GRID,ROWS=canvas.height/GRID;
let snake,food,dir,nextDir,score,gameLoop,speed;
const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF6B9D','#C084FC'];
function init(){
snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
dir={x:1,y:0};nextDir={x:1,y:0};score=0;speed=150;
document.getElementById('score').textContent=0;
placeFood();
}
function placeFood(){
do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function draw(){
ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,canvas.width,canvas.height);
// grid
ctx.strokeStyle='rgba(255,255,255,0.03)';
for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++)ctx.strokeRect(i*GRID,j*GRID,GRID,GRID);
// food
ctx.fillStyle='#FF6B6B';ctx.shadowColor='#FF6B6B';ctx.shadowBlur=10;
ctx.beginPath();ctx.arc(food.x*GRID+GRID/2,food.y*GRID+GRID/2,GRID/2-2,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
// snake
snake.forEach((s,i)=>{
const c=i===0?'#6BCB77':colors[i%colors.length];
ctx.fillStyle=c;
ctx.shadowColor=c;ctx.shadowBlur=i===0?8:0;
ctx.fillRect(s.x*GRID+1,s.y*GRID+1,GRID-2,GRID-2);
if(i===0){ctx.fillStyle='#fff';ctx.fillRect(s.x*GRID+5,s.y*GRID+5,4,4);ctx.fillRect(s.x*GRID+12,s.y*GRID+5,4,4)}
});
ctx.shadowBlur=0;
}
function update(){
dir=nextDir;
const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
clearInterval(gameLoop);gameOver();return;
}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){
score+=10;document.getElementById('score').textContent=score;
placeFood();if(speed>60){speed-=5;clearInterval(gameLoop);gameLoop=setInterval(update,speed)}
playSound(600,0.1);
}else snake.pop();
playSound(200,0.05);
draw();
}
function gameOver(){
document.getElementById('final').textContent=score;
document.getElementById('over').classList.remove('hidden');
playSound(200,0.3);
}
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
init();draw();clearInterval(gameLoop);gameLoop=setInterval(update,speed);
}
document.addEventListener('keydown',e=>{
const k=e.key.toLowerCase();
if((k==='arrowup'||k==='w')&&dir.y!==1)nextDir={x:0,y:-1};
if((k==='arrowdown'||k==='s')&&dir.y!==-1)nextDir={x:0,y:1};
if((k==='arrowleft'||k==='a')&&dir.x!==1)nextDir={x:-1,y:0};
if((k==='arrowright'||k==='d')&&dir.x!==-1)nextDir={x:1,y:0};
e.preventDefault();
});
// touch support
let touchStart=null;
canvas.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}});
canvas.addEventListener('touchend',e=>{
if(!touchStart)return;
const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0}}
else{if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1}}
});
function playSound(freq,dur){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);o.stop(a.currentTime+dur)}catch(e){}}
init();draw();
</script>
</body>
</html>
