<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喷漆艺术</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 20px;background:#222}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
.colors{display:flex;gap:5px;padding:10px}
.cbtn{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cbtn.active{border-color:#fff;transform:scale(1.2)}
.controls{display:flex;gap:10px;margin:5px 0}
.ctrl{padding:5px 15px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;cursor:pointer;font-size:0.85em}
canvas{cursor:crosshair;border:2px solid #555}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h2>🎨 喷漆艺术</h2>
<div></div>
</div>
<div class="colors" id="colors"></div>
<div class="controls">
<button class="ctrl" onclick="size=5">细</button>
<button class="ctrl" onclick="size=15">中</button>
<button class="ctrl" onclick="size=30">粗</button>
<button class="ctrl" onclick="clearCanvas()">清除</button>
<button class="ctrl" onclick="saveCanvas()">保存</button>
</div>
<canvas id="canvas" width="600" height="450"></canvas>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const COLORS=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC','#FF9800','#F06292','#fff','#000'];
let color=COLORS[0],size=15,spraying=false;
function init(){
ctx.fillStyle='#444';ctx.fillRect(0,0,600,450);
const div=document.getElementById('colors');div.innerHTML='';
COLORS.forEach(c=>{
const btn=document.createElement('div');btn.className='cbtn'+(c===color?' active':'');
btn.style.background=c;btn.addEventListener('click',()=>{color=c;document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')});
div.appendChild(btn);
});
}
canvas.addEventListener('mousedown',()=>spraying=true);
canvas.addEventListener('mouseup',()=>spraying=false);
canvas.addEventListener('mousemove',e=>{if(spraying)spray(e.offsetX,e.offsetY)});
canvas.addEventListener('touchstart',e=>{e.preventDefault();spraying=true;spray(e.offsetX,e.offsetY)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(spraying)spray(e.offsetX,e.offsetY)},{passive:false});
canvas.addEventListener('touchend',()=>spraying=false);
function spray(x,y){
for(let i=0;i<20;i++){
const angle=Math.random()*Math.PI*2;
const r=Math.random()*size;
const px=x+Math.cos(angle)*r;
const py=y+Math.sin(angle)*r;
ctx.fillStyle=color;ctx.globalAlpha=0.3+Math.random()*0.4;
ctx.fillRect(px,py,2,2);
}
ctx.globalAlpha=1;
}
function clearCanvas(){ctx.fillStyle='#444';ctx.fillRect(0,0,600,450)}
function saveCanvas(){const link=document.createElement('a');link.download='喷漆艺术.png';link.href=canvas.toDataURL();link.click()}
init();
</script>
</body>
</html>
