<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#333;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.back{color:#333;text-decoration:none;padding:5px 15px;background:#eee;border-radius:15px;font-size:0.9em}
h1{font-size:1.3em}
.garden{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;padding:20px;max-width:500px}
.pot{width:80px;text-align:center;cursor:pointer;padding:10px;background:#fff;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:transform 0.2s}
.pot:hover{transform:scale(1.05)}
.plant{font-size:3em;height:80px;display:flex;align-items:flex-end;justify-content:center}
.pot-label{font-size:0.8em;color:#666;margin-top:5px}
.tools{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;justify-content:center}
.tool{padding:10px 20px;background:#fff;border:2px solid #ddd;border-radius:12px;cursor:pointer;font-size:0.9em;transition:all 0.2s}
.tool:hover,.tool.active{border-color:#4CAF50;background:#E8F5E9}
.info{color:#666;font-size:0.9em;text-align:center;margin:10px 0;max-width:400px}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<h1>🌻 花园种花</h1>
<div></div>
</div>
<div class="tools">
<div class="tool active" onclick="selectTool('plant')">🌱 种花</div>
<div class="tool" onclick="selectTool('water')">💧 浇水</div>
<div class="tool" onclick="selectTool('remove')">🗑️ 移除</div>
</div>
<div class="garden" id="garden"></div>
<div class="info">选择工具后点击花盆操作<br>浇水让花朵成长！</div>

<script>
const flowers=['🌱','🌿','🌷','🌻','🌹','🌺','🌸','💐'];
let pots,tool;
function init(){
pots=Array.from({length:9},(_,i)=>({id:i,stage:0,flower:null,type:null}));
tool='plant';render();
}
function render(){
const garden=document.getElementById('garden');garden.innerHTML='';
pots.forEach(p=>{
const pot=document.createElement('div');pot.className='pot';
const plant=document.createElement('div');plant.className='plant';
if(p.flower){
const stages=['🌱','🌿',p.flower];
plant.textContent=stages[Math.min(p.stage,stages.length-1)];
}else{plant.textContent='🪴'}
pot.appendChild(plant);
const label=document.createElement('div');label.className='pot-label';
label.textContent=p.flower?'浇水'+p.stage+'次':'空花盆';
pot.appendChild(label);
pot.addEventListener('click',()=>interact(p.id));
garden.appendChild(pot);
});
}
function selectTool(t){
tool=t;
document.querySelectorAll('.tool').forEach(el=>el.classList.remove('active'));
event.target.classList.add('active');
}
function interact(id){
const p=pots[id];
if(tool==='plant'&&!p.flower){
const flowerTypes=['🌷','🌻','🌹','🌺','🌸'];
p.flower=flowerTypes[Math.floor(Math.random()*flowerTypes.length)];
p.stage=0;
playSound(500,0.1);
}else if(tool==='water'&&p.flower&&p.stage<2){
p.stage++;
playSound(400,0.1);
if(p.stage>=2){
const el=document.querySelectorAll('.plant')[id];
el.style.transition='transform 0.5s';el.style.transform='scale(1.3)';
setTimeout(()=>el.style.transform='scale(1)',500);
playSound(700,0.2);
}
}else if(tool==='remove'&&p.flower){
p.flower=null;p.stage=0;
playSound(200,0.1);
}
render();
}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
init();
</script>
</body>
</html>
