<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0c0c1d,#1a1a3e);display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}
.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.3);border-radius:10px;background:#0a0a1a;margin-top:10px;cursor:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#667eea,#764ba2);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}
.box p{margin-bottom:20px;opacity:0.9}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">得分: <span id="score">0</span></div>
<div class="info-item">生命: <span id="lives">3</span></div>
</div>
</div>
<canvas id="game" width="480" height="500"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🏓 打砖块</h1><p>移动鼠标控制球拍<br>弹球打碎所有砖块！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>得分: <span id="final">0</span></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#fff;display:inline-block;text-decoration:none">返回菜单</a></div></div>
<div class="overlay hidden" id="win"><div class="box"><h1>🎉 恭喜通关！</h1><p>得分: <span id="winScore">0</span></p><button class="btn" onclick="startGame()">再玩一次</button></div></div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let paddle,ball,bricks,score,lives,running;
const BRICK_ROWS=5,BRICK_COLS=8,BRICK_W=54,BRICK_H=20,BRICK_PAD=4,BRICK_TOP=50,BRICK_LEFT=10;
const brickColors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C084FC'];
function init(){
paddle={x:W/2-50,y:H-30,w:100,h:12};
ball={x:W/2,y:H-50,dx:3,dy:-3,r:6,launched:false};
bricks=[];
for(let r=0;r<BRICK_ROWS;r++)for(let c=0;c<BRICK_COLS;c++){
bricks.push({x:BRICK_LEFT+c*(BRICK_W+BRICK_PAD),y:BRICK_TOP+r*(BRICK_H+BRICK_PAD),w:BRICK_W,h:BRICK_H,color:brickColors[r],alive:true});
}
score=0;lives=3;running=true;
document.getElementById('score').textContent=0;
document.getElementById('lives').textContent=3;
}
function drawPaddle(){
ctx.fillStyle='#4D96FF';ctx.shadowColor='#4D96FF';ctx.shadowBlur=10;
ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
ctx.shadowBlur=0;
}
function drawBall(){
ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;
ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;
}
function drawBricks(){
bricks.forEach(b=>{
if(!b.alive)return;
ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=5;
ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.shadowBlur=0;
});
}
function update(){
if(!running)return;
if(!ball.launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return}
ball.x+=ball.dx;ball.y+=ball.dy;
if(ball.x-ball.r<0||ball.x+ball.r>W)ball.dx*=-1;
if(ball.y-ball.r<0)ball.dy*=-1;
if(ball.y+ball.r>H){lives--;document.getElementById('lives').textContent=lives;
if(lives<=0){running=false;document.getElementById('final').textContent=score;document.getElementById('over').classList.remove('hidden');return}
ball.launched=false;ball.dx=3*(Math.random()>0.5?1:-1);ball.dy=-3;return;
}
if(ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.dy>0){
ball.dy=-Math.abs(ball.dy);
const off=(ball.x-paddle.x)/paddle.w-0.5;
ball.dx=off*8;
playSound(400,0.1);
}
bricks.forEach(b=>{
if(!b.alive)return;
if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
b.alive=false;ball.dy*=-1;score+=10;
document.getElementById('score').textContent=score;
playSound(600,0.1);
if(bricks.every(bb=>!bb.alive)){running=false;document.getElementById('winScore').textContent=score;document.getElementById('win').classList.remove('hidden')}
}
});
}
function draw(){
ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
drawBricks();drawPaddle();drawBall();
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
document.getElementById('win').classList.add('hidden');
init();loop();
}
canvas.addEventListener('mousemove',e=>{
const rect=canvas.getBoundingClientRect();
paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-rect.left)*(W/rect.width)-paddle.w/2));
if(!ball.launched)ball.x=paddle.x+paddle.w/2;
});
canvas.addEventListener('click',()=>{if(!ball.launched){ball.launched=true;ball.dx=3*(Math.random()>0.5?1:-1);ball.dy=-3}});
canvas.addEventListener('touchmove',e=>{
e.preventDefault();
const rect=canvas.getBoundingClientRect();
const touch=e.touches[0];
paddle.x=Math.max(0,Math.min(W-paddle.w,(touch.clientX-rect.left)*(W/rect.width)-paddle.w/2));
if(!ball.launched)ball.x=paddle.x+paddle.w/2;
},{passive:false});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(!ball.launched){ball.launched=true;ball.dx=3*(Math.random()>0.5?1:-1);ball.dy=-3}},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
