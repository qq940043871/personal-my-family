<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学答题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:500px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.15);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.2);border-radius:15px;font-size:0.9em}
.game{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;width:100%;max-width:500px}
.question{font-size:3em;margin:20px 0;background:rgba(255,255,255,0.15);padding:20px 40px;border-radius:20px;min-width:250px;text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:400px;margin:20px 0}
.opt{padding:20px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:15px;font-size:1.5em;cursor:pointer;text-align:center;transition:all 0.2s;color:#fff}
.opt:hover{background:rgba(255,255,255,0.25);transform:scale(1.05)}
.opt.correct{background:#4CAF50;border-color:#4CAF50}
.opt.wrong{background:#F44336;border-color:#F44336}
.timer-bar{width:100%;max-width:400px;height:8px;background:rgba(255,255,255,0.2);border-radius:4px;margin:10px 0;overflow:hidden}
.timer-fill{height:100%;background:#4CAF50;border-radius:4px;transition:width 0.1s linear}
.streak{font-size:1.2em;color:#FFD93D;margin:10px 0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info">
<div class="info-item">得分: <span id="score">0</span></div>
<div class="info-item">连对: <span id="streak">0</span></div>
</div>
</div>
<div class="game">
<div class="timer-bar"><div class="timer-fill" id="timer"></div></div>
<div class="question" id="question">3 + 5 = ?</div>
<div class="options" id="options"></div>
<div class="streak" id="streakMsg"></div>
</div>

<div class="overlay" id="start"><div class="box"><h1>🧮 数学答题</h1><p>快速选择正确答案<br>连续答对有额外加分！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>时间到！</h1><p>得分: <span id="final">0</span><br>答对: <span id="correct">0</span> 题</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
let score,streak,total,correctAns,timeLeft,timerInterval,answered;
function startGame(){
document.getElementById('start').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
score=0;streak=0;total=0;timeLeft=60;answered=false;
document.getElementById('score').textContent=0;
document.getElementById('streak').textContent=0;
document.getElementById('streakMsg').textContent='';
clearInterval(timerInterval);
timerInterval=setInterval(()=>{
timeLeft--;document.getElementById('timer').style.width=(timeLeft/60*100)+'%';
if(timeLeft<=0)endGame();
},1000);
nextQuestion();
}
function nextQuestion(){
answered=false;
const ops=['+','-','×'];
const op=ops[Math.floor(Math.random()*ops.length)];
let a,b,ans;
if(op==='+'){a=rand(1,20+score/10);b=rand(1,20+score/10);ans=a+b}
else if(op==='-'){a=rand(5,30+score/10);b=rand(1,a);ans=a-b}
else{a=rand(2,9+score/50);b=rand(2,9);ans=a*b}
document.getElementById('question').textContent=`${a} ${op} ${b} = ?`;
const opts=[ans];
while(opts.length<4){
let wrong=ans+rand(-5,10);
if(wrong!==ans&&!opts.includes(wrong)&&wrong>=0)opts.push(wrong);
}
opts.sort(()=>Math.random()-0.5);
const optDiv=document.getElementById('options');
optDiv.innerHTML='';
opts.forEach(o=>{
const btn=document.createElement('div');
btn.className='opt';btn.textContent=o;
btn.addEventListener('click',()=>checkAnswer(btn,o,ans));
optDiv.appendChild(btn);
});
}
function checkAnswer(btn,selected,correct){
if(answered)return;answered=true;
total++;
const allOpts=document.querySelectorAll('.opt');
allOpts.forEach(o=>{
if(parseInt(o.textContent)===correct)o.classList.add('correct');
});
if(selected===correct){
score+=10+streak*5;streak++;
document.getElementById('score').textContent=score;
document.getElementById('streak').textContent=streak;
if(streak>=3)document.getElementById('streakMsg').textContent=`🔥 ${streak}连对！额外+${streak*5}分`;
playSound(600,0.1);
}else{streak=0;document.getElementById('streak').textContent=0;document.getElementById('streakMsg').textContent='';btn.classList.add('wrong');playSound(200,0.2)}
setTimeout(nextQuestion,800);
}
function endGame(){
clearInterval(timerInterval);
document.getElementById('final').textContent=score;
document.getElementById('correct').textContent=total;
document.getElementById('over').classList.remove('hidden');
}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
