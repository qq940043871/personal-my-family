<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛车游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FF9800);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">距离: <span id="dist">0</span>m</div><div class="info-item">生命: <span id="lives">3</span></div></div>
</div>
<canvas id="game" width="400" height="600"></canvas>

<div class="overlay" id="start"><div class="box"><h1>🚗 赛车游戏</h1><p>左右方向键控制赛车<br>躲避来车，收集燃油！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1>游戏结束</h1><p>距离: <span id="final">0</span>m</p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=400,H=600,LW=8,LANES=[80,160,240,320];
let player,cars,fuels,distance,lives,running,speed,roadOffset;
const keys={};
function init(){
player={x:W/2-20,y:H-100,w:40,h:70};
cars=[];fuels=[];distance=0;lives=3;speed=3;roadOffset=0;running=true;
document.getElementById('dist').textContent=0;
document.getElementById('lives').textContent=3;
}
function drawRoad(){
X.fillStyle='#333';X.fillRect(0,0,W,H);
// lane lines
X.strokeStyle='#fff';X.lineWidth=2;X.setLineDash([30,20]);
for(let i=1;i<4;i++){X.beginPath();X.moveTo(i*100,0);X.lineTo(i*100,H);X.stroke()}
X.setLineDash([]);
// edge lines
X.strokeStyle='#FFD93D';X.lineWidth=4;
X.beginPath();X.moveTo(40,0);X.lineTo(40,H);X.stroke();
X.beginPath();X.moveTo(W-40,0);X.lineTo(W-40,H);X.stroke();
// road markings offset
X.fillStyle='rgba(255,255,255,0.1)';
for(let y=roadOffset%H;y<H;y+=60){X.fillRect(W/2-2,y,4,30)}
}
function drawCar(x,y,w,h,color){
X.fillStyle=color;X.shadowColor=color;X.shadowBlur=5;
X.fillRect(x+5,y,w-10,h);
X.fillRect(x,y+10,w,h-20);
// windows
X.fillStyle='rgba(200,230,255,0.8)';
X.fillRect(x+8,y+15,w-16,15);
X.fillRect(x+8,y+h-25,w-16,10);
// wheels
X.fillStyle='#333';
X.fillRect(x-3,y+5,8,15);X.fillRect(x+w-5,y+5,8,15);
X.fillRect(x-3,y+h-20,8,15);X.fillRect(x+w-5,y+h-20,8,15);
X.shadowBlur=0;
}
function drawPlayer(){drawCar(player.x,player.y,player.w,player.h,'#4D96FF')}
function spawnCar(){
const lane=LANES[Math.floor(Math.random()*4)];
const colors=['#FF6B6B','#FFD93D','#6BCB77','#C084FC','#FF9800'];
cars.push({x:lane-20,y:-80,w:40,h:70,color:colors[Math.floor(Math.random()*5)],speed:1+Math.random()*2});
}
function spawnFuel(){
const lane=LANES[Math.floor(Math.random()*4)];
fuels.push({x:lane-15,y:-30,r:15});
}
function update(){
if(!running)return;
roadOffset+=speed*3;
if(keys.ArrowLeft)player.x=Math.max(40,player.x-5);
if(keys.ArrowRight)player.x=Math.min(W-40-player.w,player.x+5);
distance+=Math.floor(speed);
document.getElementById('dist').textContent=distance;
speed=Math.min(8,3+distance/500);
// spawn
if(Math.random()<0.03)spawnCar();
if(Math.random()<0.01)spawnFuel();
// move cars
cars.forEach(c=>{
c.y+=speed-c.speed;
if(c.y+70>player.y&&c.y<player.y+player.h&&c.x+40>player.x&&c.x<player.x+player.w){
lives--;document.getElementById('lives').textContent=lives;
c.y=H+100;playSound(200,0.3);
if(lives<=0){running=false;document.getElementById('final').textContent=distance;document.getElementById('over').classList.remove('hidden')}
}
});
cars=cars.filter(c=>c.y<H+100);
// fuels
fuels.forEach(f=>{
f.y+=speed;
if(Math.sqrt((player.x+20-f.x)**2+(player.y+35-f.y)**2)<35){
f.y=H+100;distance+=50;playSound(700,0.1);
}
});
fuels=fuels.filter(f=>f.y<H+100);
}
function draw(){
drawRoad();
cars.forEach(c=>drawCar(c.x,c.y,c.w,c.h,c.color));
fuels.forEach(f=>{
X.fillStyle='#FFD93D';X.shadowColor='#FFD93D';X.shadowBlur=8;
X.beginPath();X.arc(f.x,f.y,f.r,0,Math.PI*2);X.fill();
X.fillStyle='#FF6B6B';X.font='16px sans-serif';X.textAlign='center';X.textBaseline='middle';
X.fillText('⛽',f.x,f.y);
X.shadowBlur=0;
});
drawPlayer();
// speed indicator
X.fillStyle='rgba(255,255,255,0.5)';X.font='12px sans-serif';
X.fillText('速度: '+speed.toFixed(1),W-80,H-10);
}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
document.addEventListener('keydown',e=>{keys[e.key]=true;e.preventDefault()});
document.addEventListener('keyup',e=>keys[e.key]=false);
// touch
let touchX=null;
C.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX});
C.addEventListener('touchmove',e=>{
e.preventDefault();
const dx=e.touches[0].clientX-touchX;
if(dx<-10)player.x=Math.max(40,player.x-8);
else if(dx>10)player.x=Math.min(W-40-player.w,player.x+8);
touchX=e.touches[0].clientX;
},{passive:false});
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
