<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学赛车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;font-family:'Microsoft YaHei',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;padding:10px 20px}
.info{display:flex;gap:15px}.info-item{background:rgba(255,255,255,0.1);padding:5px 15px;border-radius:15px;font-size:0.9em}
.back{color:#fff;text-decoration:none;padding:5px 15px;background:rgba(255,255,255,0.15);border-radius:15px;font-size:0.9em}
canvas{border:2px solid rgba(255,255,255,0.2);border-radius:10px;margin-top:10px}
.question-area{background:rgba(255,255,255,0.1);padding:15px 30px;border-radius:15px;margin:10px 0;text-align:center}
.question{font-size:2em;margin-bottom:10px}
.options{display:flex;gap:10px;justify-content:center}
.opt{padding:10px 20px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);color:#fff;border-radius:10px;cursor:pointer;font-size:1.2em}
.opt:hover{background:rgba(255,255,255,0.25)}
.opt.correct{background:#4CAF50;border-color:#4CAF50}
.opt.wrong{background:#F44336;border-color:#F44336}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:10}
.box{background:linear-gradient(135deg,#FF6B6B,#FFD93D);padding:40px;border-radius:20px;text-align:center;max-width:400px}
.box h1{font-size:2em;margin-bottom:10px}.box p{margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:25px;font-size:1.1em;cursor:pointer;background:#fff;color:#333;font-weight:bold;margin:5px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top-bar">
<a href="index.html" class="back">← 返回</a>
<div class="info"><div class="info-item">你的距离: <span id="dist">0</span>m</div><div class="info-item">电脑: <span id="aiDist">0</span>m</div></div>
</div>
<canvas id="game" width="600" height="200"></canvas>
<div class="question-area">
<div class="question" id="question"></div>
<div class="options" id="options"></div>
</div>

<div class="overlay" id="start"><div class="box"><h1>🏎️ 数学赛车</h1><p>答对题目加速！<br>答错减速！先到终点赢！</p><button class="btn" onclick="startGame()">开始游戏</button></div></div>
<div class="overlay hidden" id="over"><div class="box"><h1 id="winTitle">游戏结束</h1><p id="winMsg"></p><button class="btn" onclick="startGame()">再来一次</button><a href="index.html" class="btn" style="background:rgba(255,255,255,0.3);color:#333;display:inline-block;text-decoration:none">返回菜单</a></div></div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const W=600,H=200,FINISH=500;
let playerDist,aiDist,playerSpeed,aiSpeed,running;
function init(){
playerDist=0;aiDist=0;playerSpeed=0;aiSpeed=2;running=true;
document.getElementById('dist').textContent=0;document.getElementById('aiDist').textContent=0;
nextQ();
}
function nextQ(){
const ops=['+','-','×'];const op=ops[Math.floor(Math.random()*3)];
let a,b,ans;
if(op==='+'){a=rand(1,20);b=rand(1,20);ans=a+b}
else if(op==='-'){a=rand(5,30);b=rand(1,a);ans=a-b}
else{a=rand(2,9);b=rand(2,9);ans=a*b}
document.getElementById('question').textContent=`${a} ${op} ${b} = ?`;
const opts=[ans];while(opts.length<4){const n=ans+rand(-5,10);if(n>0&&!opts.includes(n))opts.push(n)}
opts.sort(()=>Math.random()-0.5);
const div=document.getElementById('options');div.innerHTML='';
opts.forEach(o=>{
const btn=document.createElement('div');btn.className='opt';btn.textContent=o;
btn.addEventListener('click',()=>checkAnswer(btn,o,ans));
div.appendChild(btn);
});
}
function checkAnswer(btn,selected,correct){
document.querySelectorAll('.opt').forEach(o=>{if(parseInt(o.textContent)===correct)o.classList.add('correct')});
if(selected===correct){
playerSpeed=Math.min(10,playerSpeed+2);playSound(600,0.1);
btn.classList.add('correct');
}else{playerSpeed=Math.max(0,playerSpeed-1);playSound(200,0.2);btn.classList.add('wrong')}
setTimeout(nextQ,600);
}
function drawBg(){
X.fillStyle='#333';X.fillRect(0,0,W,H);
X.fillStyle='#555';X.fillRect(0,40,W,5);X.fillRect(0,95,W,5);X.fillRect(0,150,W,5);
// finish
X.fillStyle='#FFD93D';X.fillRect(FINISH,0,5,H);
X.fillStyle='#333';for(let i=0;i<H;i+=10){X.fillRect(FINISH,i,5,5)}
}
function drawCars(){
// player car
X.fillStyle='#4D96FF';
X.fillRect(playerDist-20,55,40,25);
X.fillStyle='#2196F3';X.fillRect(playerDist-15,50,10,5);X.fillRect(playerDist+5,50,10,5);
X.fillStyle='#333';X.fillRect(playerDist-25,65,8,10);X.fillRect(playerDist+17,65,8,10);
// AI car
X.fillStyle='#FF6B6B';
X.fillRect(aiDist-20,110,40,25);
X.fillStyle='#F44336';X.fillRect(aiDist-15,105,10,5);X.fillRect(aiDist+5,105,10,5);
X.fillStyle='#333';X.fillRect(aiDist-25,120,8,10);X.fillRect(aiDist+17,120,8,10);
// labels
X.fillStyle='#fff';X.font='12px sans-serif';X.textAlign='center';
X.fillText('你',playerDist,48);X.fillText('电脑',aiDist,103);
}
function update(){
if(!running)return;
playerDist+=playerSpeed*0.5;playerSpeed=Math.max(0,playerSpeed-0.02);
aiDist+=aiSpeed;aiSpeed=2+Math.random()*2;
document.getElementById('dist').textContent=Math.floor(playerDist);
document.getElementById('aiDist').textContent=Math.floor(aiDist);
if(playerDist>=FINISH){running=false;document.getElementById('winTitle').textContent='🎉 你赢了！';document.getElementById('winMsg').textContent='数学真棒！';document.getElementById('over').classList.remove('hidden');playSound(700,0.3)}
if(aiDist>=FINISH){running=false;document.getElementById('winTitle').textContent='电脑赢了';document.getElementById('winMsg').textContent='再试试！';document.getElementById('over').classList.remove('hidden');playSound(200,0.3)}
}
function draw(){drawBg();drawCars()}
function loop(){update();draw();requestAnimationFrame(loop)}
function startGame(){document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');init();loop()}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function playSound(f,d){try{const a=new(AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.value=0.1;o.start();g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
</script>
</body>
</html>
